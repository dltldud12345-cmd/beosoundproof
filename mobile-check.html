<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>mobile check</title>
<style>html,body{margin:0;background:#222;display:flex;justify-content:center;align-items:flex-start;height:100%}
iframe{width:390px;height:844px;border:0;background:#fff}</style></head>
<body><iframe id="fr" src="./blueprint.html?w=1500&d=1800&ds=front&v=3"></iframe>

</script></body></html>
