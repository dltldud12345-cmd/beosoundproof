<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베오방음 | 스마트스토어 상세페이지 미리보기</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="스마트스토어 상세페이지 비공개 미리보기.">
<meta name="theme-color" content="#14161A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171A'/%3E%3Cg fill='%23C0AE86'%3E%3Crect x='15' y='26' width='6' height='12' rx='3'/%3E%3Crect x='29' y='17' width='6' height='30' rx='3'/%3E%3Crect x='43' y='23' width='6' height='18' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:#F4F1EA}
  body{
    margin:0;background:#F4F1EA;color:#1B1A17;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:0;line-height:0;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .note{
    display:flex;align-items:center;gap:8px;
    font-size:12px;line-height:1.4;letter-spacing:.01em;
    background:#14161A;color:#EFE9DC;padding:8px 14px;
  }
  .note b{font-weight:700;color:#D4C09D;letter-spacing:.04em}
  .note span{color:#9A9488}
  .note .sp{flex:1}
  .note button{
    appearance:none;border:1px solid #3A3B3F;background:#232529;color:#F2EFE7;
    font:inherit;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;cursor:pointer;
  }
  .note button:hover{background:#2E3035}
  @media (max-width:520px){
    .note span{display:none}
    .note{padding:7px 11px;font-size:11px}
  }
  .detail{
    width:100%;max-width:860px;margin:0 auto;background:#F4F1EA;
    font-size:0;line-height:0;
  }
  .detail img{
    display:block;width:100%;max-width:860px;height:auto;margin:0 auto;
    border:0;vertical-align:top;
  }
  @media print{
    .note{display:none}
    .detail{max-width:none}
  }
</style>
</head>
<body>

<div class="note" id="note">
  <b>비공개 미리보기</b>
  <span>스마트스토어 상세페이지 · 검색 노출 없음 · 링크 공유용 아님</span>
  <span class="sp"></span>
  <button type="button" id="noteHide">숨기기</button>
</div>

<!-- 베오방음 스마트스토어 상세페이지 (860px · 9섹션 · 2026-11-25 심플·고급 개편)
     원본: assets/smartstore-preview/01-hero.png ~ 09-close.png
     이 페이지는 직접 URL로만 열리며 어디에도 링크하지 않습니다. -->
<main class="detail" id="detail">
  <img src="assets/smartstore-preview/01-hero.png" width="860" height="1130" fetchpriority="high" decoding="async"
       alt="베오방음 — 내 공간에 들이는 가장 조용한 프라이빗 룸">
  <img src="assets/smartstore-preview/02-statement.png" width="860" height="676" loading="lazy" decoding="async"
       alt="소리는 막고 빛과 분위기는 남깁니다 — 백색 알판 · 라인타공 · 아트보드">
  <img src="assets/smartstore-preview/03-why.png" width="860" height="1162" loading="lazy" decoding="async"
       alt="완성도는 디테일에서 갈립니다 — 직영 시공 · 세 가지 벽체 구조 · 모듈 체결">
  <img src="assets/smartstore-preview/04-lineup.png" width="860" height="905" loading="lazy" decoding="async"
       alt="세 가지 벽체 구조 — 슈퍼싱글 · 슈퍼싱글 플러스(정면만 2중) · 더블(부스 안에 부스)">
  <img src="assets/smartstore-preview/05-craft.png" width="860" height="1001" loading="lazy" decoding="async"
       alt="선은 곧게 빛은 부드럽게 — 라인타공 마감과 COB 매입등">
  <img src="assets/smartstore-preview/06-included.png" width="860" height="749" loading="lazy" decoding="async"
       alt="가격에 다 담았습니다 — 강화마루 · LED 조명 · 콘센트 · 시스템도어 · 라인타공 · 아트보드">
  <img src="assets/smartstore-preview/07-space.png" width="860" height="1503" loading="lazy" decoding="async"
       alt="방 하나가 나만의 공간이 됩니다 — 실제 시공 사진">
  <img src="assets/smartstore-preview/08-relocation.png" width="860" height="930" loading="lazy" decoding="async"
       alt="이사 가도 다시 씁니다 — 해체 · 운반 · 재설치">
  <img src="assets/smartstore-preview/09-close.png" width="860" height="1345" loading="lazy" decoding="async"
       alt="사진 세 장이면 견적이 됩니다 — 상담 안내와 자주 묻는 질문">
</main>

<script>
(function(){
  var b = document.getElementById('noteHide'), n = document.getElementById('note');
  if(!b || !n) return;
  b.addEventListener('click', function(){ n.remove(); });
})();
</script>
</body>
</html>
