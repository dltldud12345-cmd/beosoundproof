<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베오방음 | 스마트스토어 상세페이지 미리보기</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="스마트스토어 상세페이지 비공개 미리보기.">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171A'/%3E%3Cg fill='%232E9C86'%3E%3Crect x='15' y='26' width='6' height='12' rx='3'/%3E%3Crect x='29' y='17' width='6' height='30' rx='3'/%3E%3Crect x='43' y='23' width='6' height='18' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:#fff}
  body{
    margin:0;background:#fff;color:#0F172A;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:0;line-height:0;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 상단 안내 바 — 스크롤하면 함께 올라가고, 본문 흐름에는 영향 없음 */
  .note{
    display:flex;align-items:center;gap:8px;
    font-size:12px;line-height:1.4;letter-spacing:.01em;
    background:#14171A;color:#E8EDEB;padding:8px 14px;
  }
  .note b{font-weight:700;color:#7FD8C4;letter-spacing:.04em}
  .note span{color:#9AA3A9}
  .note .sp{flex:1}
  .note button{
    appearance:none;border:1px solid #3A434A;background:#232A2F;color:#F2F5F4;
    font:inherit;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;cursor:pointer;
  }
  .note button:hover{background:#2E383E}
  @media (max-width:520px){
    .note span{display:none}
    .note{padding:7px 11px;font-size:11px}
  }
  /* 상세페이지 본문 — 스마트스토어와 같은 세로 이미지 흐름 (여백·끊김 없이 붙여 쌓는다) */
  .detail{
    width:100%;max-width:860px;margin:0 auto;background:#fff;
    font-size:0;line-height:0;
  }
  .detail img{
    display:block;width:100%;max-width:860px;height:auto;margin:0 auto;
    border:0;vertical-align:top;
  }
  .detail a{display:block;font-size:0;line-height:0}
  @media print{
    .note{display:none}
    .detail{max-width:none}
  }
</style>
</head>
<body>

<div class="note" id="note">
  <b>비공개 미리보기</b>
  <span>스마트스토어 상세페이지 · 검색 노출 없음 · 링크 공유용 아님</span>
  <span class="sp"></span>
  <button type="button" id="noteHide">숨기기</button>
</div>

<!-- 베오방음 스마트스토어 상세페이지 (860px · 12섹션)
     원본: reports/smartstore-preview/860/01-hero.png ~ 12-cta.png
     이 페이지는 직접 URL로만 열리며 어디에도 링크하지 않습니다. -->
<main class="detail" id="detail">
  <img src="assets/smartstore-preview/01-hero.png" width="860" height="975" fetchpriority="high" decoding="async"
       alt="베오방음 상세페이지 1번 섹션 — 상단 히어로 — 방 치수 그대로, 소리는 밖으로 새지 않게 + 3가지 약속">
  <img src="assets/smartstore-preview/02-problem.png" width="860" height="651" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 2번 섹션 — 고객의 고민 5가지">
  <img src="assets/smartstore-preview/03-why-beo.png" width="860" height="607" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 3번 섹션 — 왜 베오방음 — 구조는 한 가지입니다">
  <img src="assets/smartstore-preview/04-lineup.png" width="860" height="766" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 4번 섹션 — 라인업 4종 · 규격">
  <img src="assets/smartstore-preview/05-included.png" width="860" height="798" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 5번 섹션 — 기본 포함 6가지">
  <img src="assets/smartstore-preview/06-project-window.png" width="860" height="1401" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 6번 섹션 — 옵션 — 천장 개폐형 프로젝트창 · 시창 · 방염">
  <img src="assets/smartstore-preview/07-finish-colors.png" width="860" height="1320" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 7번 섹션 — 마감 4조합 · 아트보드 5색 · 라인타공 8종">
  <img src="assets/smartstore-preview/08-process.png" width="860" height="869" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 8번 섹션 — 시공 과정 5단계">
  <img src="assets/smartstore-preview/09-cases.png" width="860" height="1191" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 9번 섹션 — 시공 사례 · 기관 레퍼런스 · 후기">
  <img src="assets/smartstore-preview/10-relocation.png" width="860" height="770" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 10번 섹션 — 이전·재설치">
  <img src="assets/smartstore-preview/11-faq.png" width="860" height="987" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 11번 섹션 — 자주 묻는 질문 8">
  <img src="assets/smartstore-preview/12-cta.png" width="860" height="708" loading="lazy" decoding="async"
       alt="베오방음 상세페이지 12번 섹션 — 상담 CTA — 사진 세 장이면 견적">
</main>

<script>
(function(){
  var b = document.getElementById('noteHide'), n = document.getElementById('note');
  if(!b || !n) return;
  b.addEventListener('click', function(){ n.remove(); });
})();
</script>
</body>
</html>
