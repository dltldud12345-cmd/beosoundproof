<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>bp mobile check</title>
<style>html,body{margin:0;background:#cfcac2}#f{width:390px;height:844px;border:0;display:block;background:#fff}</style>
</head>
<body>
<iframe id="f" src="/blueprint.html?w=2000&amp;d=2000&amp;gr=double"></iframe>
<script>
(function(){
  var f = document.getElementById('f');
  var z = +(new URLSearchParams(location.search).get('z') || 0);
  f.addEventListener('load', function(){
    var d;
    try { d = f.contentDocument; } catch(e){ return; }
    var g = d.getElementById('gate'); if(g) g.remove();
    d.querySelectorAll('.panel,.topbar').forEach(function(el){ el.style.display = 'none'; });
    var s = d.getElementById('sheets'); if(s) f.contentWindow.scrollTo(0, s.getBoundingClientRect().top + f.contentWindow.scrollY - 4);
    for(var i=0;i<z;i++){
      var b = d.querySelector('.sheet-wrap [data-zoom="in"]');
      if(b) b.click();
    }
  });
})();
</script>
</body>
</html>
