<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베오방음 통합 관리자</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="베오 관리자">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest-hub.json">
<style>
  :root{
    --ink:#14171A;
    --ink2:#2E353B;
    --body:#4B555D;
    --muted:#778087;
    --line:#E3DDD3;
    --line2:#EFEAE2;
    --bg:#F4F0E8;
    --paper:#FFFFFF;
    --soft:#FAF8F4;
    --accent:#2E9C86;
    --accent-d:#1E7564;
    --accent-t:#E7F3F0;
    --warn:#B94A2F;
    --warn-bg:#FDF0EC;
    --blue:#2563EB;
    --blue-bg:#EFF6FF;
    --shadow:0 1px 2px rgba(20,23,26,.04), 0 8px 24px -16px rgba(20,23,26,.14);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  img{display:block;max-width:100%}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding-top:env(safe-area-inset-top);
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:960px;margin:0 auto;padding:11px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{
    width:32px;height:32px;border-radius:10px;background:var(--ink);
    display:grid;place-items:center;flex:0 0 auto;
  }
  .brand-title{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .brand-sub{font-size:11.5px;font-weight:700;color:var(--accent-d);background:var(--accent-t);padding:3px 8px;border-radius:999px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .tbtn{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);
  }
  .tbtn:hover{border-color:var(--ink2);background:var(--soft)}
  .tbtn.danger{color:var(--warn)}

  /* Main */
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 24px}

  /* Login */
  .login-box{
    max-width:400px;margin:52px auto;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);
  }
  .login-box h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .login-box p{margin:8px 0 0;font-size:13.5px;color:var(--body)}
  .in{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 13px;background:#fff;font-size:15px;color:var(--ink);
  }
  .in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,156,134,.15)}
  .btn-primary{
    width:100%;height:46px;margin-top:10px;border:0;border-radius:12px;
    background:var(--ink);color:#fff;font-size:14.5px;font-weight:800;
  }
  .login-msg{margin-top:10px;font-size:12.5px;color:var(--warn);min-height:18px}

  /* KPI & Toolbar */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;
    text-align:left;
  }
  .kpi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-t);box-shadow:inset 0 0 0 1px var(--accent)}
  .kpi .kl{font-size:11.5px;font-weight:700;color:var(--muted)}
  .kpi[aria-pressed="true"] .kl{color:var(--accent-d)}
  .kpi .kv{margin-top:2px;font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .search-wrap{flex:1 1 220px;position:relative}
  .search-wrap input{
    width:100%;height:42px;border:1px solid var(--line);border-radius:12px;
    padding:0 36px 0 14px;background:#fff;font-size:14px;
  }
  .search-wrap input:focus{outline:0;border-color:var(--accent)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px;display:none;
  }
  .search-clear.show{display:block}

  /* Subtabs (market) */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stab{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--body);
  }
  .stab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* Cards */
  .grid{display:grid;gap:12px}
  .qsheet{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:15px;box-shadow:var(--shadow);
  }
  .qsheet.is-new{border-left:4px solid var(--accent)}
  .qs-head{
    display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;
    padding-bottom:11px;border-bottom:1px solid var(--line2);
  }
  .qs-who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .qs-name{font-size:17.5px;font-weight:800;letter-spacing:-.03em}
  .qs-phone{
    font-size:13px;font-weight:700;color:var(--accent-d);background:var(--accent-t);
    padding:4px 10px;border-radius:999px;
  }
  .qs-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .qs-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);padding:2px 6px;border-radius:6px;border:1px solid var(--line2)}

  .status-pills{display:flex;gap:4px;flex-wrap:wrap}
  .sp{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);
  }
  .sp.on[data-st="new"],.sp.on[data-st="active"]{background:var(--accent-t);border-color:var(--accent);color:var(--accent-d)}
  .sp.on[data-st="contacted"],.sp.on[data-st="reserved"]{background:var(--blue-bg);border-color:#93C5FD;color:var(--blue)}
  .sp.on[data-st="done"],.sp.on[data-st="sold"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .sp.on[data-st="pending"]{background:var(--warn-bg);border-color:#F3CFC6;color:var(--warn)}
  .sp.on[data-st="hidden"]{background:var(--soft);border-color:var(--line);color:var(--muted)}

  .alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .abadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px}
  .abadge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #F3CFC6}
  .abadge.info{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
  .abadge.link{background:var(--blue-bg);color:var(--blue);border:1px solid #BFDBFE}

  .spec-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
    margin-top:11px;background:var(--soft);border:1px solid var(--line2);
    border-radius:12px;padding:10px 12px;
  }
  .spec-item .sl{font-size:11px;font-weight:700;color:var(--muted)}
  .spec-item .sv{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:2px}

  .route{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:stretch;margin-top:10px}
  .rbox{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff}
  .rbox-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .rtag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
  .rtag.from{background:#FEF3C7;color:#92400E}
  .rtag.to{background:var(--accent-t);color:var(--accent-d)}
  .rmap{font-size:11.5px;font-weight:700;color:var(--muted)}
  .raddr{margin-top:6px;font-size:14px;font-weight:800;color:var(--ink)}
  .rsub{margin-top:3px;font-size:12.5px;color:var(--body)}
  .rsub .no-el{color:var(--warn);font-weight:800}
  .rarrow{display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:15px}

  .memo-box{
    margin-top:10px;padding:10px 12px;border-radius:12px;
    background:#FFFCF5;border:1px solid #EFE4CC;
    font-size:13.5px;line-height:1.55;color:var(--ink2);white-space:pre-wrap;
  }
  .memo-box a{color:var(--blue);text-decoration:underline}

  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-btn{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:74px;height:74px;background:var(--soft);flex:0 0 auto}
  .photo-btn img{width:100%;height:100%;object-fit:cover}

  .qs-foot{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);
  }
  .qacts{display:flex;flex-wrap:wrap;gap:6px}
  .abtn{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);
  }
  .abtn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
  .abtn.danger{color:var(--warn)}

  /* Hub Links Grid */
  .hub-sec-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:16px 2px 8px}
  .hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hub-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
    transition:transform .12s,border-color .15s;
  }
  .hub-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .hub-ico{font-size:24px;line-height:1}
  .hub-t{font-size:15.5px;font-weight:800;color:var(--ink)}
  .hub-d{font-size:12.5px;color:var(--muted);line-height:1.45}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

  /* Bottom Tab Bar (App style) */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-in{
    max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  }
  .bnav-btn{
    position:relative;border:0;background:none;padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:11px;font-weight:700;
  }
  .bnav-btn[aria-selected="true"]{color:var(--accent-d)}
  .bnav-ico{font-size:19px;line-height:1.1}
  .bnav-badge{
    position:absolute;top:5px;right:calc(50% - 22px);
    min-width:17px;height:17px;padding:0 5px;border-radius:999px;
    background:var(--warn);color:#fff;font-size:10px;font-weight:800;
    display:grid;place-items:center;
  }
  .bnav-badge[hidden]{display:none}

  /* Lightbox */
  .lb{position:fixed;inset:0;z-index:80;background:rgba(15,18,21,.92);display:grid;place-items:center;padding:16px}
  .lb[hidden]{display:none}
  .lb img{max-width:94vw;max-height:82vh;border-radius:12px;object-fit:contain}
  .lb-bar{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;background:rgba(20,23,26,.85);
    padding:8px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:700;
  }
  .lb-bar button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700}

  /* Toast */
  .toast{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:90;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:680px){
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .spec-grid{grid-template-columns:repeat(2,1fr)}
    .route{grid-template-columns:1fr;gap:6px}
    .rarrow{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 64 64"><g fill="#2E9C86"><rect x="10" y="22" width="8" height="20" rx="4"/><rect x="28" y="10" width="8" height="44" rx="4"/><rect x="46" y="18" width="8" height="28" rx="4"/></g></svg>
      </div>
      <span class="brand-title">베오방음 관리자</span>
      <span class="brand-sub" id="top-sub">통합 허브</span>
    </div>
    <div class="top-actions" id="top-actions" hidden>
      <button type="button" class="tbtn" id="btn-refresh">새로고침</button>
      <button type="button" class="tbtn danger" id="btn-logout">로그아웃</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="empty">불러오는 중입니다…</p>
</main>

<nav class="bottom-nav" id="bottom-nav" hidden aria-label="관리자 메뉴">
  <div class="bottom-nav-in">
    <button type="button" class="bnav-btn" data-nav="reloc" aria-selected="true">
      <span class="bnav-ico">🚚</span><span>이전설치</span>
      <span class="bnav-badge" id="badge-reloc" hidden>0</span>
    </button>
    <button type="button" class="bnav-btn" data-nav="newbooth" aria-selected="false">
      <span class="bnav-ico">🏗️</span><span>신규설치</span>
      <span class="bnav-badge" id="badge-newbooth" hidden>0</span>
    </button>
    <button type="button" class="bnav-btn" data-nav="market" aria-selected="false">
      <span class="bnav-ico">♻️</span><span>중고마켓</span>
      <span class="bnav-badge" id="badge-market" hidden>0</span>
    </button>
    <button type="button" class="bnav-btn" data-nav="hub" aria-selected="false">
      <span class="bnav-ico">📐</span><span>도면·사이트</span>
    </button>
  </div>
</nav>

<div class="lb" id="lb" hidden>
  <img id="lb-img" alt="사진 크게 보기">
  <div class="lb-bar">
    <button type="button" id="lb-prev">이전</button>
    <span id="lb-count">1 / 1</span>
    <button type="button" id="lb-next">다음</button>
    <button type="button" id="lb-close">닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var SB = {
    url: "https://jbqilpvxdzizumjvzgvm.supabase.co",
    key: "sb_publishable_4JZK0mjoMFnkU8A_QbW-Iw_hcd_F3ce"
  };
  var KEY_RELOC = "beo_relocation_admin_key";
  var KEY_MARKET = "beo_market_admin_key";
  var QUOTE_LABEL = { new: "신규", contacted: "연락완료", done: "완료" };
  var MARKET_LABEL = { active: "판매중", reserved: "예약중", sold: "판매완료", hidden: "숨김", pending: "검수대기" };
  var INQ_LABEL = { new: "신규", contacted: "연락완료", done: "완료" };

  var state = {
    adminKey: "",
    nav: "reloc", /* reloc | newbooth | market | hub */
    quotes: [],
    market: { listings: [], inquiries: [] },
    qStatus: "all",
    query: "",
    mkTab: "pending",
    lbPhotos: [],
    lbIdx: 0
  };

  var app = document.getElementById("app");
  var topActions = document.getElementById("top-actions");
  var bottomNav = document.getElementById("bottom-nav");
  var topSub = document.getElementById("top-sub");

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function digits(v){ return String(v || "").replace(/[^0-9]/g, ""); }
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }
  function rpc(name, body){
    return fetch(SB.url + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {
        "apikey": SB.key,
        "Authorization": "Bearer " + SB.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body || {}),
      cache: "no-store"
    }).then(function(res){
      return res.text().then(function(t){
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!res.ok) throw new Error((d && (d.message || d.error)) || ("요청 실패 (" + res.status + ")"));
        return d;
      });
    });
  }
  function fmtDate(s){
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d.getTime())) return "";
    var o = new Date(d.getTime() + 9 * 3600 * 1000);
    return o.getUTCFullYear() + "." + String(o.getUTCMonth()+1).padStart(2,"0") + "." + String(o.getUTCDate()).padStart(2,"0")
      + " " + String(o.getUTCHours()).padStart(2,"0") + ":" + String(o.getUTCMinutes()).padStart(2,"0");
  }
  function fmtDay(s){ return s ? String(s).replace(/-/g, ".") : "미정"; }
  function sizeLine(q){
    var p = [q.width_mm, q.depth_mm, q.height_mm].map(function(v){
      return v ? Number(v).toLocaleString("ko-KR") : "?";
    });
    if (p[0] === "?" && p[1] === "?" && p[2] === "?") return "크기 미기재";
    return p.join(" × ") + " mm";
  }
  function naverMapUrl(addr){
    return "https://map.naver.com/p/search/" + encodeURIComponent(addr || "");
  }
  function linkify(v){
    return esc(v).replace(/(https?:\/\/[^\s<]+)/g, function(u){
      return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
  }
  function isNewBoothQuote(q){
    return String(q.brand || "").indexOf("[신규부스]") === 0;
  }
  function parseMemo(raw){
    var lines = String(raw || "").split(/\r?\n/);
    var listingUrl = "", aircon = "", pay = "", rest = [];
    lines.forEach(function(line){
      var t = line.trim();
      if (t.indexOf("[매물 링크]") === 0) listingUrl = t.replace("[매물 링크]", "").trim();
      else if (t.indexOf("[에어컨]") === 0) aircon = t.replace("[에어컨]", "").trim();
      else if (t.indexOf("[결제·증빙]") === 0) pay = t.replace("[결제·증빙]", "").trim();
      else rest.push(line);
    });
    return { listingUrl: listingUrl, aircon: aircon, pay: pay, note: rest.join("\n").trim() };
  }
  function formatCopyText(q){
    var pm = parseMemo(q.memo);
    var isNewB = isNewBoothQuote(q);
    var out = [
      "[베오방음 " + (isNewB ? "신규설치" : "이전설치") + " 상담요청서 #" + String(q.id || "").slice(0, 8).toUpperCase() + "]",
      "• 고객: " + (q.customer_name || "-") + " (" + (q.customer_phone || "-") + ")",
      "• 상태: " + (QUOTE_LABEL[q.status] || q.status || "신규") + " · 접수: " + fmtDate(q.created_at),
      "• 부스: " + (isNewB ? "신규 부스" : (q.booth_type || "유형 미상")) + " / " + (q.brand || "-") + " / " + sizeLine(q)
    ];
    if (!isNewB) {
      out.push("• 해체(출발): " + (q.from_region || "-") + (q.from_floor ? " " + q.from_floor : "") + (q.from_elevator ? " (엘베 " + q.from_elevator + ")" : ""));
    }
    out.push("• 설치(도착): " + (q.to_region || "-") + (q.to_floor ? " " + q.to_floor : "") + (q.to_elevator ? " (엘베 " + q.to_elevator + ")" : ""));
    out.push("• 희망일: " + fmtDay(q.desired_date) + (q.date_flexible ? " (조율 가능)" : ""));
    if (pm.aircon) out.push("• 에어컨: " + pm.aircon);
    if (pm.pay) out.push("• 결제·증빙: " + pm.pay);
    if (pm.listingUrl) out.push("• 매물링크: " + pm.listingUrl);
    if (pm.note) out.push("• 메모: " + pm.note);
    return out.join("\n");
  }

  function saveKey(k){
    try { localStorage.setItem(KEY_RELOC, k); localStorage.setItem(KEY_MARKET, k); } catch (e) {}
  }
  function clearKey(){
    try { localStorage.removeItem(KEY_RELOC); localStorage.removeItem(KEY_MARKET); } catch (e) {}
  }
  function loadSavedKey(){
    try { return localStorage.getItem(KEY_RELOC) || localStorage.getItem(KEY_MARKET) || ""; } catch (e) { return ""; }
  }

  function renderLogin(errText){
    topActions.hidden = true;
    bottomNav.hidden = true;
    topSub.textContent = "로그인";
    app.innerHTML = ''
      + '<form class="login-box" id="login-form">'
      + '  <h1>베오방음 통합 관리자</h1>'
      + '  <p>관리자 키를 한 번 입력하면 이전설치·신규설치·중고마켓을 한 곳에서 바로 관리할 수 있습니다.</p>'
      + '  <div style="margin-top:16px">'
      + '    <input class="in" id="key-in" type="password" placeholder="관리자 키 입력" autocomplete="off">'
      + '  </div>'
      + '  <button class="btn-primary" type="submit">관리자 열기</button>'
      + '  <div class="login-msg" id="login-msg">' + esc(errText || "") + '</div>'
      + '</form>';
    var form = document.getElementById("login-form");
    var input = document.getElementById("key-in");
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var k = (input.value || "").trim();
      if (!k) { document.getElementById("login-msg").textContent = "관리자 키를 입력해 주세요."; return; }
      state.adminKey = k;
      document.getElementById("login-msg").textContent = "확인 중…";
      loadAll(function(ok){
        if (ok) {
          saveKey(k);
          render();
        } else {
          state.adminKey = "";
          document.getElementById("login-msg").textContent = "관리자 키가 맞지 않습니다.";
        }
      });
    });
    input.focus();
  }

  function loadAll(cb){
    Promise.all([
      rpc("relocation_admin", { p_key: state.adminKey, p_action: "list" }),
      rpc("market_admin", { p_key: state.adminKey, p_action: "list" })
    ]).then(function(results){
      var r1 = results[0], r2 = results[1];
      if (!r1 || !r1.ok || !r2 || !r2.ok) {
        if ((r1 && r1.error === "unauthorized") || (r2 && r2.error === "unauthorized")) {
          clearKey();
          state.adminKey = "";
        }
        if (cb) return cb(false);
        renderLogin("관리자 키가 만료되었거나 맞지 않습니다.");
        return;
      }
      state.quotes = Array.isArray(r1.quotes) ? r1.quotes : [];
      state.market = {
        listings: Array.isArray(r2.listings) ? r2.listings : [],
        inquiries: Array.isArray(r2.inquiries) ? r2.inquiries : []
      };
      if (cb) return cb(true);
      render();
    }).catch(function(err){
      if (cb) return cb(false);
      app.innerHTML = '<div class="empty">불러오지 못했습니다: ' + esc(err.message) + '</div>';
    });
  }

  function updateBadges(){
    var relocNew = state.quotes.filter(function(q){ return !isNewBoothQuote(q) && (q.status || "new") === "new"; }).length;
    var newBNew = state.quotes.filter(function(q){ return isNewBoothQuote(q) && (q.status || "new") === "new"; }).length;
    var mkCount = state.market.listings.filter(function(l){ return l.status === "pending"; }).length
      + state.market.inquiries.filter(function(i){ return i.status === "new"; }).length;

    setBadge("badge-reloc", relocNew);
    setBadge("badge-newbooth", newBNew);
    setBadge("badge-market", mkCount);
  }
  function setBadge(id, n){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = n > 99 ? "99+" : String(n);
    el.hidden = n <= 0;
  }

  function render(){
    topActions.hidden = false;
    bottomNav.hidden = false;
    updateBadges();

    Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-nav") === state.nav ? "true" : "false");
    });

    if (state.nav === "reloc") {
      topSub.textContent = "이전설치";
      renderQuotesTab(false);
    } else if (state.nav === "newbooth") {
      topSub.textContent = "신규설치";
      renderQuotesTab(true);
    } else if (state.nav === "market") {
      topSub.textContent = "중고마켓";
      renderMarketTab();
    } else {
      topSub.textContent = "도면·사이트";
      renderHubTab();
    }
  }

  function renderQuotesTab(isNewTab){
    var base = state.quotes.filter(function(q){ return isNewTab ? isNewBoothQuote(q) : !isNewBoothQuote(q); });
    var counts = {
      all: base.length,
      "new": base.filter(function(q){ return (q.status || "new") === "new"; }).length,
      contacted: base.filter(function(q){ return q.status === "contacted"; }).length,
      done: base.filter(function(q){ return q.status === "done"; }).length
    };
    var qLower = state.query.trim().toLowerCase();
    var filtered = base.filter(function(q){
      if (state.qStatus !== "all" && (q.status || "new") !== state.qStatus) return false;
      if (!qLower) return true;
      return [q.customer_name, q.customer_phone, q.brand, q.booth_type, q.from_region, q.to_region, q.memo, q.id].join(" ").toLowerCase().indexOf(qLower) !== -1;
    });

    var kpis = [
      ["all", "전체", counts.all],
      ["new", "신규 접수", counts["new"]],
      ["contacted", "연락완료", counts.contacted],
      ["done", "진행완료", counts.done]
    ].map(function(k){
      return '<button type="button" class="kpi" data-qtab="' + k[0] + '" aria-pressed="' + (state.qStatus === k[0] ? "true" : "false") + '">'
        + '<div class="kl">' + k[1] + '</div><div class="kv">' + k[2] + '</div></button>';
    }).join("");

    var cardsHtml = filtered.length
      ? filtered.map(function(q){ return renderQuoteCard(q, isNewTab); }).join("")
      : '<div class="empty">' + (base.length ? "조건에 맞는 요청이 없습니다." : (isNewTab ? "신규 부스 견적 요청이 없습니다." : "이전설치 견적 요청이 없습니다.")) + '</div>';

    app.innerHTML = ''
      + '<div class="kpi-row">' + kpis + '</div>'
      + '<div class="toolbar">'
      + '  <div class="search-wrap">'
      + '    <input id="q-search" type="search" placeholder="고객명, 연락처, 지역, 메모 검색…" value="' + esc(state.query) + '">'

      + '  </div>'

      + '  <a class="hub-card" href="quote.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">🏗️</div><div class="hub-t">신규부스 고객 접수폼</div>'
      + '    <div class="hub-d">고객에게 링크 전달용 (접수 시 신규설치 탭에 표시)</div>'
      + '  </a>'
      + '  <a class="hub-card" href="relocation-admin.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">📋</div><div class="hub-t">이전설치 단독 뷰어</div>'
      + '    <div class="hub-d">이전설치 상담요청서만 단독으로 띄워두는 화면</div>'
      + '  </a>'
      + '</div>';
  }

  function bindQuoteEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-qtab]"), function(b){
      b.addEventListener("click", function(){ state.qStatus = b.getAttribute("data-qtab"); render(); });
    });
    var search = document.getElementById("q-search");
    var clearBtn = document.getElementById("q-clear");
    if (search) {
      search.addEventListener("input", function(){
        state.query = search.value;
        var pos = search.selectionStart;
        render();
        var s2 = document.getElementById("q-search");
        if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    if (clearBtn) clearBtn.addEventListener("click", function(){ state.query = ""; render(); });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qid"), st = b.getAttribute("data-qst");
        b.disabled = true;
        rpc("relocation_admin", { p_key: state.adminKey, p_action: "status", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("'" + (QUOTE_LABEL[st] || st) + "'(으)로 변경했어요");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qcopy]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qcopy");
        var q = state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!q) return;
        copyText(formatCopyText(q));
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdel");
        if (!confirm("이 상담요청서를 삭제할까요? 되돌릴 수 없습니다.")) return;
        b.disabled = true;
        rpc("relocation_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    bindLightbox();
  }

  function bindMarketEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-mktab]"), function(b){
      b.addEventListener("click", function(){ state.mkTab = b.getAttribute("data-mktab"); render(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkid"), st = b.getAttribute("data-mkst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "status", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("매물 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkdel");
        if (!confirm("이 매물을 완전히 삭제할까요?")) return;
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-inqst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-inqid"), st = b.getAttribute("data-inqst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "inquiry", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("문의 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    bindLightbox();
  }

  function bindLightbox(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-lb-id]"), function(b){
      b.addEventListener("click", function(){
        var type = b.getAttribute("data-lb-type");
        var id = b.getAttribute("data-lb-id");
        var idx = Number(b.getAttribute("data-lb-idx") || 0);
        var item = type === "market"
          ? state.market.listings.find(function(x){ return String(x.id) === String(id); })
          : state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!item || !Array.isArray(item.photos) || !item.photos.length) return;
        openLb(item.photos, idx);
      });
    });
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("요청서 요약 복사 완료!"); })
        .catch(function(){ fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("요청서 요약 복사 완료!"); } catch (e) { alert("복사 실패"); }
    document.body.removeChild(ta);
  }

  var lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbCount = document.getElementById("lb-count");
  function openLb(photos, idx){
    state.lbPhotos = photos; state.lbIdx = Math.max(0, Math.min(idx, photos.length - 1));
    updateLb(); lb.hidden = false;
  }
  function updateLb(){
    lbImg.src = state.lbPhotos[state.lbIdx];
    lbCount.textContent = (state.lbIdx + 1) + " / " + state.lbPhotos.length;
  }
  document.getElementById("lb-prev").addEventListener("click", function(){ state.lbIdx = (state.lbIdx - 1 + state.lbPhotos.length) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-next").addEventListener("click", function(){ state.lbIdx = (state.lbIdx + 1) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-close").addEventListener("click", function(){ lb.hidden = true; });
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.hidden = true; });

  Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ state.nav = b.getAttribute("data-nav"); state.qStatus = "all"; render(); window.scrollTo(0, 0); });
  });
  document.getElementById("btn-refresh").addEventListener("click", function(){ toast("새로고침 중…"); loadAll(); });
  document.getElementById("btn-logout").addEventListener("click", function(){ clearKey(); state.adminKey = ""; renderLogin(); });

  state.adminKey = loadSavedKey();
  if (!state.adminKey) renderLogin();
  else loadAll();
})();
</script>
</body>
</html>
