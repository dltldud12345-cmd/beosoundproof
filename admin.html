<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베오방음 통합 관리자</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="베오 관리자">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171A'/%3E%3Cg fill='%232E9C86'%3E%3Crect x='15' y='26' width='6' height='12' rx='3'/%3E%3Crect x='29' y='17' width='6' height='30' rx='3'/%3E%3Crect x='43' y='23' width='6' height='18' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=5">
<link rel="manifest" href="/manifest-hub.json">
<style>
  :root{
    --ink:#14171A;
    --ink2:#2E353B;
    --body:#4B555D;
    --muted:#778087;
    --line:#E3DDD3;
    --line2:#EFEAE2;
    --bg:#F4F0E8;
    --paper:#FFFFFF;
    --soft:#FAF8F4;
    --accent:#2E9C86;
    --accent-d:#1E7564;
    --accent-t:#E7F3F0;
    --warn:#B94A2F;
    --warn-bg:#FDF0EC;
    --blue:#2563EB;
    --blue-bg:#EFF6FF;
    --shadow:0 1px 2px rgba(20,23,26,.04), 0 8px 24px -16px rgba(20,23,26,.14);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  img{display:block;max-width:100%}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding-top:env(safe-area-inset-top);
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:960px;margin:0 auto;padding:11px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
  .brand-logo{height:24px;width:auto;max-width:170px;object-fit:contain;flex:0 1 auto;min-width:0}
  .brand-mark{
    width:32px;height:32px;border-radius:10px;background:var(--ink);
    display:grid;place-items:center;flex:0 0 auto;
  }
  .brand-title{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font-size:11.5px;font-weight:700;color:var(--accent-d);background:var(--accent-t);padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:nowrap}
  .tbtn{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--ink2);background:var(--soft)}
  .tbtn.danger{color:var(--warn)}
  @media (max-width:480px){
    .topbar-in{padding:8px 12px;gap:8px}
    .brand{gap:6px}
    .brand-logo{height:19px;max-width:108px}
    .brand-sub{font-size:10.5px;padding:2px 7px}
    .tbtn{padding:6px 9px;font-size:11.5px;border-radius:9px}
    .top-actions{gap:5px}
  }
  @media (max-width:360px){
    .brand-logo{height:17px;max-width:92px}
    .brand-sub{display:none}
  }

  /* Main */
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 24px}

  /* Login */
  .login-box{
    max-width:400px;margin:52px auto;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);
  }
  .login-logo{height:30px;width:auto;max-width:100%;margin-bottom:16px}
  .login-box h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .login-box p{margin:8px 0 0;font-size:13.5px;color:var(--body)}
  .in{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 13px;background:#fff;font-size:15px;color:var(--ink);
  }
  .in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,156,134,.15)}
  .btn-primary{
    width:100%;height:46px;margin-top:10px;border:0;border-radius:12px;
    background:var(--ink);color:#fff;font-size:14.5px;font-weight:800;
  }
  .login-msg{margin-top:10px;font-size:12.5px;color:var(--warn);min-height:18px}

  /* KPI & Toolbar */
  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;
    text-align:left;
  }
  .kpi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-t);box-shadow:inset 0 0 0 1px var(--accent)}
  .kpi .kl{font-size:11.5px;font-weight:700;color:var(--muted)}
  .kpi[aria-pressed="true"] .kl{color:var(--accent-d)}
  .kpi .kv{margin-top:2px;font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .search-wrap{flex:1 1 220px;position:relative}
  .search-wrap input{
    width:100%;height:42px;border:1px solid var(--line);border-radius:12px;
    padding:0 36px 0 14px;background:#fff;font-size:14px;
  }
  .search-wrap input:focus{outline:0;border-color:var(--accent)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px;display:none;
  }
  .search-clear.show{display:block}

  /* Subtabs (market) */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stab{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--body);
  }
  .stab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* Cards */
  .grid{display:grid;gap:12px}
  .qsheet{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:15px;box-shadow:var(--shadow);
  }
  .qsheet.is-new{border-left:4px solid var(--accent)}
  .qs-head{
    display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;
    padding-bottom:11px;border-bottom:1px solid var(--line2);
  }
  .qs-who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .qs-name{font-size:17.5px;font-weight:800;letter-spacing:-.03em}
  .qs-phone{
    font-size:13px;font-weight:700;color:var(--accent-d);background:var(--accent-t);
    padding:4px 10px;border-radius:999px;
  }
  .qs-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .qs-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);padding:2px 6px;border-radius:6px;border:1px solid var(--line2)}

  .status-pills{display:flex;gap:4px;flex-wrap:wrap}
  .sp{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);
  }
  .sp.on[data-st="new"],.sp.on[data-st="active"]{background:var(--accent-t);border-color:var(--accent);color:var(--accent-d)}
  .sp.on[data-st="contacted"],.sp.on[data-st="reserved"]{background:var(--blue-bg);border-color:#93C5FD;color:var(--blue)}
  .sp.on[data-st="done"],.sp.on[data-st="sold"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .sp.on[data-st="pending"]{background:var(--warn-bg);border-color:#F3CFC6;color:var(--warn)}
  .sp.on[data-st="hidden"]{background:var(--soft);border-color:var(--line);color:var(--muted)}
  .sp.on[data-st="talk"]{background:var(--blue-bg);border-color:#93C5FD;color:var(--blue)}
  .sp.on[data-st="deposit"]{background:#FFF7E6;border-color:#F2C877;color:#8A5A00}
  .sp.on[data-st="reserved"]{background:#F1EEFB;border-color:#C4B5FD;color:#5B3FB8}
  .sp.on[data-st="done"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .stage-bar{display:flex;gap:4px;flex-wrap:nowrap;margin-top:10px;width:100%;max-width:100%;min-width:0}
  .stage-bar .sp{flex:0 0 auto;min-width:0;padding:6px 9px;font-size:12.5px;letter-spacing:-.02em;white-space:nowrap;text-align:center}
  .stage-tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--accent-t);color:var(--accent-d)}
  .stage-tag[data-st="talk"]{background:var(--blue-bg);color:var(--blue)}
  .stage-tag[data-st="deposit"]{background:#FFF7E6;color:#8A5A00}
  .stage-tag[data-st="reserved"]{background:#F1EEFB;color:#5B3FB8}
  .stage-tag[data-st="done"]{background:var(--ink);color:#fff}

  .sim-box{margin-top:10px;border:1px solid #C9E4DC;background:#F3FAF7;border-radius:12px;padding:10px 12px}
  .sim-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sim-h b{font-size:12.5px;font-weight:800;color:var(--accent-d)}
  .sim-h span{font-size:11px;color:var(--muted);font-weight:700}
  .sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .sim-item{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:6px 8px;min-width:0}
  .sim-item span{display:block;font-size:10px;font-weight:700;color:var(--muted)}
  .sim-item b{display:block;margin-top:1px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .inst-row{display:flex;align-items:center;gap:7px;margin-top:10px;padding:10px 11px;border:1px dashed #CFE0DA;background:#FAFDFB;border-radius:12px;flex-wrap:wrap;box-sizing:border-box;max-width:100%;overflow:hidden}
  .inst-l{display:flex;flex-direction:column;margin-right:2px}
  .inst-l b{font-size:12px;font-weight:800;color:var(--accent-d)}
  .inst-l small{font-size:10px;font-weight:700;color:var(--muted)}
  .inst-in{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 6px;height:38px;box-sizing:border-box;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;max-width:100%;min-width:0}
  .inst-in:focus{outline:0;border-color:var(--accent)}
  .inst-row .ics{margin-left:auto;white-space:nowrap;font-size:11.5px;font-weight:800;padding:7px 10px;height:38px;box-sizing:border-box}
  @media (max-width:680px){
    .inst-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:6px}
    .inst-l{grid-column:1 / -1;margin-right:0}
    .inst-in{width:100% !important;max-width:100% !important;min-width:0 !important;display:block;text-align:center;overflow:hidden}
    .inst-row .ics{grid-column:1 / -1;margin-left:0;width:100%;justify-content:center}
  }

  .abtn.done{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
  .abtn.undo{background:#FFF9EC;border-color:#EFD9A6;color:#8A5A00;font-weight:800}
  .sabtn.undo{background:#FFF9EC;border-color:#EFD9A6}
  .stage-hint{margin-top:7px;font-size:11px;font-weight:700;color:#8A5A00;background:#FFF9EC;border:1px dashed #EFD9A6;border-radius:9px;padding:7px 10px;line-height:1.45}

  /* 📣 홍보 소재 체크 */
  .promo-row{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 10px;border:1px dashed #D9D1C2;border-radius:10px;background:#FAF9F6;font-size:12px;font-weight:800;color:var(--body2,#4B555D);cursor:pointer;line-height:1.3;flex-wrap:wrap}
  .promo-row.on{background:#FFF7E6;border-color:#F2C877;color:#8A5A00}
  .promo-row input{width:17px;height:17px;margin:0;flex:0 0 auto;accent-color:#B4622A}
  .promo-row small{font-weight:700;font-size:10.5px;color:var(--muted)}
  .promo-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:#FFF7E6;color:#8A5A00;border:1px solid #F2C877;white-space:nowrap}

  /* 계약 금액 + 계약 안내서 */
  .money-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:11px 12px;border:1px dashed #E3D6BF;background:#FFFCF5;border-radius:12px;min-width:0;max-width:100%;overflow:hidden}
  .pay-line{grid-column:1 / -1;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
  .pay-line label{font-size:10.5px;font-weight:800;color:#8A6A1F;flex:0 0 auto}
  .pay-chips{display:flex;gap:5px;flex-wrap:wrap;max-width:100%}
  .pay-chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .pay-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pay-hint{font-size:10px;font-weight:700;color:var(--muted);flex:1 1 100%;line-height:1.35}
  .vat-note{grid-column:1 / -1;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4;min-width:0}
  .money-profit{margin-top:2px;color:var(--ink2)}
  .money-profit b{font-weight:800}
  .money-profit b.plus{color:#17663C}
  .money-profit b.loss{color:#8E2020}
  .money-item{display:grid;gap:4px;min-width:0;align-content:start}
  .money-item.span2{grid-column:span 2}
  .money-item label{font-size:10px;font-weight:800;color:#8A6A1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .money-item input{width:100%;min-width:0;height:36px;box-sizing:border-box;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:13.5px;font-weight:800;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .money-item input:focus{outline:0;border-color:var(--accent)}
  .money-item .amt{min-height:36px;display:flex;align-items:center;justify-content:flex-end;font-size:14px;font-weight:800;color:var(--ink2);text-align:right;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .money-item .amt.strong{font-size:15px;color:var(--accent-d)}
  .money-hint{font-size:10px;font-weight:700;color:var(--accent-d);text-align:right}
  .money-hint:empty{display:none}
  .money-item .bal{min-height:36px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:15.5px;font-weight:800;color:var(--accent-d);text-align:right;padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .money-item .bal small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-left:0;margin-top:2px}

  /* 📅 설치 일정 */
  .sched-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .sched-sum .ss{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .sched-sum .ss b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .sched-sum .ss span{font-size:11.5px;font-weight:700;color:var(--muted)}
  .sched-day{display:flex;align-items:baseline;gap:8px;margin:14px 2px 7px}
  .sched-day b{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
  .sched-day span{font-size:11.5px;font-weight:700;color:var(--muted)}
  .sched-day.is-today b{color:var(--accent-d)}
  .sched-day.is-today b::before{content:"● ";font-size:9px;vertical-align:2px}
  .srow{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .srow.is-done{opacity:.62}
  .srow-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .srow-left{flex:1 1 auto;min-width:0}
  .stime{font-size:13.5px;font-weight:800;color:var(--accent-d);font-variant-numeric:tabular-nums;margin-right:4px}
  .smain{min-width:0}
  .stitle{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .stitle b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
  .stitle em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .stype{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:#FEF3C7;color:#92400E}
  .stype.new{background:var(--accent-t);color:var(--accent-d)}
  .saddr{margin-top:4px;font-size:12.5px;color:var(--body);line-height:1.35}
  .spay{display:flex;flex-wrap:wrap;gap:4px;margin-top:-1px}
  .spay > span{font-size:11px;font-weight:700;color:var(--body);background:#FAF9F6;border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .spay b{font-weight:800;color:var(--ink)}
  .spay-m{background:var(--soft)!important;border-color:var(--line2)!important;color:var(--ink2)!important;font-weight:800!important}
  .spay-m.unset{background:#fff!important;color:var(--muted)!important;font-weight:700!important}
  .spay .muted b{color:var(--muted);font-weight:700}
  .spay-br{display:none}
  @media (max-width:480px){ .spay-br{display:block;flex:0 0 100%;height:0} }
  .sstage{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--accent-t);color:var(--accent-d)}
  .sstage[data-st="talk"]{background:var(--blue-bg);color:var(--blue)}
  .sstage[data-st="deposit"]{background:#FFF7E6;color:#8A5A00}
  .sstage[data-st="reserved"]{background:#F1EEFB;color:#5B3FB8}
  .sstage[data-st="done"]{background:var(--ink);color:#fff}
  .sinline{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1.05fr) minmax(0,.9fr);gap:6px;align-items:center;width:100%;max-width:100%;overflow:hidden}
  .sinline .sin,.sstage-sel{width:100%;min-width:0;max-width:100%;height:38px;box-sizing:border-box;border:1px solid var(--line);background:#FAF9F6;border-radius:9px;padding:4px 6px;font-size:12.5px;font-weight:700;color:var(--ink2);-webkit-appearance:none;appearance:none;text-align:center;font-variant-numeric:tabular-nums}
  .sstage-sel{font-weight:800;color:var(--ink);background:#fff}
  .sacts{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:430px){
    .srow-top{flex-wrap:wrap}
    .srow-left{flex:1 1 100%}
    .sacts{width:100%;order:2;margin-top:2px;gap:6px}
    .sacts .sabtn{min-width:36px;height:34px;box-sizing:border-box}
  }
  .sabtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .sabtn.done{border-color:var(--accent);background:var(--accent);color:#fff}
  .sched-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;background:#F3F1EC;padding:4px;border-radius:12px;border:1px solid var(--line)}
  .sched-mode button{border:0;background:transparent;border-radius:9px;padding:8px;font-size:12.5px;font-weight:800;color:var(--muted)}
  .sched-mode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

<script>
(function(){
  "use strict";

  var SB = {
    url: "https://jbqilpvxdzizumjvzgvm.supabase.co",
    key: "sb_publishable_4JZK0mjoMFnkU8A_QbW-Iw_hcd_F3ce"
  };
  var KEY_RELOC = "beo_relocation_admin_key";
  var KEY_MARKET = "beo_market_admin_key";
  var PIPE_KEY = "beo-pipeline-v1";        /* 상세 단계·설치일 — 이 기기 저장(DB status와 함께) */
  var CAP_KEY = "beo-pipeline-db-cap";     /* update 액션이 되는 서버인지 한 번만 확인해 기억 */
  var QUOTE_LABEL = { new: "신규", contacted: "연락완료", done: "설치 완료" };
  var MARKET_LABEL = { active: "판매중", reserved: "예약중", sold: "판매완료", hidden: "숨김", pending: "검수대기" };
  var INQ_LABEL = { new: "신규", contacted: "연락완료", done: "완료" };
  /* 진행 단계 — 화면표시 5단계 ↔ DB status(new/contacted/done) 안전 매핑 */
  var STAGES = [
    { v: "new",      label: "신규",        db: "new" },
    { v: "talk",     label: "상담중",      db: "contacted" },
    { v: "deposit",  label: "계약금 입금",  db: "contacted" },
    { v: "reserved", label: "예약중",      db: "contacted" },
    { v: "done",     label: "설치 완료",    db: "done" }
  ];
  var STAGE_BY_V = {};
  STAGES.forEach(function(s){ STAGE_BY_V[s.v] = s; });

  /* ---------- 이 기기 저장 (진행 단계 · 설치 일시) ---------- */
  function readPipe(){
    try { return JSON.parse(localStorage.getItem(PIPE_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function writePipe(o){
    try { localStorage.setItem(PIPE_KEY, JSON.stringify(o)); } catch (e) {}
  }
  function pipeOf(id){ return readPipe()[id] || {}; }
  function setPipe(id, patch){
    var o = readPipe();
    o[id] = Object.assign({}, o[id] || {}, patch, { at: new Date().toISOString() });
    writePipe(o);
  }
  function effectiveQuote(q){
    var ov = pipeOf(q.id).ov;
    if (!ov) return q;
    return Object.assign({}, q, ov);
  }
  function stageOf(q){
    var p = pipeOf(q.id);
    if (p.stage && STAGE_BY_V[p.stage]) return p.stage;
    var tag = parseMemo(q.memo).stage;
    if (tag){
      var hit = STAGES.filter(function(s){ return s.label === tag; })[0];
      if (hit) return hit.v;
    }
    if ((q.status || "new") === "done") return "done";
    if (q.status === "contacted") return "talk";
    return "new";
  }
  function installOf(q){
    var p = pipeOf(q.id);
    var date = p.installDate || "";
    var time = p.installTime || "";
    if (!date){
      var t = parseMemo(q.memo).install;
      if (t){ var m = t.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); if (m){ date = m[1]; time = m[2] || ""; } }
    }
    return { date: date, time: time };
  }
  /* ---------- 계약 금액 (총액 · 부가세 · 공급가액 · 계약금 · 잔금 · 결제수단) ---------- */
  /* 입력은 고객에게 실제로 받는 총액(부가세 포함 기준).
     현금결제는 부가세 0원, 카드결제 · 세금계산서 · 현금영수증(및 미정)은 부가세 = 총액 ÷ 11. */
  var PAY_OPTS = ["카드결제", "세금계산서", "현금영수증", "현금결제"];
  var VAT_RATE = 0.1;      /* 예전 ‘공급가액 기준’ 입력에만 쓰는 10% — 새 입력은 부가세 = 총액 ÷ 11 */
  function vatRateFor(pay){ return normalizePay(pay) === "현금결제" ? 0 : VAT_RATE; }
  function normalizePay(v){
    var s = String(v == null ? "" : v).trim();
    if (!s) return "";
    if (/현금영수증/.test(s)) return "현금영수증";
    if (/세금계산서/.test(s)) return "세금계산서";
    if (/카드/.test(s)) return "카드결제";
    if (/현금결제/.test(s)) return "현금결제";
    return "";   /* 예전 ‘현금’ 표기는 그대로 미정으로 둔다 — 새 현금결제는 버튼으로만 */
  }
  function payOf(q){
    var p = pipeOf(q.id);
    if (Object.prototype.hasOwnProperty.call(p, "pay")) return normalizePay(p.pay);
    var pay2 = normalizePay(parseMemo(q.memo).pay);
    if (pay2) return pay2;
    var m = String(q.memo || "").match(/\[결제·증빙\]\s*([^\n\r]+)/);
    return m ? normalizePay(m[1]) : "";
  }
  /* 금액 입력 해석 — 500000(원)은 그대로, 1000 미만 정수는 만 원 단위(예: 50 → 500,000) */
  function amountOf(raw){
    var t = String(raw == null ? "" : raw).replace(/[^0-9.]/g, "");
    if (t === "" || t === ".") return "";
    var n = Number(t);
    if (!isFinite(n) || n < 0) return "";
    if (n > 0 && n < 1000) return Math.round(n * 10000);
    return Math.round(n);
  }
  /* 계약 금액 — 입력은 총액(고객에게 실제로 받는 금액).
     부가세 = 현금결제 0원, 그 외(카드·세금계산서·현금영수증·미정) Math.round(총액 / 11).
     예전에 공급가액 기준으로 저장된 입력은 그대로 공급가액으로 읽어 화면 숫자가 바뀌지 않게 둔다. */
  function moneyOf(q){
    var p = pipeOf(q.id);
    var rate = vatRateFor(payOf(q));
    var own = function(k){ return Object.prototype.hasOwnProperty.call(p, k); };
    var rnd = function(v){ return (v === "" || v == null || isNaN(Number(v))) ? "" : Math.round(Number(v)); };
    var tag = parseMemo(q.memo).money;
    var mSupply = null, mTotal = null, mDeposit = null;
    if (tag){
      var ms = tag.match(/(?:공급가액|공급가)\s*([\d,]+)/);
      var mt = tag.match(/(?:합계|총)\s*([\d,]+)/);
      var md = tag.match(/계약금\s*([\d,]+)/);
      if (ms) mSupply = Number(ms[1].replace(/,/g, ""));
      if (mt) mTotal = Number(mt[1].replace(/,/g, ""));
      if (md) mDeposit = Number(md[1].replace(/,/g, ""));
    }
    var total = "", vat = "", supply = "";
    if (own("total") && p.total !== "" && p.total != null){
      total = rnd(p.total);
      vat = rate === 0 ? 0 : Math.round(total / 11);
      supply = total - vat;
    } else if (own("supply") && p.supply !== "" && p.supply != null){
      supply = rnd(p.supply);
      vat = rate === 0 ? 0 : Math.round(supply * rate);
      total = supply + vat;
    } else if (mSupply != null && !isNaN(mSupply)){
      supply = Math.round(mSupply);
      total = (mTotal != null && !isNaN(mTotal)) ? Math.round(mTotal) : supply + (rate === 0 ? 0 : Math.round(supply * rate));
      vat = total - supply;
    } else if (mTotal != null && !isNaN(mTotal)){
      total = Math.round(mTotal);
      vat = rate === 0 ? 0 : Math.round(total / 11);
      supply = total - vat;
    }
    var deposit = own("deposit") ? rnd(p.deposit) : (mDeposit != null && !isNaN(mDeposit) ? Math.round(mDeposit) : "");
    var balance = (total !== "" && deposit !== "") ? Math.max(0, total - deposit) : null;
    return { supply: supply, vat: vat, total: total, deposit: deposit, balance: balance };
  }
  function won(v){ return v === "" || v == null || isNaN(v) ? "—" : Number(v).toLocaleString("ko-KR") + "원"; }
  /* ---------- 손익 (일당 · 경비) — 이 기기 저장 + 메모 태그 [일당]/[경비] ---------- */
  function parseWonTag(tag){
    var m = String(tag || "").match(/([\d,]+)/);
    if (!m) return "";
    var n = Number(m[1].replace(/,/g, ""));
    return isNaN(n) ? "" : Math.round(n);
  }
  function costOf(q){
    var p = pipeOf(q.id);
    var pm = parseMemo(q.memo);
    var day = Object.prototype.hasOwnProperty.call(p, "dayCost") ? p.dayCost : parseWonTag(pm.dayCost);
    var exp = Object.prototype.hasOwnProperty.call(p, "expense") ? p.expense : parseWonTag(pm.expense);
    day = (day === "" || day == null || isNaN(Number(day))) ? "" : Math.round(Number(day));
    exp = (exp === "" || exp == null || isNaN(Number(exp))) ? "" : Math.round(Number(exp));
    var m = moneyOf(q);
    var total = Number(m.total) || 0;
    var vat = Number(m.vat) || 0;
    var hasCost = day !== "" || exp !== "";
    var spend = (Number(day) || 0) + (Number(exp) || 0);
    return { day: day, expense: exp, spend: spend, hasCost: hasCost, vat: vat,
             profit: (hasCost && total > 0) ? total - vat - spend : null };
  }
  function profitText(v){
    if (v == null) return "—";
    return (v < 0 ? "−" : "") + won(Math.abs(v));
  }
  /* ---------- 📣 홍보 소재(블로그·쇼츠) — 이 기기 저장 + 메모 [홍보] 태그 ---------- */
  function promoOf(q){
    if (!q) return false;
    var p = pipeOf(q.id);
    if (Object.prototype.hasOwnProperty.call(p, "promo")) return !!p.promo;
    return !!parseMemo(q.memo).promo;
  }
  function schedPayLine(q){
    var pay = payOf(q);
    var m = moneyOf(q);
    var total = Number(m.total) || 0;
    var icon = pay === "카드결제" ? "💳 " : (pay ? "🧾 " : "");
    var h = '<div class="spay">'
      + '<span class="spay-m' + (pay ? "" : " unset") + '">' + icon + (pay ? esc(pay) : "결제수단 미정") + '</span>';
    if (total > 0){
      h += '<i class="spay-br" aria-hidden="true"></i>'
        + '<span>총 <b>' + won(m.total) + '</b></span>'
        +  '<span>계약금 <b>' + (Number(m.deposit) > 0 ? won(m.deposit) : "미입력") + '</b></span>'
        +  '<span>잔금 <b>' + (m.balance == null ? "미정" : won(m.balance)) + '</b></span>';
    } else {
      h += '<span class="muted"><b>금액 미입력</b></span>';
    }
    var c = costOf(q);
    if (c.profit != null){
      h += '<span class="spay-profit' + (c.profit < 0 ? " minus" : "") + '" title="총액 ' + won(m.total) + ' − 일당 ' + won(c.day) + ' − 경비 ' + won(c.expense) + '">순수익 <b>' + profitText(c.profit) + '</b></span>';
    }
    return h + '</div>';
  }
  function moneyNote(m){
    if (!m || m.total === "") return "총액을 입력하면 부가세(총액 ÷ 11)와 잔금이 자동으로 계산됩니다 · 계약금은 직접 입력";
    if (!m.vat) return "현금결제 — 부가세 0원 · 받는 금액 " + won(m.total) + " = 공급가액";
    return "총액 " + won(m.total) + " 중 부가세 " + won(m.vat) + " (공급가액 " + won(m.supply) + ")";
  }
  /* 화면 갱신 — 입력할 때마다 카드 전체를 다시 그리지 않고 계산값만 바꾼다 */
  function paintMoney(card, m){
    if (!card) return;
    var put = function(sel, txt){ var el = card.querySelector(sel); if (el) el.textContent = txt; };
    put('[data-amt="vat"]', won(m.vat));
    put('[data-amt="total"]', won(m.total));
    put('[data-amt="supply"]', won(m.supply));
    var bal = card.querySelector('[data-amt="balance"]');
    if (bal) bal.innerHTML = (m.balance == null ? "—" : won(m.balance)) + '<small>합계 − 계약금</small>';
    var pl = card.querySelector('[data-amt="profit"]');
    if (pl){
      var dV = pl.getAttribute("data-day") || "", eV = pl.getAttribute("data-exp") || "";
      var net = (dV !== "" || eV !== "") && m.total !== ""
        ? Number(m.total) - (Number(m.vat) || 0) - (Number(dV) || 0) - (Number(eV) || 0) : null;
      pl.innerHTML = '일당 <b>' + won(dV) + '</b> · 경비 <b>' + won(eV) + '</b> · 순수익 <b class="'
        + (net != null && net < 0 ? "loss" : "plus") + '">' + profitText(net) + '</b>';
    }
    put(".vat-note", moneyNote(m));
  }

  var state = {
    adminKey: "",
    nav: "reloc", /* reloc | newbooth | market | hub */
    quotes: [],
    market: { listings: [], inquiries: [] },
    qStatus: "all",
    query: "",
    mkTab: "pending",
    lbPhotos: [],
    lbIdx: 0
  };

  var app = document.getElementById("app");
  var topActions = document.getElementById("top-actions");
  var bottomNav = document.getElementById("bottom-nav");
  var topSub = document.getElementById("top-sub");

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function digits(v){ return String(v || "").replace(/[^0-9]/g, ""); }

  function parseMemo(raw){

  /* ---------- 시뮬레이터 사양(SIM_SPEC) → 표시용 · 링크용 ---------- */
  var ARTBOARD_LABEL = { beige:"연베이지", beige_d:"진베이지", white:"화이트", gray_l:"연그레이", gray_d:"진그레이",

  function simBadges(sim){

    out.push(["규격", mm(sim.w) + " × " + mm(sim.d)]);

  function simQuery(sim){
    if (!sim) return "";
    var p = [];
    var add = function(k, v){ if (v !== undefined && v !== null && v !== "") p.push(k + "=" + encodeURIComponent(v)); };
    add("sim", "1"); add("w", sim.w); add("d", sim.d);
    add("da", sim.door); add("hg", sim.hg); add("lf", sim.sp);
    add("lm", sim.light === "rail" ? "rail" : "cob");
    if (sim.win && sim.win !== "none"){ add("ws", sim.win); add("wc", "1"); add("wn", sim.wp); }
    if (sim.pr === "in") add("pj", "in");
    add("bb", ARTBOARD_LABEL[sim.ab] || sim.ab);
    add("sl", SLAT_LABEL[sim.sl] || sim.sl);

  /* ---------- 📐 이 치수로 도면 열기 — 견적 치수·문 위치·시창을 blueprint.html 로 넘긴다 ---------- */
  /* 메모의 [창문] 같은 글자값에서 시창 규격만 골라낸다 (없으면 그대로 없음) */
  function winSpecFromText(txt){
    var t = String(txt || "");
    if (!t || t.indexOf("없") === 0) return "";
    if (/이중창/.test(t)) return "double1200";
    var m = t.match(/(\d{3,4})\s*[×xX*]\s*(\d{3,4})/);
    if (!m) return "";
    var k = m[1] + "x" + m[2];
    return (k === "600x800" || k === "800x800" || k === "1200x800") ? k : "";
  }
  function blueprintQueryFor(q){
    q = effectiveQuote(q);
    var pm = parseMemo(q.memo);
    var sim = pm.sim || null;
    var p = [];
    var add = function(k, v){ if (v !== undefined && v !== null && v !== "") p.push(k + "=" + encodeURIComponent(v)); };
    /* 규격은 견적서에 적힌 외경(mm)을 그대로 — 시뮬레이터 사양이 있으면 그것도 같이 */
    var w = Number(q.width_mm || (sim && sim.w) || 0);
    var d = Number(q.depth_mm || (sim && sim.d) || 0);
    var h = Number(q.height_mm || 0);
    add("w", w || ""); add("d", d || ""); if (h) add("h", h);
    add("ds", "front");
    if (sim && sim.door) add("da", sim.door);
    if (sim && sim.hg) add("hg", sim.hg);
    if (sim && sim.sp) add("lf", sim.sp);
    if (sim) add("lm", sim.light === "rail" ? "rail" : "cob");
    var winSpec = sim ? (sim.win || "none") : winSpecFromText(memoField(q, "창문"));
    if (winSpec){
      add("ws", winSpec);
      if (winSpec !== "none"){ add("wc", 1); add("wn", (sim && sim.wp) || "left"); }
    }
    var bb = (sim && sim.ab ? (ARTBOARD_LABEL[sim.ab] || sim.ab) : "") || memoField(q, "아트보드 3면");
    var sl = (sim && sim.sl ? (SLAT_LABEL[sim.sl] || sim.sl) : "") || memoField(q, "라인타공 1면");
    var fl = (sim && sim.fl ? (FLOOR_LABEL[sim.fl] || sim.fl) : "") || memoField(q, "바닥마감재");
    if (bb) add("bb", bb);
    if (sl) add("sl", sl);
    if (fl) add("fl", fl);
    if (sim && sim.lt === "6500") add("lt", "6500");
    if (sim && sim.pr === "in") add("pj", "in");
    add("from", "admin");
    return p.join("&");
  }

  function loadAll(cb){
    Promise.all([
      rpc("relocation_admin", { p_key: state.adminKey, p_action: "list" }),
      rpc("market_admin", { p_key: state.adminKey, p_action: "list" })
    ]).then(function(results){
      var r1 = results[0], r2 = results[1];
      if (!r1 || !r1.ok || !r2 || !r2.ok) {
        if ((r1 && r1.error === "unauthorized") || (r2 && r2.error === "unauthorized")) {
          clearKey();
          state.adminKey = "";
        }
        if (cb) return cb(false);

      state.quotes = Array.isArray(r1.quotes) ? r1.quotes : [];

  /* ---------- 진행 단계 저장 (DB status + 메모 태그 + 기기 저장) ---------- */
  function buildTaggedMemo(q, stage, inst, money, pay){
    var base = String(q.memo || "").split(/\r?\n/).filter(function(l){
      var t = l.trim();
      return !(t.indexOf("[진행]") === 0 || t.indexOf("[설치일]") === 0 || t.indexOf("[금액]") === 0 || t.indexOf("[결제·증빙]") === 0
        || t.indexOf("[일당]") === 0 || t.indexOf("[경비]") === 0 || t.indexOf("[홍보]") === 0);
    }).join("\n").trim();
    var lines = [];
    if (base) lines.push(base);
    lines.push("[진행]" + stageLabel(stage));
    if (inst && inst.date) lines.push("[설치일]" + inst.date + (inst.time ? " " + inst.time : ""));
    if (money && (money.supply !== "" || money.deposit !== "")){
      var mparts = [];
      if (money.supply !== "")
        mparts.push("공급가액 " + money.supply.toLocaleString("ko-KR")
          + " / 부가세 " + (money.vat || 0).toLocaleString("ko-KR")
          + " / 합계 " + (money.total || 0).toLocaleString("ko-KR"));
      mparts.push("계약금 " + (money.deposit || 0).toLocaleString("ko-KR"));
      lines.push("[금액]" + mparts.join(" / "));
    }
    if (pay) lines.push("[결제·증빙] " + pay);
    if (promoOf(q)) lines.push("[홍보] 블로그·쇼츠");
    var cost = costOf(q);
    if (cost.day !== "") lines.push("[일당] " + Number(cost.day).toLocaleString("ko-KR"));
    if (cost.expense !== "") lines.push("[경비] " + Number(cost.expense).toLocaleString("ko-KR"));
    return lines.join("\n").slice(0, 2000);
  }
  function memoCapable(){

         나중에 RPC가 열리면 손댈 것 없이 그때부터 서버로 저장된다. */

  function buildQuotePatch(q, stage){

      id: q.id,

      from_elevator: q.from_elevator || "",
      to_region: q.to_region || "",
      to_floor: q.to_floor || "",

      status: (STAGE_BY_V[st] || STAGE_BY_V.new).db,
      install_date: inst.date || "",

  var QUOTE_UPDATE_ROUTES = [

function canvasBlob(cv){
  return new Promise(function(resolve, reject){
    if (cv.toBlob){
      cv.toBlob(function(b){ if (b) resolve(b); else reject(new Error("toBlob failed")); }, "image/png");
      return;
    }
    try {
      var b64 = String(cv.toDataURL("image/png")).split(",")[1] || "";
      var bin = atob(b64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      resolve(new Blob([arr], { type: "image/png" }));
    } catch(e){ reject(e); }
  });
}
function canvasFile(cv, name){
  return canvasBlob(cv).then(function(blob){
    var file = null;
    try { file = new File([blob], name, { type: "image/png" }); } catch(e){ file = null; }
    return { blob: blob, file: file, name: name };
  });
}

      var lastDate = new Date(yy, mm, 0).getDate();
      var prevLast = new Date(yy, mm - 1, 0).getDate();
      var byDate = {};
      dated.forEach(function(i){ (byDate[i.date] = byDate[i.date] || []).push(i); });
      var sel = state.calSel || (dated.some(function(i){ return i.date.slice(0, 7) === ym; }) ? dated.filter(function(i){ return i.date.slice(0, 7) === ym; })[0].date : today);
      state.calSel = sel;

      html += '<div class="cal-box">'
        + '<div class="cal-head">'
        + '  <b>' + yy + '년 ' + mm + '월</b>'
        + '  <div class="cal-nav">'
        + '    <button type="button" data-cal-nav="-1">‹</button>'
        + '    <button type="button" data-cal-nav="0">오늘</button>'
        + '    <button type="button" data-cal-nav="1">›</button>'
        + '  </div>'
        + '</div>'
        + '<div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'
        + '<div class="cal-grid">';

      var totalCells = Math.ceil((firstDow + lastDate) / 7) * 7;
      for (var ci = 0; ci < totalCells; ci++){
        var dNum = ci - firstDow + 1;
        if (dNum < 1 || dNum > lastDate){
          var outNum = dNum < 1 ? (prevLast + dNum) : (dNum - lastDate);
          html += '<div class="cal-cell other"><span class="cal-num">' + outNum + '</span></div>';
          continue;
        }
        var dStr = yy + "-" + String(mm).padStart(2, "0") + "-" + String(dNum).padStart(2, "0");
        var dow = ci % 7;
        var listD = byDate[dStr] || [];
        var cls = "cal-cell" + (dow === 0 ? " sun" : (dow === 6 ? " sat" : "")) + (dStr === today ? " is-today" : "") + (dStr === sel ? " is-sel" : "");
        html += '<button type="button" class="' + cls + '" data-cal-day="' + dStr + '"><span class="cal-num">' + dNum + '</span>'
          + listD.slice(0, 2).map(function(it){
              return '<span class="cal-pill ' + (it.isNew ? "new" : "move") + (it.stage === "done" ? " done" : "") + '">' + esc(it.q.customer_name || "고객") + '</span>';
            }).join("")
          + (listD.length > 2 ? '<span class="cal-pill" style="background:#eee;color:#555">+' + (listD.length - 2) + '</span>' : '')
          + '</button>';
      }
      html += '</div></div>';

      var selList = byDate[sel] || [];
      html += '<div class="sched-day' + (sel === today ? " is-today" : "") + '"><b>' + esc(fmtDay(sel)) + ' (' + weekdayOf(sel) + ')</b><span>' + selList.length + '건</span></div>';
      html += selList.length ? selList.map(rowHtml).join("") : '<div class="empty" style="padding:18px">이 날짜에는 잡힌 일정이 없습니다.</div>';
      if (undated.length){
        html += '<div class="sched-day"><b>일정 미정</b><span>' + undated.length + '건</span></div>';
        html += undated.map(rowHtml).join("");
      }
    } else {
      /* 리스트 보기 — 기본은 오늘 이후 예정 일정만. 과거 내역은 버튼을 눌러야 편다 */
      var groupOf = function(list){
        var out = [];
        list.forEach(function(i){
          var g = out.filter(function(x){ return x.date === i.date; })[0];
          if (!g){ g = { date: i.date, items: [] }; out.push(g); }
          g.items.push(i);
        });
        return out;
      };
      var dayHtml = function(g){
        var openCount = g.items.filter(function(i){ return i.stage !== "done"; }).length;
        return '<div class="sched-day' + (g.date === today ? " is-today" : "") + '">'
          + '<b>' + esc(fmtDay(g.date)) + ' (' + weekdayOf(g.date) + ')</b>'
          + '<span>' + g.items.length + '건' + (openCount ? ' · 남은 ' + openCount : ' · 마감') + '</span></div>'
          + g.items.map(rowHtml).join("");
      };
      var upcoming = dated.filter(function(i){ return i.date >= today; });
      var past = dated.filter(function(i){ return i.date < today; });
      var upGroups = groupOf(upcoming);
      var pastGroups = groupOf(past).sort(function(a, b){ return b.date.localeCompare(a.date); });

      if (upGroups.length){
        upGroups.forEach(function(g){ html += dayHtml(g); });
      } else {
        html += '<div class="empty" style="padding:18px">오늘 이후 예정된 일정이 없습니다.'
          + (past.length ? '<br><small style="color:var(--muted);font-weight:700">과거 ' + past.length + '건은 아래 ‘과거 일정 보기’에서 확인할 수 있습니다.</small>' : '')
          + '</div>';
      }
      if (undated.length){
        html += '<div class="sched-day"><b>일정 미정</b><span>' + undated.length + '건</span></div>';
        html += undated.map(rowHtml).join("");
      }
      if (past.length){
        var pastOn = !!state.schedPast;
        html += '<button type="button" class="past-toggle" data-spast="1" aria-expanded="' + (pastOn ? "true" : "false") + '">'
          + '<span>' + (pastOn ? "과거 일정 접기" : "과거 일정 보기 · " + past.length + "건") + '</span>'
          + '<i aria-hidden="true">' + (pastOn ? "▲" : "▼") + '</i></button>';
        if (pastOn) pastGroups.forEach(function(g){ html += dayHtml(g); });
      }
    }
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll("[data-smode]"), function(b){
      b.addEventListener("click", function(){ state.schedMode = b.getAttribute("data-smode"); renderScheduleTab(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-cal-nav]"), function(b){
      b.addEventListener("click", function(){
        var dir = parseInt(b.getAttribute("data-cal-nav"), 10);
        if (dir === 0){ state.calMonth = today.slice(0, 7); state.calSel = today; }
        else {
          var ym = (state.calMonth || today.slice(0, 7)).split("-");
          var dt = new Date(parseInt(ym[0], 10), parseInt(ym[1], 10) - 1 + dir, 1);
          state.calMonth = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
          state.calSel = state.calMonth + "-01";
        }
        renderScheduleTab();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-cal-day]"), function(b){
      b.addEventListener("click", function(){ state.calSel = b.getAttribute("data-cal-day"); renderScheduleTab(); });
    });
    /* ✏️ 일정 수정 모달 · 과거 일정 펼치기 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-sedit]"), function(b){
      b.addEventListener("click", function(){ openSchedEdit(b.getAttribute("data-sedit")); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-spast]"), function(b){
      b.addEventListener("click", function(){ state.schedPast = !state.schedPast; renderScheduleTab(); });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-sch-id]"), function(inp){
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-sch-id");
        var k = inp.getAttribute("data-sch-k");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        setPipe(id, k === "date" ? { installDate: inp.value || "" } : { installTime: inp.value || "" });
        pushMemoUpdate(q, stageOf(q));
        toast(inp.value ? (k === "date" ? "작업 날짜(해체일) " + inp.value + " 저장" : "해체 시작 시간 " + inp.value + " 저장") : "일정을 비웠습니다");
        renderScheduleTab();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-sstage-id]"), function(sel){
      sel.addEventListener("change", function(){
        var id = sel.getAttribute("data-sstage-id");
        var v = sel.value;
        Promise.resolve(saveStage(id, v)).then(function(){
          toast("진행 단계를 ‘" + stageLabel(v) + "’(으)로 바꿨어요");
          loadAll();
        }).catch(function(err){ alert(err.message); });
      });
    });
    /* ✅ 완료 / ↩️ 완료 취소 — 일정 탭에서도 바로 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-qdone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "done")).then(function(){
          toast("설치 완료로 마감했습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-qundone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qundone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "reserved")).then(function(){
          toast("설치 완료를 예약중으로 되돌렸습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
  }

  function render(){
    topActions.hidden = false;
    bottomNav.hidden = false;
    updateBadges();

    Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-nav") === state.nav ? "true" : "false");
    });

    if (state.nav === "reloc") {
      topSub.textContent = "이전설치";
      renderQuotesTab(false);
    } else if (state.nav === "newbooth") {
      topSub.textContent = "신규설치";
      renderQuotesTab(true);
    } else if (state.nav === "market") {
      topSub.textContent = "중고마켓";
      renderMarketTab();
    } else if (state.nav === "sched") {
      topSub.textContent = "설치 일정";
      renderScheduleTab();
    } else {
      topSub.textContent = "도면·사이트";
      renderHubTab();
    }
  }

  function renderQuotesTab(isNewTab){
    var base = state.quotes.filter(function(q){ return isNewTab ? isNewBoothQuote(q) : !isNewBoothQuote(q); });
    base.forEach(function(q){ q.__stage = stageOf(q); });
    var counts = { all: base.length };
    STAGES.forEach(function(s){ counts[s.v] = base.filter(function(q){ return q.__stage === s.v; }).length; });
    var qLower = state.query.trim().toLowerCase();
    var filtered = base.filter(function(q){
      if (state.qStatus !== "all" && q.__stage !== state.qStatus) return false;
      if (!qLower) return true;
      return [q.customer_name, q.customer_phone, q.brand, q.booth_type, q.from_region, q.to_region, q.memo, q.id].join(" ").toLowerCase().indexOf(qLower) !== -1;
    });

    var kpis = [["all", "전체", counts.all]].concat(STAGES.map(function(s){ return [s.v, s.label, counts[s.v]]; }))
      .map(function(k){
        return '<button type="button" class="kpi" data-qtab="' + k[0] + '" aria-pressed="' + (state.qStatus === k[0] ? "true" : "false") + '">'
          + '<div class="kl">' + k[1] + '</div><div class="kv">' + k[2] + '</div></button>';
      }).join("");

    var cardsHtml = filtered.length
      ? filtered.map(function(q){ return renderQuoteCard(q, isNewTab); }).join("")
      : '<div class="empty">' + (base.length ? "조건에 맞는 요청이 없습니다." : (isNewTab ? "신규 부스 견적 요청이 없습니다." : "이전설치 견적 요청이 없습니다.")) + '</div>';

    app.innerHTML = ''
      + '<div class="kpi-row">' + kpis + '</div>'
      + '<div class="toolbar">'
      + '  <div class="search-wrap">'
      + '    <input id="q-search" type="search" placeholder="고객명, 연락처, 지역, 메모 검색…" value="' + esc(state.query) + '">'
      + '    <button type="button" class="search-clear' + (state.query ? ' show' : '') + '" id="q-clear" aria-label="지우기">×</button>'
      + '  </div>'
      + '</div>'
      + '<div class="grid">' + cardsHtml + '</div>';

    bindQuoteEvents();
  }

  function renderQuoteCard(q, isNewTab){
    q = effectiveQuote(q);
    var st = q.__stage || stageOf(q);
    var pm = parseMemo(q.memo);
    var inst = installOf(q);
    var photos = Array.isArray(q.photos) ? q.photos : [];
    var shortId = String(q.id || "").slice(0, 8).toUpperCase();
    var phoneDigits = digits(q.customer_phone);
    var sim = pm.sim || (q.width_mm || q.depth_mm ? { w: q.width_mm, d: q.depth_mm } : null);
    var simQ = simQuery(sim);
    var promoOn = promoOf(q);

    var alerts = [];
    if (!isNewTab && q.from_elevator === "없음") alerts.push('<span class="abadge warn">⚠️ 해체지 엘베 없음</span>');
    if (q.to_elevator === "없음") alerts.push('<span class="abadge warn">⚠️ 설치지 엘베 없음</span>');
    if (pm.aircon) alerts.push('<span class="abadge info">❄️ 에어컨: ' + esc(pm.aircon) + '</span>');
    if (pm.pay) alerts.push('<span class="abadge info">💳 ' + esc(pm.pay) + '</span>');
    if (pm.listingUrl) alerts.push('<a class="abadge link" href="' + esc(pm.listingUrl) + '" target="_blank" rel="noopener">🔗 매물 링크 ↗</a>');

    var statusBtns = STAGES.map(function(s){
      return '<button type="button" class="sp' + (st === s.v ? " on" : "") + '" data-qstage="' + s.v + '" data-qid="' + esc(q.id) + '" data-st="' + s.v + '">' + s.label + '</button>';
    }).join("");

    var routeHtml = isNewTab
      ? '<div class="rbox" style="margin-top:10px">'
        + '<div class="rbox-top"><span class="rtag to">설치 장소</span>'
        + (q.to_region ? '<a class="rmap" href="' + naverMapUrl(q.to_region) + '" target="_blank" rel="noopener">지도 ↗</a>' : '') + '</div>'
        + '<div class="raddr">' + esc(q.to_region || "미기재") + '</div>'
        + '<div class="rsub">' + esc(q.to_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.to_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.to_elevator || "미기재")) + '</div></div>'
      : '<div class="route">'
        + '  <div class="rbox">'
        + '    <div class="rbox-top"><span class="rtag from">해체 (출발)</span>'
        + (q.from_region ? '<a class="rmap" href="' + naverMapUrl(q.from_region) + '" target="_blank" rel="noopener">지도 ↗</a>' : '') + '</div>'
        + '    <div class="raddr">' + esc(q.from_region || "미기재") + '</div>'
        + '    <div class="rsub">' + esc(q.from_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.from_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.from_elevator || "미기재")) + '</div>'
        + '  </div>'
        + '  <div class="rarrow" aria-hidden="true">→</div>'
        + '  <div class="rbox">'
        + '    <div class="rbox-top"><span class="rtag to">설치 (도착)</span>'
        + (q.to_region ? '<a class="rmap" href="' + naverMapUrl(q.to_region) + '" target="_blank" rel="noopener">지도 ↗</a>' : '') + '</div>'
        + '    <div class="raddr">' + esc(q.to_region || "미기재") + '</div>'
        + '    <div class="rsub">' + esc(q.to_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.to_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.to_elevator || "미기재")) + '</div>'
        + '  </div>'
        + '</div>';

    /* 시뮬레이터 사양 배지 (있을 때만) */
    var badges = simBadges(pm.sim);
    var simHtml = badges.length
      ? '<div class="sim-box">'
        + '  <div class="sim-h"><b>🎨 시뮬레이터 사양</b><span>고객이 고른 옵션 · 자재·재단은 📐 설계도</span></div>'
        + '  <div class="sim-grid">' + badges.map(function(b){
            return '<div class="sim-item"><span>' + esc(b[0]) + '</span><b>' + esc(b[1]) + '</b></div>';
          }).join("") + '</div>'
        + '</div>'
      : '';

    var photosHtml = photos.length
      ? '<div class="photos">' + photos.map(function(u, idx){
          return '<button type="button" class="photo-btn" data-lb-type="quote" data-lb-id="' + esc(q.id) + '" data-lb-idx="' + idx + '">'
            + '<img src="' + esc(u) + '" alt="사진 ' + (idx + 1) + '" loading="lazy"></button>';
        }).join("") + '</div>'
      : '';

    var instHtml = '<div class="inst-row">'
      + '  <div class="inst-l"><b>작업(해체) 일시</b><small>해체 시작 시각 · 계약서 작업일자로 쓰입니다</small></div>'
      + '  <input type="date" class="inst-in" data-inst-id="' + esc(q.id) + '" data-inst-k="date" value="' + esc(inst.date) + '" aria-label="작업(해체) 날짜">'
      + '  <input type="time" class="inst-in" data-inst-id="' + esc(q.id) + '" data-inst-k="time" value="' + esc(inst.time) + '" aria-label="해체 시작 시간">'
      + '  <button type="button" class="abtn ics" data-ics-id="' + esc(q.id) + '">📅 캘린더 추가(.ics)</button>'
      + '</div>';

    var m = moneyOf(q);
    var pay = payOf(q);
    var cst = costOf(q);
    var payHintTxt = payHintFor(pay);
    var moneyHtml = '<div class="money-row">'
      + '  <div class="pay-line">'
      + '    <label>결제 증빙</label>'
      + '    <div class="pay-chips">' + PAY_OPTS.map(function(p){
        return '<button type="button" class="pay-chip' + (pay === p ? " on" : "") + '" data-pay-id="' + esc(q.id) + '" data-pay="' + p + '">' + p + '</button>';
      }).join("") + '</div>'
      + '    <span class="pay-hint">' + payHintTxt + '</span>'
      + '  </div>'
      + '  <div class="money-item"><label>총액 (원 · 받는 금액)</label>'
      + '    <input type="number" min="0" step="10000" inputmode="numeric" data-money-id="' + esc(q.id) + '" data-money-k="total" value="' + (m.total === "" ? "" : m.total) + '" placeholder="예: 500000">'
      + '    <div class="money-hint" data-hint="total"></div></div>'
      + '  <div class="money-item"><label>부가세 (자동)</label>'
      + '    <div class="amt" data-amt="vat">' + won(m.vat) + '</div></div>'
      + '  <div class="money-item"><label>공급가액 (자동)</label>'
      + '    <div class="amt" data-amt="supply">' + won(m.supply) + '</div></div>'
      + '  <div class="money-item"><label>계약금 (원)</label>'
      + '    <input type="number" min="0" step="10000" inputmode="numeric" data-money-id="' + esc(q.id) + '" data-money-k="deposit" value="' + (m.deposit === "" ? "" : m.deposit) + '" placeholder="0">'
      + '    <div class="money-hint" data-hint="deposit"></div></div>'
      + '  <div class="money-item span2"><label>잔금 (자동)</label>'
      + '    <div class="bal" data-amt="balance">' + (m.balance == null ? "—" : won(m.balance)) + '<small>합계 − 계약금</small></div></div>'
      + '  <div class="vat-note">' + moneyNote(m) + '</div>'
      + (cst.hasCost
          ? '  <div class="vat-note money-profit" data-amt="profit" data-day="' + esc(cst.day) + '" data-exp="' + esc(cst.expense) + '">일당 <b>' + won(cst.day) + '</b> · 경비 <b>' + won(cst.expense) + '</b> · 순수익 <b class="' + (cst.profit != null && cst.profit < 0 ? "loss" : "plus") + '">' + profitText(cst.profit) + '</b></div>'
          : '')
      + '</div>';

    return '<article class="qsheet' + (st === "new" ? " is-new" : "") + '" data-stage="' + st + '">'
      + '<div class="qs-head">'
      + '  <div style="width:100%">'
      + '    <div class="qs-who">'
      + '      <span class="qs-name">' + esc(q.customer_name || "성함 미기재") + '</span>'
      + '      <a class="qs-phone" href="tel:' + esc(phoneDigits) + '">' + esc(q.customer_phone || "연락처 없음") + '</a>'
      + '      <span class="stage-tag" data-st="' + st + '">' + stageLabel(st) + '</span>'
      + (promoOn ? '      <span class="promo-tag">📣 홍보 소재</span>' : '')
      + '      <button type="button" class="pay-chip" style="margin-left:auto" data-qedit="' + esc(q.id) + '">✏️ 수정</button>'
      + '    </div>'
      + '    <div class="qs-meta"><span class="qs-id">#' + esc(shortId) + '</span><span>접수 ' + esc(fmtDate(q.created_at)) + '</span><span>사진 ' + photos.length + '장</span></div>'
      + '  </div>'
      + '</div>'

  function renderMarketTab(){
    var listings = state.market.listings;
    var inquiries = state.market.inquiries;
    var pend = listings.filter(function(l){ return l.status === "pending"; });
    var newInq = inquiries.filter(function(i){ return i.status === "new"; });

    var tabs = [
      ["pending", "검수 대기 " + pend.length],
      ["all", "전체 매물 " + listings.length],
      ["inq", "구매 문의 " + newInq.length + "/" + inquiries.length]
    ].map(function(t){
      return '<button type="button" class="stab" data-mktab="' + t[0] + '" aria-pressed="' + (state.mkTab === t[0] ? "true" : "false") + '">' + t[1] + '</button>';
    }).join("");

    var body = "";
    if (state.mkTab === "pending") {
      body = pend.length ? pend.map(renderListingCard).join("") : '<div class="empty">검수 대기 중인 매물이 없습니다.</div>';
    } else if (state.mkTab === "all") {
      body = listings.length ? listings.map(renderListingCard).join("") : '<div class="empty">등록된 매물이 없습니다.</div>';
    } else {
      body = inquiries.length ? inquiries.map(renderInquiryCard).join("") : '<div class="empty">들어온 구매 문의가 없습니다.</div>';
    }

    app.innerHTML = '<div class="subtabs">' + tabs + '</div><div class="grid">' + body + '</div>';
    bindMarketEvents();
  }

  function bindQuoteEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-qtab]"), function(b){
      b.addEventListener("click", function(){ state.qStatus = b.getAttribute("data-qtab"); render(); });
    });
    var search = document.getElementById("q-search");
    var clearBtn = document.getElementById("q-clear");
    if (search) {
      search.addEventListener("input", function(){
        state.query = search.value;
        var pos = search.selectionStart;
        render();
        var s2 = document.getElementById("q-search");
        if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    if (clearBtn) clearBtn.addEventListener("click", function(){ state.query = ""; render(); });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qstage]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qid"), stage = b.getAttribute("data-qstage");
        b.disabled = true;
        Promise.resolve(saveStage(id, stage)).then(function(){
          toast("진행 단계를 ‘" + stageLabel(stage) + "’(으)로 바꿨어요");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qdone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "done")).then(function(){
          toast("설치 완료로 마감했습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qundone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qundone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "reserved")).then(function(){
          toast("설치 완료를 예약중으로 되돌렸습니다 — 금액·설치일을 다시 수정할 수 있습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-ics-id]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-ics-id");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        var ics = icsFor(q);
        if (!ics){ toast("작업(해체) 일시를 먼저 입력해 주세요"); return; }
        var blob = new Blob(["\ufeff", ics], { type: "text/calendar;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "베오방음_" + (q.customer_name || "일정") + "_설치_" + installOf(q).date.replace(/-/g, "") + ".ics";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ try { URL.revokeObjectURL(a.href); } catch (e) {} }, 3000);
        toast("캘린더 파일(.ics)을 내려받았습니다 — 전날 알림 포함");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-inst-id]"), function(inp){
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-inst-id");
        var k = inp.getAttribute("data-inst-k");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        /* 날짜 칸에 6자리 연도 같은 잘못된 값이 남는 걸 막는다 — 형식이 맞을 때만 저장 */
        if (k === "date" && inp.value && !/^\d{4}-\d{2}-\d{2}$/.test(inp.value)){
          inp.value = pipeOf(id).installDate || "";
          toast("연도 4자리 · 월·일 2자리로 입력해 주세요");
          return;
        }
        var patch = {};
        patch[k === "date" ? "installDate" : "installTime"] = inp.value || "";
        setPipe(id, patch);
        pushMemoUpdate(q, stageOf(q));
        var inst = installOf(q);
        var sv = app.querySelector('[data-inst-sv="' + String(id).replace(/"/g, '\\"') + '"]');
        if (sv){
          sv.innerHTML = inst.date
            ? esc(fmtDay(inst.date)) + (inst.time ? ' ' + esc(inst.time) : '')
            : (q.desired_date ? esc(fmtDay(q.desired_date)) + ' <small style="color:var(--accent-d)">(희망)</small>' : '<span style="color:var(--muted);font-weight:700">미정</span>');
        }
        toast(inst.date ? "작업(해체) 일시 " + inst.date + (inst.time ? " " + inst.time : "") + " 저장" : "작업 일시를 비웠습니다");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-money-id]"), function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-money-id");
        var k = inp.getAttribute("data-money-k") === "deposit" ? "deposit" : "total";
        var v = amountOf(inp.value);
        var patch = {}; patch[k] = v;
        setPipe(id, patch);
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        paintMoney(inp.closest(".qsheet"), moneyOf(q));
        /* 1000 미만 입력은 만 원 단위로 읽었다고 알려 준다 (예: 50 → 50만 원) */
        var hint = inp.parentNode.querySelector(".money-hint");
        if (hint){
          var rawNum = Number(String(inp.value).replace(/[^0-9.]/g, ""));
          hint.textContent = (v !== "" && rawNum > 0 && rawNum < 1000) ? ("→ " + won(v) + " (만 원 단위)") : "";
        }
      });
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-money-id");
        var k = inp.getAttribute("data-money-k") === "deposit" ? "deposit" : "total";
        var v = amountOf(inp.value);
        inp.value = v === "" ? "" : String(v);
        var patch = {}; patch[k] = v;
        setPipe(id, patch);
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        paintMoney(inp.closest(".qsheet"), moneyOf(q));
        var hint = inp.parentNode.querySelector(".money-hint");
        if (hint) hint.textContent = "";
        pushMemoUpdate(q, stageOf(q));
        toast("계약 금액을 저장했습니다");
      });
    });

    /* 결제 증빙 선택 — 다시 누르면 미정으로 돌린다 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-pay-id]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-pay-id");
        var p = b.getAttribute("data-pay");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        var next = payOf(q) === p ? "" : p;
        setPipe(id, { pay: next });
        Array.prototype.forEach.call(b.parentNode.querySelectorAll(".pay-chip"), function(x){
          x.classList.toggle("on", !!next && x === b);
        });
        var ph = b.closest(".pay-line") && b.closest(".pay-line").querySelector(".pay-hint");
        if (ph){
          ph.innerHTML = payHintFor(next);
        }
        /* 결제수단에 따라 부가세(현금 0원 / 그 외 총액÷11)가 달라지므로 금액 줄을 다시 칠한다 */
        var card = b.closest(".qsheet");
        if (card){
          paintMoney(card, moneyOf(q));
          var vn = card.querySelector(".vat-note");
          if (vn) vn.textContent = moneyNote(moneyOf(q));
        }
        pushMemoUpdate(q, stageOf(q));
        toast(next ? "결제수단을 ‘" + next + "’(으)로 바꿨습니다 · 부가세 " + (next === "현금결제" ? "0원" : "자동 계산") : "결제수단을 미정으로 비웠습니다");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qcontract]"), function(b){
      b.addEventListener("click", function(){
        var q = state.quotes.filter(function(x){ return String(x.id) === String(b.getAttribute("data-qcontract")); })[0];
        if (!q) return;
        copyText(contractText(q), "계약 안내 복사 완료!");
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-qcontractimg]"), function(b){
      b.addEventListener("click", function(){
        var q = state.quotes.filter(function(x){ return String(x.id) === String(b.getAttribute("data-qcontractimg")); })[0];
        if (!q) return;
        openContractModal(q);
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-qedit]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qedit");
        var raw = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!raw) return;
        var q = effectiveQuote(raw);
        var pm = parseMemo(q.memo);
        var em = document.getElementById("edit-modal");
        em.setAttribute("data-edit-id", id);
        document.getElementById("ed-name").value = q.customer_name || "";
        document.getElementById("ed-phone").value = q.customer_phone || "";
        document.getElementById("ed-type").value = q.booth_type || "";
        document.getElementById("ed-brand").value = q.brand || "";
        document.getElementById("ed-w").value = q.width_mm || "";
        document.getElementById("ed-d").value = q.depth_mm || "";
        document.getElementById("ed-h").value = q.height_mm || "";
        document.getElementById("ed-from-wrap").style.display = isNewBoothQuote(q) ? "none" : "grid";
        document.getElementById("ed-from").value = q.from_region || "";
        document.getElementById("ed-ffl").value = q.from_floor || "";
        document.getElementById("ed-fel").value = elvVal(q.from_elevator);
        document.getElementById("ed-to").value = q.to_region || "";
        document.getElementById("ed-tfl").value = q.to_floor || "";
        document.getElementById("ed-tel").value = elvVal(q.to_elevator);
        document.getElementById("ed-note").value = q.__noteOverride != null ? q.__noteOverride : (pm.note || "");
        em.hidden = false;
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qcopy]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qcopy");
        var q = state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!q) return;
        copyText(formatCopyText(q), "요청서 요약 복사 완료!");
      });
    });

    /* 💬 고객 안내문 복사 — 카톡에 바로 붙여넣는 존댓말 안내문 (금지어 점검 후 복사) */
    Array.prototype.forEach.call(app.querySelectorAll("[data-qmsg]"), function(b){
      b.addEventListener("click", function(){
        var q = state.quotes.find(function(x){ return String(x.id) === String(b.getAttribute("data-qmsg")); });
        if (!q) return;
        copyCustomerMessage(customerMessage(q));
      });
    });

    /* 📣 홍보 소재 체크 — 메모 [홍보] 태그 + 이 기기 저장 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-promo-id]"), function(cb){
      cb.addEventListener("change", function(){
        var id = cb.getAttribute("data-promo-id");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        var on = !!cb.checked;
        setPipe(id, { promo: on });
        var row = cb.closest ? cb.closest(".promo-row") : null;
        if (row) row.classList.toggle("on", on);
        if (q) pushQuoteUpdate(q, stageOf(effectiveQuote(q)));
        toast(on ? "홍보 소재로 표시했습니다 — 블로그·쇼츠 후보" : "홍보 소재 표시를 풀었습니다");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdel");
        if (!confirm("이 상담요청서를 삭제할까요? 되돌릴 수 없습니다.")) return;
        b.disabled = true;
        rpc("relocation_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    bindLightbox();
  }

  function bindMarketEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-mktab]"), function(b){
      b.addEventListener("click", function(){ state.mkTab = b.getAttribute("data-mktab"); render(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkid"), st = b.getAttribute("data-mkst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "status", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("매물 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkdel");
        if (!confirm("이 매물을 완전히 삭제할까요?")) return;
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-inqst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-inqid"), st = b.getAttribute("data-inqst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "inquiry", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("문의 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    bindLightbox();
  }

  function bindLightbox(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-lb-id]"), function(b){
      b.addEventListener("click", function(){
        var type = b.getAttribute("data-lb-type");
        var id = b.getAttribute("data-lb-id");
        var idx = Number(b.getAttribute("data-lb-idx") || 0);
        var item = type === "market"
          ? state.market.listings.find(function(x){ return String(x.id) === String(id); })
          : state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!item || !Array.isArray(item.photos) || !item.photos.length) return;
        openLb(item.photos, idx);
      });
    });
  }

  function copyText(text, msg){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(msg || "복사 완료!"); })
        .catch(function(){ fallbackCopy(text, msg); });
    } else fallbackCopy(text, msg);
  }
  function fallbackCopy(text, msg){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg || "복사 완료!"); } catch (e) { alert("복사 실패"); }
    document.body.removeChild(ta);
  }

  var lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbCount = document.getElementById("lb-count");
  function openLb(photos, idx){
    state.lbPhotos = photos; state.lbIdx = Math.max(0, Math.min(idx, photos.length - 1));
    updateLb(); lb.hidden = false;
  }
  function updateLb(){
    lbImg.src = state.lbPhotos[state.lbIdx];
    lbCount.textContent = (state.lbIdx + 1) + " / " + state.lbPhotos.length;
  }
  document.getElementById("lb-prev").addEventListener("click", function(){ state.lbIdx = (state.lbIdx - 1 + state.lbPhotos.length) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-next").addEventListener("click", function(){ state.lbIdx = (state.lbIdx + 1) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-close").addEventListener("click", function(){ lb.hidden = true; });
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.hidden = true; });
  document.getElementById("ct-close").addEventListener("click", function(){ document.getElementById("ct-modal").hidden = true; });
  document.getElementById("ct-modal").addEventListener("click", function(e){
    if (e.target === document.getElementById("ct-modal")) e.currentTarget.hidden = true;
  });
  document.getElementById("edit-close").addEventListener("click", function(){ document.getElementById("edit-modal").hidden = true; });
  document.getElementById("edit-modal").addEventListener("click", function(e){
    if (e.target === document.getElementById("edit-modal")) e.currentTarget.hidden = true;
  });
  document.getElementById("edit-save").addEventListener("click", function(){
    var em = document.getElementById("edit-modal");
    var id = em.getAttribute("data-edit-id");
    if (!id) return;
    var fel = document.getElementById("ed-fel").value;
    var tel = document.getElementById("ed-tel").value;
    var ov = {
      customer_name: document.getElementById("ed-name").value.trim(),
      customer_phone: document.getElementById("ed-phone").value.trim(),
      booth_type: document.getElementById("ed-type").value.trim(),
      brand: document.getElementById("ed-brand").value.trim(),
      width_mm: Number(document.getElementById("ed-w").value) || null,
      depth_mm: Number(document.getElementById("ed-d").value) || null,
      height_mm: Number(document.getElementById("ed-h").value) || null,
      from_region: document.getElementById("ed-from").value.trim(),
      from_floor: document.getElementById("ed-ffl").value.trim(),
      from_elevator: fel,
      to_region: document.getElementById("ed-to").value.trim(),
      to_floor: document.getElementById("ed-tfl").value.trim(),
      to_elevator: tel,
      __noteOverride: document.getElementById("ed-note").value.trim()
    };
    setPipe(id, { ov: ov });
    var rq = quoteById(id);
    if (rq) pushQuoteUpdate(effectiveQuote(rq), stageOf(effectiveQuote(rq)));
    em.hidden = true;
    toast("수정 저장 완료! 견적·계약서·일정에 바로 반영됐습니다");
    render();
  });

  /* ---------- ✏️ 일정 수정 모달 이벤트 ---------- */
  document.getElementById("sched-close").addEventListener("click", function(){ document.getElementById("sched-modal").hidden = true; });
  document.getElementById("sched-modal").addEventListener("click", function(e){
    if (e.target === document.getElementById("sched-modal")) e.currentTarget.hidden = true;
  });
  Array.prototype.forEach.call(["sd-total-in", "sd-deposit", "sd-day", "sd-expense"], function(fid){
    var inp = document.getElementById(fid);
    inp.addEventListener("input", function(){ schedMoneyPaint(); });
    inp.addEventListener("change", function(){
      var v = amountOf(inp.value);
      inp.value = v === "" ? "" : String(v);
      schedMoneyPaint();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#sched-modal [data-sd-time]"), function(b){
    b.addEventListener("click", function(){
      /* 저장 전에는 기존 시간을 건드리지 않는다 — 누를 때만 09:00으로 채운다 */
      document.getElementById("sd-time").value = b.getAttribute("data-sd-time");
      toast("해체 시작 시간을 09:00으로 채웠습니다 (저장을 눌러야 반영)");
    });
  });
  document.getElementById("sd-pay-chips").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-sd-pay]") : null;
    if (!b) return;
    var p = b.getAttribute("data-sd-pay");
    schedPaySet(SEDIT_PAY === p ? "" : p);
    schedMoneyPaint();
  });
  document.getElementById("sd-save").addEventListener("click", saveSchedEdit);
  document.getElementById("sd-promo").addEventListener("change", function(){
    document.getElementById("sd-promo-row").classList.toggle("on", this.checked);
  });
  /* 💬 고객 안내문 복사 — 일정 수정 창에 지금 적혀 있는 값으로 바로 */
  document.getElementById("sd-copy-msg").addEventListener("click", function(){
    var raw = quoteById(SEDIT_ID);
    if (!raw) return;
    var m = schedMoneyCalc();
    var g = function(id){ var el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; };
    var isNewB = isNewBoothQuote(raw);
    var fe = document.getElementById("sd-fel").value, te = document.getElementById("sd-tel").value;
    var placeOf = function(region, floor, elv){
      var s = String(region || "").trim();
      if (floor) s += " " + floor;
      if (elv) s += " (엘리베이터 " + elv + ")";
      return s.trim();
    };
    copyCustomerMessage(customerMessage(raw, {
      name: g("sd-name"),
      booth: g("sd-type"),
      date: g("sd-date"),
      time: g("sd-time"),
      from: isNewB ? "" : placeOf(g("sd-from"), g("sd-ffl"), fe),
      to: placeOf(g("sd-to"), g("sd-tfl"), te),
      noFromElv: !isNewB && fe === "없음",
      noToElv: te === "없음",
      total: m.total, deposit: m.deposit, balance: m.balance, pay: SEDIT_PAY
    }));
  });

  Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ state.nav = b.getAttribute("data-nav"); state.qStatus = "all"; render(); window.scrollTo(0, 0); });
  });
  document.getElementById("btn-refresh").addEventListener("click", function(){ toast("최신 화면 불러오는 중…"); location.replace(location.pathname + "?v=" + Date.now() + (location.hash || "")); });
  document.getElementById("btn-logout").addEventListener("click", function(){ clearKey(); state.adminKey = ""; renderLogin(); });

  state.adminKey = loadSavedKey();
  if (!state.adminKey) renderLogin();
  else loadAll();
})();
</script>
</body>
</html>
