<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베오방음 통합 관리자</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="베오 관리자">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=5">
<link rel="manifest" href="/manifest-hub.json">
<style>
  :root{
    --ink:#14171A;
    --ink2:#2E353B;
    --body:#4B555D;
    --muted:#778087;
    --line:#E3DDD3;
    --line2:#EFEAE2;
    --bg:#F4F0E8;
    --paper:#FFFFFF;
    --soft:#FAF8F4;
    --accent:#2E9C86;
    --accent-d:#1E7564;
    --accent-t:#E7F3F0;
    --warn:#B94A2F;
    --warn-bg:#FDF0EC;
    --blue:#2563EB;
    --blue-bg:#EFF6FF;
    --shadow:0 1px 2px rgba(20,23,26,.04), 0 8px 24px -16px rgba(20,23,26,.14);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  img{display:block;max-width:100%}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding-top:env(safe-area-inset-top);
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:960px;margin:0 auto;padding:11px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
  .brand-logo{height:24px;width:auto;max-width:170px;object-fit:contain;flex:0 1 auto;min-width:0}
  .brand-mark{
    width:32px;height:32px;border-radius:10px;background:var(--ink);
    display:grid;place-items:center;flex:0 0 auto;
  }
  .brand-title{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font-size:11.5px;font-weight:700;color:var(--accent-d);background:var(--accent-t);padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:nowrap}
  .tbtn{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--ink2);background:var(--soft)}
  .tbtn.danger{color:var(--warn)}
  @media (max-width:480px){
    .topbar-in{padding:8px 12px;gap:8px}
    .brand{gap:6px}
    .brand-logo{height:19px;max-width:108px}
    .brand-sub{font-size:10.5px;padding:2px 7px}
    .tbtn{padding:6px 9px;font-size:11.5px;border-radius:9px}
    .top-actions{gap:5px}
  }
  @media (max-width:360px){
    .brand-logo{height:17px;max-width:92px}
    .brand-sub{display:none}
  }

  /* Main */
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 24px}

  /* Login */
  .login-box{
    max-width:400px;margin:52px auto;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);
  }
  .login-logo{height:30px;width:auto;max-width:100%;margin-bottom:16px}
  .login-box h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .login-box p{margin:8px 0 0;font-size:13.5px;color:var(--body)}
  .in{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 13px;background:#fff;font-size:15px;color:var(--ink);
  }
  .in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,156,134,.15)}
  .btn-primary{
    width:100%;height:46px;margin-top:10px;border:0;border-radius:12px;
    background:var(--ink);color:#fff;font-size:14.5px;font-weight:800;
  }
  .login-msg{margin-top:10px;font-size:12.5px;color:var(--warn);min-height:18px}

  /* KPI & Toolbar */
  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;
    text-align:left;
  }
  .kpi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-t);box-shadow:inset 0 0 0 1px var(--accent)}
  .kpi .kl{font-size:11.5px;font-weight:700;color:var(--muted)}
  .kpi[aria-pressed="true"] .kl{color:var(--accent-d)}
  .kpi .kv{margin-top:2px;font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .search-wrap{flex:1 1 220px;position:relative}
  .search-wrap input{
    width:100%;height:42px;border:1px solid var(--line);border-radius:12px;
    padding:0 36px 0 14px;background:#fff;font-size:14px;
  }
  .search-wrap input:focus{outline:0;border-color:var(--accent)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px;display:none;
  }
  .search-clear.show{display:block}

  /* Subtabs (market) */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stab{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--body);
  }
  .stab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* Cards */
  .grid{display:grid;gap:12px}
  .qsheet{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:15px;box-shadow:var(--shadow);
  }
  .qsheet.is-new{border-left:4px solid var(--accent)}
  .qs-head{
    display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;
    padding-bottom:11px;border-bottom:1px solid var(--line2);
  }
  .qs-who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .qs-name{font-size:17.5px;font-weight:800;letter-spacing:-.03em}
  .qs-phone{
    font-size:13px;font-weight:700;color:var(--accent-d);background:var(--accent-t);
    padding:4px 10px;border-radius:999px;
  }
  .qs-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .qs-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);padding:2px 6px;border-radius:6px;border:1px solid var(--line2)}

  .status-pills{display:flex;gap:4px;flex-wrap:wrap}
  .sp{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);
  }
  .sp.on[data-st="new"],.sp.on[data-st="active"]{background:var(--accent-t);border-color:var(--accent);color:var(--accent-d)}
  .sp.on[data-st="contacted"],.sp.on[data-st="reserved"]{background:var(--blue-bg);border-color:#93C5FD;color:var(--blue)}
  .sp.on[data-st="done"],.sp.on[data-st="sold"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .sp.on[data-st="pending"]{background:var(--warn-bg);border-color:#F3CFC6;color:var(--warn)}
  .sp.on[data-st="hidden"]{background:var(--soft);border-color:var(--line);color:var(--muted)}
  .sp.on[data-st="talk"]{background:var(--blue-bg);border-color:#93C5FD;color:var(--blue)}
  .sp.on[data-st="deposit"]{background:#FFF7E6;border-color:#F2C877;color:#8A5A00}
  .sp.on[data-st="reserved"]{background:#F1EEFB;border-color:#C4B5FD;color:#5B3FB8}
  .sp.on[data-st="done"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .stage-bar{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
  .stage-bar .sp{padding:6px 11px;font-size:12.5px}
  .stage-tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--accent-t);color:var(--accent-d)}
  .stage-tag[data-st="talk"]{background:var(--blue-bg);color:var(--blue)}
  .stage-tag[data-st="deposit"]{background:#FFF7E6;color:#8A5A00}
  .stage-tag[data-st="reserved"]{background:#F1EEFB;color:#5B3FB8}
  .stage-tag[data-st="done"]{background:var(--ink);color:#fff}

  .sim-box{margin-top:10px;border:1px solid #C9E4DC;background:#F3FAF7;border-radius:12px;padding:10px 12px}
  .sim-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sim-h b{font-size:12.5px;font-weight:800;color:var(--accent-d)}
  .sim-h span{font-size:11px;color:var(--muted);font-weight:700}
  .sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .sim-item{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:6px 8px;min-width:0}
  .sim-item span{display:block;font-size:10px;font-weight:700;color:var(--muted)}
  .sim-item b{display:block;margin-top:1px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .inst-row{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 11px;border:1px dashed #CFE0DA;background:#FAFDFB;border-radius:12px;flex-wrap:wrap}
  .inst-l{display:flex;flex-direction:column;margin-right:2px}
  .inst-l b{font-size:12px;font-weight:800;color:var(--accent-d)}
  .inst-l small{font-size:10px;font-weight:700;color:var(--muted)}
  .inst-in{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .inst-in:focus{outline:0;border-color:var(--accent)}
  .inst-row .ics{margin-left:auto;white-space:nowrap;font-size:11.5px;font-weight:800;padding:7px 10px}
  @media (max-width:680px){
    .inst-row .ics{margin-left:0;width:100%;justify-content:center}
  }

  .abtn.done{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
  .abtn.undo{background:#FFF9EC;border-color:#EFD9A6;color:#8A5A00;font-weight:800}
  .sabtn.undo{background:#FFF9EC;border-color:#EFD9A6}
  .stage-hint{margin-top:7px;font-size:11px;font-weight:700;color:#8A5A00;background:#FFF9EC;border:1px dashed #EFD9A6;border-radius:9px;padding:7px 10px;line-height:1.45}

  /* 계약 금액 + 계약 안내서 */
  .money-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:11px 12px;border:1px dashed #E3D6BF;background:#FFFCF5;border-radius:12px}
  .pay-line{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pay-line label{font-size:10px;font-weight:800;color:#8A6A1F;flex:0 0 auto}
  .pay-chips{display:flex;gap:4px;flex-wrap:wrap}
  .pay-chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--ink2)}
  .pay-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pay-hint{font-size:10px;font-weight:700;color:var(--muted)}
  .vat-note{grid-column:1 / -1;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}
  .money-item{display:grid;gap:3px;min-width:0;align-content:start}
  .money-item.span2{grid-column:span 2}
  .money-item label{font-size:11px;font-weight:800;color:#8A6A1F}
  .money-item input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:14px;font-weight:800;color:var(--ink);text-align:right}
  .money-item input:focus{outline:0;border-color:var(--accent)}
  .money-item .amt{font-size:16px;font-weight:800;color:var(--ink2);text-align:right;padding:8px 2px 0;white-space:nowrap}
  .money-item .amt.strong{font-size:17px;color:var(--accent-d)}
  .money-hint{font-size:10px;font-weight:700;color:var(--accent-d)}
  .money-hint:empty{display:none}
  .money-item .bal{font-size:16px;font-weight:800;color:var(--accent-d);text-align:right;padding:8px 2px 0}
  .money-item .bal small{font-size:10px;font-weight:700;color:var(--muted);margin-left:6px}

  /* 📅 설치 일정 */
  .sched-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .sched-sum .ss{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .sched-sum .ss b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .sched-sum .ss span{font-size:11.5px;font-weight:700;color:var(--muted)}
  .sched-day{display:flex;align-items:baseline;gap:8px;margin:14px 2px 7px}
  .sched-day b{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
  .sched-day span{font-size:11.5px;font-weight:700;color:var(--muted)}
  .sched-day.is-today b{color:var(--accent-d)}
  .sched-day.is-today b::before{content:"● ";font-size:9px;vertical-align:2px}
  .srow{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
  .srow.is-done{opacity:.62}
  .stime{flex:0 0 54px;font-size:13px;font-weight:800;color:var(--accent-d);font-variant-numeric:tabular-nums;padding-top:1px}
  .smain{flex:1 1 auto;min-width:0}
  .stitle{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .stitle b{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .stitle em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .stype{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#FEF3C7;color:#92400E}
  .stype.new{background:var(--accent-t);color:var(--accent-d)}
  .saddr{margin-top:2px;font-size:12px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sstage{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--accent-t);color:var(--accent-d)}
  .sstage[data-st="talk"]{background:var(--blue-bg);color:var(--blue)}
  .sstage[data-st="deposit"]{background:#FFF7E6;color:#8A5A00}
  .sstage[data-st="reserved"]{background:#F1EEFB;color:#5B3FB8}
  .sstage[data-st="done"]{background:var(--ink);color:#fff}
  .sinline{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px}
  .sinline .sin{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:11.5px;font-weight:700;color:var(--ink2);max-width:132px}
  .sstage-sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:11.5px;font-weight:800;color:var(--ink)}
  .sacts{display:flex;gap:5px;flex:0 0 auto}
  .sabtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .sabtn.done{border-color:var(--accent);background:var(--accent);color:#fff}

  @media (max-width:680px){
    .sim-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stime{flex-basis:46px;font-size:12px}
    .money-row{grid-template-columns:1fr 1fr}
    .pay-line{grid-column:1 / -1}
  }

  .alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .abadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px}
  .abadge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #F3CFC6}
  .abadge.info{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
  .abadge.link{background:var(--blue-bg);color:var(--blue);border:1px solid #BFDBFE}

  .spec-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
    margin-top:11px;background:var(--soft);border:1px solid var(--line2);
    border-radius:12px;padding:10px 12px;
  }
  .spec-item .sl{font-size:11px;font-weight:700;color:var(--muted)}
  .spec-item .sv{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:2px}

  .route{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:stretch;margin-top:10px}
  .rbox{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff}
  .rbox-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .rtag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
  .rtag.from{background:#FEF3C7;color:#92400E}
  .rtag.to{background:var(--accent-t);color:var(--accent-d)}
  .rmap{font-size:11.5px;font-weight:700;color:var(--muted)}
  .raddr{margin-top:6px;font-size:14px;font-weight:800;color:var(--ink)}
  .rsub{margin-top:3px;font-size:12.5px;color:var(--body)}
  .rsub .no-el{color:var(--warn);font-weight:800}
  .rarrow{display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:15px}

  .memo-box{
    margin-top:10px;padding:10px 12px;border-radius:12px;
    background:#FFFCF5;border:1px solid #EFE4CC;
    font-size:13.5px;line-height:1.55;color:var(--ink2);white-space:pre-wrap;
  }
  .memo-box a{color:var(--blue);text-decoration:underline}

  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-btn{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:74px;height:74px;background:var(--soft);flex:0 0 auto}
  .photo-btn img{width:100%;height:100%;object-fit:cover}

  .qs-foot{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);
  }
  .qacts{display:flex;flex-wrap:wrap;gap:6px}
  .abtn{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);
  }
  .abtn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
  .abtn.danger{color:var(--warn)}

  /* Hub Links Grid */
  .hub-sec-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:16px 2px 8px}
  .hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hub-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
    transition:transform .12s,border-color .15s;
  }
  .hub-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .hub-ico{font-size:24px;line-height:1}
  .hub-t{font-size:15.5px;font-weight:800;color:var(--ink)}
  .hub-d{font-size:12.5px;color:var(--muted);line-height:1.45}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

  /* Bottom Tab Bar (App style) */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-in{

<script>
(function(){
  "use strict";

  var SB = {
    url: "https://jbqilpvxdzizumjvzgvm.supabase.co",
    key: "sb_publishable_4JZK0mjoMFnkU8A_QbW-Iw_hcd_F3ce"
  };
  var KEY_RELOC = "beo_relocation_admin_key";
  var KEY_MARKET = "beo_market_admin_key";
  var PIPE_KEY = "beo-pipeline-v1";        /* 상세 단계·설치일 — 이 기기 저장(DB status와 함께) */
  var CAP_KEY = "beo-pipeline-db-cap";     /* update 액션이 되는 서버인지 한 번만 확인해 기억 */
  var QUOTE_LABEL = { new: "신규", contacted: "연락완료", done: "설치 완료" };
  var MARKET_LABEL = { active: "판매중", reserved: "예약중", sold: "판매완료", hidden: "숨김", pending: "검수대기" };
  var INQ_LABEL = { new: "신규", contacted: "연락완료", done: "완료" };
  /* 진행 단계 — 화면표시 5단계 ↔ DB status(new/contacted/done) 안전 매핑 */
  var STAGES = [
    { v: "new",      label: "신규",        db: "new" },
    { v: "talk",     label: "상담중",      db: "contacted" },
    { v: "deposit",  label: "계약금 입금",  db: "contacted" },
    { v: "reserved", label: "예약중",      db: "contacted" },
    { v: "done",     label: "설치 완료",    db: "done" }
  ];
  var STAGE_BY_V = {};
  STAGES.forEach(function(s){ STAGE_BY_V[s.v] = s; });

  /* ---------- 이 기기 저장 (진행 단계 · 설치 일시) ---------- */
  function readPipe(){
    try { return JSON.parse(localStorage.getItem(PIPE_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function writePipe(o){
    try { localStorage.setItem(PIPE_KEY, JSON.stringify(o)); } catch (e) {}
  }
  function pipeOf(id){ return readPipe()[id] || {}; }
  function setPipe(id, patch){
    var o = readPipe();
    o[id] = Object.assign({}, o[id] || {}, patch, { at: new Date().toISOString() });
    writePipe(o);
  }
  function stageOf(q){
    var p = pipeOf(q.id);
    if (p.stage && STAGE_BY_V[p.stage]) return p.stage;
    var tag = parseMemo(q.memo).stage;
    if (tag){
      var hit = STAGES.filter(function(s){ return s.label === tag; })[0];
      if (hit) return hit.v;
    }
    if ((q.status || "new") === "done") return "done";
    if (q.status === "contacted") return "talk";
    return "new";
  }
  function installOf(q){
    var p = pipeOf(q.id);
    var date = p.installDate || "";
    var time = p.installTime || "";
    if (!date){
      var t = parseMemo(q.memo).install;
      if (t){ var m = t.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); if (m){ date = m[1]; time = m[2] || ""; } }
    }
    return { date: date, time: time };
  }
  /* ---------- 계약 금액 (공급가액 · 부가세 10% · 합계 · 계약금 · 잔금 · 결제 증빙) ---------- */
  /* 결제 증빙은 카드결제 · 세금계산서 · 현금영수증(및 미정)만 둔다 — 증빙 없는 현금 옵션은 두지 않는다.
     어떤 결제수단이든 공급가액 + 부가세 10% = 합계 구조를 똑같이 적용한다. */
  var PAY_OPTS = ["카드결제", "세금계산서", "현금영수증"];
  var VAT_RATE = 0.1;
  function normalizePay(v){
    var s = String(v == null ? "" : v).trim();
    if (!s) return "";
    if (/현금영수증/.test(s)) return "현금영수증";
    if (/세금계산서/.test(s)) return "세금계산서";
    if (/카드/.test(s)) return "카드결제";
    return "";   /* 예전 현금 표기는 더 쓰지 않는다 → 미정 */
  }
  function payOf(q){
    var p = pipeOf(q.id);
    if (Object.prototype.hasOwnProperty.call(p, "pay")) return normalizePay(p.pay);
    var pay2 = normalizePay(parseMemo(q.memo).pay);
    if (pay2) return pay2;
    var m = String(q.memo || "").match(/\[결제·증빙\]\s*([^\n\r]+)/);
    return m ? normalizePay(m[1]) : "";
  }
  /* 금액 입력 해석 — 500000(원)은 그대로, 1000 미만 정수는 만 원 단위(예: 50 → 500,000) */
  function amountOf(raw){
    var t = String(raw == null ? "" : raw).replace(/[^0-9.]/g, "");
    if (t === "" || t === ".") return "";
    var n = Number(t);
    if (!isFinite(n) || n < 0) return "";
    if (n > 0 && n < 1000) return Math.round(n * 10000);
    return Math.round(n);
  }
  /* 계약 금액 — 입력은 공급가액(부가세 별도). 합계 = 공급가액 + 부가세 10% */
  function moneyOf(q){
    var p = pipeOf(q.id);
    var hasSupply = Object.prototype.hasOwnProperty.call(p, "supply");
    var hasDeposit = Object.prototype.hasOwnProperty.call(p, "deposit");
    var supply = (hasSupply && p.supply !== "" && p.supply != null) ? Number(p.supply) : "";
    var deposit = (hasDeposit && p.deposit !== "" && p.deposit != null) ? Number(p.deposit) : "";
    var tag = parseMemo(q.memo).money;
    var mSupply = null, mTotal = null, mDeposit = null;
    if (tag){
      var ms = tag.match(/(?:공급가액|공급가)\s*([\d,]+)/);
      var mt = tag.match(/(?:합계|총)\s*([\d,]+)/);
      var md = tag.match(/계약금\s*([\d,]+)/);
      if (ms) mSupply = Number(ms[1].replace(/,/g, ""));
      if (mt) mTotal = Number(mt[1].replace(/,/g, ""));
      if (md) mDeposit = Number(md[1].replace(/,/g, ""));
    }
    if (!hasSupply){
      if (mSupply != null && !isNaN(mSupply)) supply = mSupply;
      /* 예전 기록은 부가세 포함 총 금액만 있어 공급가액으로 되돌린다 */
      else if (mTotal != null && !isNaN(mTotal)) supply = Math.round(mTotal / (1 + VAT_RATE));
      else if (p.total != null && p.total !== "") supply = Math.round(Number(p.total) / (1 + VAT_RATE));
    }
    if (!hasDeposit && mDeposit != null && !isNaN(mDeposit)) deposit = mDeposit;
    supply = (supply === "" || isNaN(supply)) ? "" : Math.round(supply);
    deposit = (deposit === "" || isNaN(deposit)) ? "" : Math.round(deposit);
    var total = supply === "" ? "" : Math.round(supply * (1 + VAT_RATE));
    var vat = supply === "" ? "" : total - supply;
    var balance = (total !== "" && deposit !== "") ? Math.max(0, total - deposit) : null;
    return { supply: supply, vat: vat, total: total, deposit: deposit, balance: balance };
  }
  function won(v){ return v === "" || v == null || isNaN(v) ? "—" : Number(v).toLocaleString("ko-KR") + "원"; }
  function moneyNote(m){
    if (!m || m.supply === "") return "공급가액을 입력하면 부가세 10%가 자동으로 붙습니다 · 계약금은 직접 입력";
    return "공급가액 " + won(m.supply) + " + 부가세 " + won(m.vat) + " = 합계 " + won(m.total) + " (부가세 포함)";
  }
  /* 화면 갱신 — 입력할 때마다 카드 전체를 다시 그리지 않고 계산값만 바꾼다 */
  function paintMoney(card, m){
    if (!card) return;
    var put = function(sel, txt){ var el = card.querySelector(sel); if (el) el.textContent = txt; };
    put('[data-amt="vat"]', won(m.vat));
    put('[data-amt="total"]', won(m.total));
    var bal = card.querySelector('[data-amt="balance"]');
    if (bal) bal.innerHTML = (m.balance == null ? "—" : won(m.balance)) + '<small>합계 − 계약금</small>';
    put(".vat-note", moneyNote(m));
  }

  var state = {
    adminKey: "",
    nav: "reloc", /* reloc | newbooth | market | hub */
    quotes: [],
    market: { listings: [], inquiries: [] },
    qStatus: "all",
    query: "",
    mkTab: "pending",
    lbPhotos: [],
    lbIdx: 0
  };

  var app = document.getElementById("app");
  var topActions = document.getElementById("top-actions");
  var bottomNav = document.getElementById("bottom-nav");
  var topSub = document.getElementById("top-sub");

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function digits(v){ return String(v || "").replace(/[^0-9]/g, ""); }
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }
  function rpc(name, body){
    return fetch(SB.url + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {
        "apikey": SB.key,
        "Authorization": "Bearer " + SB.key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body || {}),
      cache: "no-store"
    }).then(function(res){
      return res.text().then(function(t){
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!res.ok) throw new Error((d && (d.message || d.error)) || ("요청 실패 (" + res.status + ")"));
        return d;
      });
    });
  }
  function fmtDate(s){
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d.getTime())) return "";
    var o = new Date(d.getTime() + 9 * 3600 * 1000);
    return o.getUTCFullYear() + "." + String(o.getUTCMonth()+1).padStart(2,"0") + "." + String(o.getUTCDate()).padStart(2,"0")
      + " " + String(o.getUTCHours()).padStart(2,"0") + ":" + String(o.getUTCMinutes()).padStart(2,"0");
  }
  function fmtDay(s){ return s ? String(s).replace(/-/g, ".") : "미정"; }
  function sizeLine(q){
    var p = [q.width_mm, q.depth_mm, q.height_mm].map(function(v){
      return v ? Number(v).toLocaleString("ko-KR") : "?";
    });
    if (p[0] === "?" && p[1] === "?" && p[2] === "?") return "크기 미기재";
    return p.join(" × ") + " mm";
  }
  function naverMapUrl(addr){
    return "https://map.naver.com/p/search/" + encodeURIComponent(addr || "");
  }
  function linkify(v){
    return esc(v).replace(/(https?:\/\/[^\s<]+)/g, function(u){
      return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
  }
  function isNewBoothQuote(q){
    return String(q.brand || "").indexOf("[신규부스]") === 0;
  }
  function parseMemo(raw){
    var lines = String(raw || "").split(/\r?\n/);
    var listingUrl = "", aircon = "", pay = "", stage = "", install = "", money = "", sim = null, simUrl = "", bpUrl = "", rest = [];
    lines.forEach(function(line){
      var t = line.trim();
      if (t.indexOf("[매물 링크]") === 0) listingUrl = t.replace("[매물 링크]", "").trim();
      else if (t.indexOf("[에어컨]") === 0) aircon = t.replace("[에어컨]", "").trim();
      else if (t.indexOf("[결제·증빙]") === 0) pay = t.replace("[결제·증빙]", "").trim();
      else if (t.indexOf("[진행]") === 0) stage = t.replace("[진행]", "").trim();
      else if (t.indexOf("[설치일]") === 0) install = t.replace("[설치일]", "").trim();
      else if (t.indexOf("[금액]") === 0) money = t.replace("[금액]", "").trim();
      else if (t.indexOf("[SIM_SPEC]") === 0){
        try { sim = JSON.parse(t.replace("[SIM_SPEC]", "").trim()); } catch (e) { sim = null; }
      }
      else if (t.indexOf("[시뮬레이터]") === 0) simUrl = t.replace("[시뮬레이터]", "").trim();
      else if (t.indexOf("[설계도]") === 0) bpUrl = t.replace("[설계도]", "").trim();
      else rest.push(line);
    });
    return { listingUrl: listingUrl, aircon: aircon, pay: pay, stage: stage, install: install, money: money,
             sim: sim, simUrl: simUrl, bpUrl: bpUrl, note: rest.join("\n").trim() };
  }

  /* ---------- 시뮬레이터 사양(SIM_SPEC) → 표시용 · 링크용 ---------- */
  var ARTBOARD_LABEL = { beige:"연베이지", beige_d:"진베이지", white:"화이트", gray_l:"연그레이", gray_d:"진그레이",
    black:"블랙", orange:"오렌지", melon:"메론", green:"그린", sky:"스카이블루", blue:"블루", pink:"핑크" };
  var SLAT_LABEL = { oak:"내추럴 오크", walnut:"미디엄 월넛", white:"화이트", whitewash:"화이트워시",
    maple:"메이플", teak:"티크", ash:"애쉬 오크", dark:"다크 월넛" };
  var FLOOR_LABEL = { oak:"멜로우 오크", pine:"화이트 파인" };
  var WALL_LABEL = { left:"좌측", back:"후면", right:"우측", front:"앞면" };
  var DOOR_LABEL = { left:"좌측 구석", center:"가운데", right:"우측 구석" };
  var WIN_LABEL = { none:"없음", "600x800":"600×800", "800x800":"800×800", "1200x800":"1200×800", double1200:"이중창 1200" };
  function simBadges(sim){
    if (!sim) return [];
    var out = [];
    var mm = function(v){ return Number(v || 0).toLocaleString("ko-KR"); };
    out.push(["규격", mm(sim.w) + " × " + mm(sim.d)]);
    if (sim.ab) out.push(["아트보드", ARTBOARD_LABEL[sim.ab] || sim.ab]);
    if (sim.sl) out.push(["라인타공", (SLAT_LABEL[sim.sl] || sim.sl) + " · " + (WALL_LABEL[sim.sp] || "후면")]);
    out.push(["조명", sim.light === "rail" ? "레일등" : "COB 매립등 2구"]);
    out.push(["중앙등", sim.lt === "6500" ? "주광색 6500K" : "주백색 4000K"]);
    if (sim.fl) out.push(["마루", FLOOR_LABEL[sim.fl] || sim.fl]);
    out.push(["문", (DOOR_LABEL[sim.door] || sim.door || "-") + " · " + (sim.hg === "left" ? "좌경첩" : "우경첩")]);
    out.push(["시창", sim.win === "none" || !sim.win ? "없음" : (WIN_LABEL[sim.win] || sim.win) + " · " + (WALL_LABEL[sim.wp] || "좌측")]);
    out.push(["프로젝트창", sim.pr === "in" ? "포함" : "없음"]);
    return out;
  }
  /* 시뮬레이터와 설계도가 같이 읽는 쿼리 — configurator.html / blueprint.html 공통 */
  function simQuery(sim){
    if (!sim) return "";
    var p = [];
    var add = function(k, v){ if (v !== undefined && v !== null && v !== "") p.push(k + "=" + encodeURIComponent(v)); };
    add("sim", "1"); add("w", sim.w); add("d", sim.d);
    add("da", sim.door); add("hg", sim.hg); add("lf", sim.sp);
    add("lm", sim.light === "rail" ? "rail" : "cob");
    if (sim.win && sim.win !== "none"){ add("ws", sim.win); add("wc", "1"); add("wn", sim.wp); }
    if (sim.pr === "in") add("pj", "in");

  function buildTaggedMemo(q, stage, inst, money, pay){
    var base = String(q.memo || "").split(/\r?\n/).filter(function(l){
      var t = l.trim();
      return !(t.indexOf("[진행]") === 0 || t.indexOf("[설치일]") === 0 || t.indexOf("[금액]") === 0 || t.indexOf("[결제·증빙]") === 0);
    }).join("\n").trim();
    var lines = [];
    if (base) lines.push(base);
    lines.push("[진행]" + stageLabel(stage));
    if (inst && inst.date) lines.push("[설치일]" + inst.date + (inst.time ? " " + inst.time : ""));
    if (money && (money.supply !== "" || money.deposit !== "")){
      var mparts = [];
      if (money.supply !== "")
        mparts.push("공급가액 " + money.supply.toLocaleString("ko-KR")
          + " / 부가세 " + (money.vat || 0).toLocaleString("ko-KR")
          + " / 합계 " + (money.total || 0).toLocaleString("ko-KR"));
      mparts.push("계약금 " + (money.deposit || 0).toLocaleString("ko-KR"));
      lines.push("[금액]" + mparts.join(" / "));
    }
    if (pay) lines.push("[결제·증빙] " + pay);
    return lines.join("\n").slice(0, 2000);
  }
  function memoCapable(){
    try { return localStorage.getItem(CAP_KEY) || ""; } catch (e) { return ""; }
  }
  function markMemoCap(ok){
    try { localStorage.setItem(CAP_KEY, ok); } catch (e) {}
  }
  /* 서버가 memo 수정을 지원하면 DB에 남기고, 없으면 조용히 기기 저장만 쓴다.
     ① relocation_admin 액션 'update' → ② 별도 RPC 'relocation_admin_update' → ③ 기기 저장 */
  function pushMemoUpdate(q, stage){
    var cap = memoCapable();
    if (cap === "none") return;
    var memo = buildTaggedMemo(q, stage, installOf(q), moneyOf(q), payOf(q));
    var done = function(res){
      if (res && res.ok){ markMemoCap("relocation_admin"); q.memo = memo; return true; }
      return false;
    };
    var tryAlt = function(){
      rpc("relocation_admin_update", { p_key: state.adminKey, p_payload: { id: q.id, memo: memo } })
        .then(function(res){
          if (res && res.ok){ markMemoCap("relocation_admin_update"); q.memo = memo; }
          else markMemoCap("none");
        })
        .catch(function(){ markMemoCap("none"); });
    };
    if (cap === "relocation_admin_update"){ tryAlt(); return; }
    rpc("relocation_admin", { p_key: state.adminKey, p_action: "update", p_payload: { id: q.id, memo: memo } })
      .then(function(res){
        if (done(res)) return;
        if (res && /unknown action/i.test(String(res.error || ""))) tryAlt();
        else markMemoCap("none");
      })
      .catch(function(){ tryAlt(); });
  }
  function saveStage(id, stage){
    var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
    var s = STAGE_BY_V[stage] || STAGE_BY_V.new;
    setPipe(id, { stage: stage });
    if (q) pushMemoUpdate(q, stage);
    if (q && (q.status || "new") !== s.db){
      return rpc("relocation_admin", { p_key: state.adminKey, p_action: "status", p_payload: { id: id, status: s.db } })
        .then(function(res){
          if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
          q.status = s.db;
        });
    }
    return Promise.resolve();
  }

function icsAddDays(ymd, n){

function icsFold(line){
  var enc = new TextEncoder();
  var out = [], cur = "", len = 0;
  for (var i = 0; i < line.length; i++){
    var ch = line.charAt(i);
    var bl = enc.encode(ch).length;
    if (len + bl > 73){ out.push(cur); cur = " " + ch; len = 1 + bl; }
    else { cur += ch; len += bl; }
  }
  out.push(cur);
  return out.join("\r\n");
}

        + '    <div class="stitle"><span class="stype ' + (i.isNew ? "new" : "move") + '">' + (i.isNew ? "신규" : "이전") + '</span>'
        + '      <b>' + esc(q.customer_name || "성함 미기재") + '</b>' + (i.tentative ? '<em>희망일</em>' : '') + '</div>'
        + '    <div class="saddr">' + esc(addr) + (q.to_floor ? ' · ' + esc(q.to_floor) : '') + '</div>'
        + '    <div class="sstage" data-st="' + i.stage + '">' + stageLabel(i.stage) + '</div>'
        + '    <div class="sinline">'
        + '      <input type="date" class="sin" data-sch-id="' + esc(q.id) + '" data-sch-k="date" value="' + esc(i.date) + '" aria-label="설치 날짜">'
        + '      <input type="time" class="sin" data-sch-id="' + esc(q.id) + '" data-sch-k="time" value="' + esc(i.time) + '" aria-label="설치 시간">'
        + '      <select class="sstage-sel" data-sstage-id="' + esc(q.id) + '" aria-label="진행 단계">'
        + STAGES.map(function(s){ return '<option value="' + s.v + '"' + (i.stage === s.v ? ' selected' : '') + '>' + s.label + '</option>'; }).join("")
        + '      </select>'
        + '    </div>'
        + '  </div>'
        + '  <div class="sacts">'
        + (digits(q.customer_phone) ? '<a class="sabtn" href="tel:' + esc(digits(q.customer_phone)) + '" aria-label="전화">📞</a>' : '')
        + (q.to_region ? '<a class="sabtn" href="' + naverMapUrl(q.to_region) + '" target="_blank" rel="noopener" aria-label="지도">🗺️</a>' : '')
        + (i.stage !== "done"
            ? '<button type="button" class="sabtn done" data-qdone="' + esc(q.id) + '" aria-label="설치 완료">✅</button>'
            : '<button type="button" class="sabtn undo" data-qundone="' + esc(q.id) + '" aria-label="완료 취소">↩️</button>')
        + '  </div>'
        + '</div>';
    };

    groups.forEach(function(g){
      var openCount = g.items.filter(function(i){ return i.stage !== "done"; }).length;
      html += '<div class="sched-day' + (g.date === today ? " is-today" : "") + '">'
        + '<b>' + esc(fmtDay(g.date)) + ' (' + weekdayOf(g.date) + ')</b>'
        + '<span>' + g.items.length + '건' + (openCount ? ' · 남은 ' + openCount : ' · 마감') + '</span></div>';
      html += g.items.map(rowHtml).join("");
    });

    if (undated.length){
      html += '<div class="sched-day"><b>일정 미정</b><span>' + undated.length + '건</span></div>';
      html += undated.map(rowHtml).join("");
    }
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll("[data-sch-id]"), function(inp){
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-sch-id");
        var k = inp.getAttribute("data-sch-k");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        setPipe(id, k === "date" ? { installDate: inp.value || "" } : { installTime: inp.value || "" });
        pushMemoUpdate(q, stageOf(q));
        toast(inp.value ? (k === "date" ? "설치 날짜 " + inp.value + " 저장" : "설치 시간 " + inp.value + " 저장") : "일정을 비웠습니다");
        renderScheduleTab();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-sstage-id]"), function(sel){
      sel.addEventListener("change", function(){
        var id = sel.getAttribute("data-sstage-id");
        var v = sel.value;
        Promise.resolve(saveStage(id, v)).then(function(){
          toast("진행 단계를 ‘" + stageLabel(v) + "’(으)로 바꿨어요");
          loadAll();
        }).catch(function(err){ alert(err.message); });
      });
    });
    /* ✅ 완료 / ↩️ 완료 취소 — 일정 탭에서도 바로 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-qdone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "done")).then(function(){
          toast("설치 완료로 마감했습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-qundone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qundone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "reserved")).then(function(){
          toast("설치 완료를 예약중으로 되돌렸습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
  }

  function render(){
    topActions.hidden = false;
    bottomNav.hidden = false;
    updateBadges();

    Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-nav") === state.nav ? "true" : "false");
    });

    if (state.nav === "reloc") {
      topSub.textContent = "이전설치";
      renderQuotesTab(false);
    } else if (state.nav === "newbooth") {
      topSub.textContent = "신규설치";
      renderQuotesTab(true);
    } else if (state.nav === "market") {
      topSub.textContent = "중고마켓";
      renderMarketTab();
    } else if (state.nav === "sched") {
      topSub.textContent = "설치 일정";
      renderScheduleTab();
    } else {
      topSub.textContent = "도면·사이트";
      renderHubTab();
    }
  }

  function renderQuotesTab(isNewTab){
    var base = state.quotes.filter(function(q){ return isNewTab ? isNewBoothQuote(q) : !isNewBoothQuote(q); });
    base.forEach(function(q){ q.__stage = stageOf(q); });
    var counts = { all: base.length };
    STAGES.forEach(function(s){ counts[s.v] = base.filter(function(q){ return q.__stage === s.v; }).length; });
    var qLower = state.query.trim().toLowerCase();
    var filtered = base.filter(function(q){
      if (state.qStatus !== "all" && q.__stage !== state.qStatus) return false;
      if (!qLower) return true;
      return [q.customer_name, q.customer_phone, q.brand, q.booth_type, q.from_region, q.to_region, q.memo, q.id].join(" ").toLowerCase().indexOf(qLower) !== -1;
    });

    var kpis = [["all", "전체", counts.all]].concat(STAGES.map(function(s){ return [s.v, s.label, counts[s.v]]; }))
      .map(function(k){
        return '<button type="button" class="kpi" data-qtab="' + k[0] + '" aria-pressed="' + (state.qStatus === k[0] ? "true" : "false") + '">'
          + '<div class="kl">' + k[1] + '</div><div class="kv">' + k[2] + '</div></button>';
      }).join("");

    var cardsHtml = filtered.length
      ? filtered.map(function(q){ return renderQuoteCard(q, isNewTab); }).join("")
      : '<div class="empty">' + (base.length ? "조건에 맞는 요청이 없습니다." : (isNewTab ? "신규 부스 견적 요청이 없습니다." : "이전설치 견적 요청이 없습니다.")) + '</div>';

    app.innerHTML = ''
      + '<div class="kpi-row">' + kpis + '</div>'
      + '<div class="toolbar">'
      + '  <div class="search-wrap">'
      + '    <input id="q-search" type="search" placeholder="고객명, 연락처, 지역, 메모 검색…" value="' + esc(state.query) + '">'
      + '    <button type="button" class="search-clear' + (state.query ? ' show' : '') + '" id="q-clear" aria-label="지우기">×</button>'
      + '  </div>'
      + '</div>'
      + '<div class="grid">' + cardsHtml + '</div>';

    bindQuoteEvents();
  }

  function renderQuoteCard(q, isNewTab){

    var alerts = [];

    if (pm.pay) alerts.push('<span class="abadge info">💳 ' + esc(pm.pay) + '</span>');
    if (pm.listingUrl) alerts.push('<a class="abadge link" href="' + esc(pm.listingUrl) + '" target="_blank" rel="noopener">🔗 매물 링크 ↗</a>');

    var statusBtns = STAGES.map(function(s){
      return '<button type="button" class="sp' + (st === s.v ? " on" : "") + '" data-qstage="' + s.v + '" data-qid="' + esc(q.id) + '" data-st="' + s.v + '">' + s.label + '</button>';

    var routeHtml = isNewTab
      ? '<div class="rbox" style="margin-top:10px">'

        + '<div class="raddr">' + esc(q.to_region || "미기재") + '</div>'
        + '<div class="rsub">' + esc(q.to_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.to_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.to_elevator || "미기재")) + '</div></div>'
      : '<div class="route">'
        + '  <div class="rbox">'
        + '    <div class="rbox-top"><span class="rtag from">해체 (출발)</span>'
        + (q.from_region ? '<a class="rmap" href="' + naverMapUrl(q.from_region) + '" target="_blank" rel="noopener">지도 ↗</a>' : '') + '</div>'
        + '    <div class="raddr">' + esc(q.from_region || "미기재") + '</div>'
        + '    <div class="rsub">' + esc(q.from_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.from_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.from_elevator || "미기재")) + '</div>'
        + '  </div>'
        + '  <div class="rarrow" aria-hidden="true">→</div>'
        + '  <div class="rbox">'
        + '    <div class="rbox-top"><span class="rtag to">설치 (도착)</span>'
        + (q.to_region ? '<a class="rmap" href="' + naverMapUrl(q.to_region) + '" target="_blank" rel="noopener">지도 ↗</a>' : '') + '</div>'
        + '    <div class="raddr">' + esc(q.to_region || "미기재") + '</div>'
        + '    <div class="rsub">' + esc(q.to_floor || "층수 미기재") + ' · 엘리베이터 '
        + (q.to_elevator === "없음" ? '<span class="no-el">없음</span>' : esc(q.to_elevator || "미기재")) + '</div>'
        + '  </div>'
        + '</div>';

    /* 시뮬레이터 사양 배지 (있을 때만) */
    var badges = simBadges(pm.sim);
    var simHtml = badges.length
      ? '<div class="sim-box">'
        + '  <div class="sim-h"><b>🎨 시뮬레이터 사양</b><span>고객이 고른 옵션 · 자재·재단은 📐 설계도</span></div>'
        + '  <div class="sim-grid">' + badges.map(function(b){
            return '<div class="sim-item"><span>' + esc(b[0]) + '</span><b>' + esc(b[1]) + '</b></div>';
          }).join("") + '</div>'
        + '</div>'
      : '';

    var photosHtml = photos.length
      ? '<div class="photos">' + photos.map(function(u, idx){
          return '<button type="button" class="photo-btn" data-lb-type="quote" data-lb-id="' + esc(q.id) + '" data-lb-idx="' + idx + '">'
            + '<img src="' + esc(u) + '" alt="사진 ' + (idx + 1) + '" loading="lazy"></button>';
        }).join("") + '</div>'
      : '';

    var instHtml = '<div class="inst-row">'
      + '  <div class="inst-l"><b>설치 예정일</b><small>현장 확정 일시 · 계약서 작업일자로 쓰입니다</small></div>'
      + '  <input type="date" class="inst-in" data-inst-id="' + esc(q.id) + '" data-inst-k="date" value="' + esc(inst.date) + '" aria-label="설치 예정일">'
      + '  <input type="time" class="inst-in" data-inst-id="' + esc(q.id) + '" data-inst-k="time" value="' + esc(inst.time) + '" aria-label="설치 시간">'
      + '  <button type="button" class="abtn ics" data-ics-id="' + esc(q.id) + '">📅 캘린더 추가(.ics)</button>'

    var m = moneyOf(q);

      + '  <div class="pay-line">'
      + '    <label>결제 증빙</label>'
      + '    <div class="pay-chips">' + PAY_OPTS.map(function(p){
        return '<button type="button" class="pay-chip' + (pay === p ? " on" : "") + '" data-pay-id="' + esc(q.id) + '" data-pay="' + p + '">' + p + '</button>';
      }).join("") + '</div>'
      + '    <span class="pay-hint">카드 · 세금계산서 · 현금영수증 모두 공급가액 + 부가세 10% = 합계로 같습니다</span>'
      + '  </div>'
      + '  <div class="money-item"><label>공급가액 (원 · 부가세 별도)</label>'
      + '    <input type="number" min="0" step="10000" inputmode="numeric" data-money-id="' + esc(q.id) + '" data-money-k="supply" value="' + (m.supply === "" ? "" : m.supply) + '" placeholder="예: 500000">'
      + '    <div class="money-hint" data-hint="supply"></div></div>'
      + '  <div class="money-item"><label>부가세 (10%)</label>'
      + '    <div class="amt" data-amt="vat">' + won(m.vat) + '</div></div>'
      + '  <div class="money-item"><label>합계 (부가세 포함)</label>'
      + '    <div class="amt strong" data-amt="total">' + won(m.total) + '</div></div>'
      + '  <div class="money-item"><label>계약금 (원)</label>'
      + '    <input type="number" min="0" step="10000" inputmode="numeric" data-money-id="' + esc(q.id) + '" data-money-k="deposit" value="' + (m.deposit === "" ? "" : m.deposit) + '" placeholder="0">'
      + '    <div class="money-hint" data-hint="deposit"></div></div>'
      + '  <div class="money-item span2"><label>잔금 (자동)</label>'
      + '    <div class="bal" data-amt="balance">' + (m.balance == null ? "—" : won(m.balance)) + '<small>합계 − 계약금</small></div></div>'
      + '  <div class="vat-note">' + moneyNote(m) + '</div>'
      + '</div>';

    return '<article class="qsheet' + (st === "new" ? " is-new" : "") + '" data-stage="' + st + '">'
      + '<div class="qs-head">'
      + '  <div>'
      + '    <div class="qs-who">'
      + '      <span class="qs-name">' + esc(q.customer_name || "성함 미기재") + '</span>'
      + '      <a class="qs-phone" href="tel:' + esc(phoneDigits) + '">' + esc(q.customer_phone || "연락처 없음") + '</a>'
      + '      <span class="stage-tag" data-st="' + st + '">' + stageLabel(st) + '</span>'
      + '    </div>'
      + '    <div class="qs-meta"><span class="qs-id">#' + esc(shortId) + '</span><span>접수 ' + esc(fmtDate(q.created_at)) + '</span><span>사진 ' + photos.length + '장</span></div>'
      + '  </div>'
      + '</div>'
      + '<div class="stage-bar">' + statusBtns + '</div>'
      + (st === "done" ? '<div class="stage-hint">완료된 건입니다 — 단계 버튼이나 ↩️ 완료 취소로 언제든 되돌릴 수 있고, 금액·설치일·결제 증빙은 그대로 수정할 수 있습니다.</div>' : '')
      + (alerts.length ? '<div class="alerts">' + alerts.join("") + '</div>' : '')
      + '<div class="spec-grid">'
      + '  <div class="spec-item"><div class="sl">부스 유형</div><div class="sv">' + esc(isNewTab ? "신규 부스" : (q.booth_type || "미상")) + '</div></div>'
      + '  <div class="spec-item"><div class="sl">' + (isNewTab ? "구분" : "제조사") + '</div><div class="sv">' + esc(q.brand || "미기재") + '</div></div>'
      + '  <div class="spec-item"><div class="sl">크기</div><div class="sv">' + esc(sizeLine(q)) + '</div></div>'
      + '  <div class="spec-item"><div class="sl">설치 예정</div><div class="sv">' + (inst.date ? esc(fmtDay(inst.date)) + (inst.time ? ' ' + esc(inst.time) : '') : (q.desired_date ? esc(fmtDay(q.desired_date)) + ' <small style="color:var(--accent-d)">(희망)</small>' : '<span style="color:var(--muted);font-weight:700">미정</span>')) + '</div></div>'
      + '</div>'

      + (phoneDigits ? '<a class="abtn" href="sms:' + esc(phoneDigits) + '">💬 문자</a>' : '')
      + '    <a class="abtn" href="configurator.html?' + simQ + '" target="_blank" rel="noopener">🎨 시뮬레이터</a>'
      + '    <a class="abtn" href="blueprint.html?' + simQ + '" target="_blank" rel="noopener">📐 설계도</a>'
      + '    <button type="button" class="abtn" data-qcopy="' + esc(q.id) + '">📋 요청서 복사</button>'
      + '    <button type="button" class="abtn" data-qcontract="' + esc(q.id) + '">📋 계약 안내 복사</button>'
      + '    <button type="button" class="abtn" data-qcontractimg="' + esc(q.id) + '">🖼️ 계약서 이미지</button>'
      + '  </div>'
      + '  <div class="qacts">'
      + (st === "done" ? '<button type="button" class="abtn undo" data-qundone="' + esc(q.id) + '">↩️ 완료 취소 (예약중으로)</button>' : '')
      + (st !== "done" ? '<button type="button" class="abtn done" data-qdone="' + esc(q.id) + '">✅ 설치 완료</button>' : '')
      + '    <button type="button" class="abtn danger" data-qdel="' + esc(q.id) + '">삭제</button>'
      + '  </div>'
      + '</div>'
      + '</article>';
  }

  function renderMarketTab(){
    var listings = state.market.listings;
    var inquiries = state.market.inquiries;
    var pend = listings.filter(function(l){ return l.status === "pending"; });
    var newInq = inquiries.filter(function(i){ return i.status === "new"; });

    var tabs = [
      ["pending", "검수 대기 " + pend.length],
      ["all", "전체 매물 " + listings.length],
      ["inq", "구매 문의 " + newInq.length + "/" + inquiries.length]
    ].map(function(t){
      return '<button type="button" class="stab" data-mktab="' + t[0] + '" aria-pressed="' + (state.mkTab === t[0] ? "true" : "false") + '">' + t[1] + '</button>';
    }).join("");

    var body = "";
    if (state.mkTab === "pending") {
      body = pend.length ? pend.map(renderListingCard).join("") : '<div class="empty">검수 대기 중인 매물이 없습니다.</div>';
    } else if (state.mkTab === "all") {
      body = listings.length ? listings.map(renderListingCard).join("") : '<div class="empty">등록된 매물이 없습니다.</div>';
    } else {
      body = inquiries.length ? inquiries.map(renderInquiryCard).join("") : '<div class="empty">들어온 구매 문의가 없습니다.</div>';
    }

    app.innerHTML = '<div class="subtabs">' + tabs + '</div><div class="grid">' + body + '</div>';
    bindMarketEvents();
  }

  function renderListingCard(l){
    var st = l.status || "pending";
    var photos = Array.isArray(l.photos) ? l.photos : [];
    var phoneDigits = digits(l.seller_phone);
    var statusBtns = ["active", "reserved", "sold", "hidden", "pending"].map(function(s){
      return '<button type="button" class="sp' + (st === s ? " on" : "") + '" data-mkst="' + s + '" data-mkid="' + esc(l.id) + '">' + MARKET_LABEL[s] + '</button>';
    }).join("");
    var priceTxt = l.price ? Number(l.price).toLocaleString("ko-KR") + "원" : "가격 미기재";

    return '<article class="qsheet' + (st === "pending" ? " is-new" : "") + '">'
      + '<div class="qs-head">'
      + '  <div>'
      + '    <div class="qs-who"><span class="qs-name">' + esc(l.title || l.brand || "제목 없음") + '</span></div>'
      + '    <div class="qs-meta"><span>' + esc(priceTxt) + '</span><span>' + esc(l.region || "지역 미기재") + '</span><span>판매자 ' + esc(l.seller_name || "-") + '</span></div>'
      + '  </div>'
      + '  <div class="status-pills">' + statusBtns + '</div>'
      + '</div>'
      + (l.description ? '<div class="memo-box">' + linkify(l.description) + '</div>' : '')
      + (photos.length ? '<div class="photos">' + photos.map(function(u, idx){
          return '<button type="button" class="photo-btn" data-lb-type="market" data-lb-id="' + esc(l.id) + '" data-lb-idx="' + idx + '">'
            + '<img src="' + esc(u) + '" alt="매물 사진 ' + (idx + 1) + '" loading="lazy"></button>';
        }).join("") + '</div>' : '')
      + '<div class="qs-foot">'
      + '  <div class="qacts">'
      + (phoneDigits ? '<a class="abtn solid" href="tel:' + esc(phoneDigits) + '">📞 판매자 전화</a>' : '')
      + '  </div>'
      + '  <button type="button" class="abtn danger" data-mkdel="' + esc(l.id) + '">삭제</button>'
      + '</div>'
      + '</article>';
  }

  function renderInquiryCard(i){
    var st = i.status || "new";
    var phoneDigits = digits(i.buyer_phone);
    var statusBtns = ["new", "contacted", "done"].map(function(s){
      return '<button type="button" class="sp' + (st === s ? " on" : "") + '" data-inqst="' + s + '" data-inqid="' + esc(i.id) + '">' + INQ_LABEL[s] + '</button>';
    }).join("");

    return '<article class="qsheet' + (st === "new" ? " is-new" : "") + '">'
      + '<div class="qs-head">'
      + '  <div>'
      + '    <div class="qs-who">'
      + '      <span class="qs-name">' + esc(i.buyer_name || "구매 문의자") + '</span>'
      + '      <a class="qs-phone" href="tel:' + esc(phoneDigits) + '">' + esc(i.buyer_phone || "연락처 없음") + '</a>'
      + '    </div>'
      + '    <div class="qs-meta"><span>매물: ' + esc(i.listing_title || i.listing_id || "-") + '</span><span>' + esc(fmtDate(i.created_at)) + '</span></div>'
      + '  </div>'
      + '  <div class="status-pills">' + statusBtns + '</div>'
      + '</div>'
      + (i.message ? '<div class="memo-box">' + linkify(i.message) + '</div>' : '')
      + '<div class="qs-foot">'
      + '  <div class="qacts">'
      + (phoneDigits ? '<a class="abtn solid" href="tel:' + esc(phoneDigits) + '">📞 전화</a>' : '')
      + (phoneDigits ? '<a class="abtn" href="sms:' + esc(phoneDigits) + '">💬 문자</a>' : '')
      + '  </div>'
      + '</div>'
      + '</article>';
  }

  function renderHubTab(){
    app.innerHTML = ''
      + '<div class="hub-sec-title">제작 · 현장 도구</div>'
      + '<div class="hub-grid">'
      + '  <a class="hub-card" href="blueprint.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">📐</div><div class="hub-t">도면 제작 관리</div>'
      + '    <div class="hub-d">제작 도면 생성기(A-101~A-104) 및 발주표 바로 열기</div>'
      + '  </a>'
      + '  <a class="hub-card" href="configurator.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">🧮</div><div class="hub-t">3D 견적 시뮬레이터</div>'
      + '    <div class="hub-d">고객 상담 시 3D 부스 사양 · 문 위치 실시간 확인</div>'
      + '  </a>'
      + '</div>'
      + '<div class="hub-sec-title">베오방음 홈페이지 · 고객 접수 폼</div>'
      + '<div class="hub-grid">'
      + '  <a class="hub-card" href="index.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">🏠</div><div class="hub-t">베오방음 홈페이지</div>'
      + '    <div class="hub-d">메인 · 시공사례 · 제품안내 · 중고위탁 전체</div>'
      + '  </a>'
      + '  <a class="hub-card" href="relocation.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">🚚</div><div class="hub-t">이전설치 고객 접수폼</div>'
      + '    <div class="hub-d">고객에게 링크 전달용 (접수 시 이전설치 탭에 표시)</div>'
      + '  </a>'
      + '  <a class="hub-card" href="quote.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">🏗️</div><div class="hub-t">신규부스 고객 접수폼</div>'
      + '    <div class="hub-d">고객에게 링크 전달용 (접수 시 신규설치 탭에 표시)</div>'
      + '  </a>'
      + '  <a class="hub-card" href="relocation-admin.html" target="_blank" rel="noopener">'
      + '    <div class="hub-ico">📋</div><div class="hub-t">이전설치 단독 뷰어</div>'
      + '    <div class="hub-d">이전설치 상담요청서만 단독으로 띄워두는 화면</div>'
      + '  </a>'
      + '</div>';
  }

  function bindQuoteEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-qtab]"), function(b){
      b.addEventListener("click", function(){ state.qStatus = b.getAttribute("data-qtab"); render(); });
    });
    var search = document.getElementById("q-search");
    var clearBtn = document.getElementById("q-clear");
    if (search) {
      search.addEventListener("input", function(){
        state.query = search.value;
        var pos = search.selectionStart;
        render();
        var s2 = document.getElementById("q-search");
        if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    if (clearBtn) clearBtn.addEventListener("click", function(){ state.query = ""; render(); });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qstage]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qid"), stage = b.getAttribute("data-qstage");
        b.disabled = true;
        Promise.resolve(saveStage(id, stage)).then(function(){
          toast("진행 단계를 ‘" + stageLabel(stage) + "’(으)로 바꿨어요");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qdone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "done")).then(function(){
          toast("설치 완료로 마감했습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qundone]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qundone");
        b.disabled = true;
        Promise.resolve(saveStage(id, "reserved")).then(function(){
          toast("설치 완료를 예약중으로 되돌렸습니다 — 금액·설치일을 다시 수정할 수 있습니다");
          loadAll();
        }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-ics-id]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-ics-id");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        var ics = icsFor(q);
        if (!ics){ toast("설치 예정일을 먼저 입력해 주세요"); return; }
        var blob = new Blob(["\ufeff", ics], { type: "text/calendar;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "베오방음_" + (q.customer_name || "일정") + "_설치_" + installOf(q).date.replace(/-/g, "") + ".ics";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ try { URL.revokeObjectURL(a.href); } catch (e) {} }, 3000);
        toast("캘린더 파일(.ics)을 내려받았습니다 — 전날 알림 포함");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-inst-id]"), function(inp){
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-inst-id");
        var k = inp.getAttribute("data-inst-k");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        /* 날짜 칸에 6자리 연도 같은 잘못된 값이 남는 걸 막는다 — 형식이 맞을 때만 저장 */
        if (k === "date" && inp.value && !/^\d{4}-\d{2}-\d{2}$/.test(inp.value)){
          inp.value = pipeOf(id).installDate || "";
          toast("연도 4자리 · 월·일 2자리로 입력해 주세요");
          return;
        }
        var patch = {};
        patch[k === "date" ? "installDate" : "installTime"] = inp.value || "";
        setPipe(id, patch);
        pushMemoUpdate(q, stageOf(q));
        var inst = installOf(q);
        toast(inst.date ? "설치 일정 " + inst.date + (inst.time ? " " + inst.time : "") + " 저장" : "설치 일정을 비웠습니다");
        render();
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-money-id]"), function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-money-id");
        var k = inp.getAttribute("data-money-k") === "deposit" ? "deposit" : "supply";
        var v = amountOf(inp.value);
        var patch = {}; patch[k] = v;
        setPipe(id, patch);
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        paintMoney(inp.closest(".qsheet"), moneyOf(q));
        /* 1000 미만 입력은 만 원 단위로 읽었다고 알려 준다 (예: 50 → 50만 원) */
        var hint = inp.parentNode.querySelector(".money-hint");
        if (hint){
          var rawNum = Number(String(inp.value).replace(/[^0-9.]/g, ""));
          hint.textContent = (v !== "" && rawNum > 0 && rawNum < 1000) ? ("→ " + won(v) + " (만 원 단위)") : "";
        }
      });
      inp.addEventListener("change", function(){
        var id = inp.getAttribute("data-money-id");
        var k = inp.getAttribute("data-money-k") === "deposit" ? "deposit" : "supply";
        var v = amountOf(inp.value);
        inp.value = v === "" ? "" : String(v);
        var patch = {}; patch[k] = v;
        setPipe(id, patch);
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        paintMoney(inp.closest(".qsheet"), moneyOf(q));
        var hint = inp.parentNode.querySelector(".money-hint");
        if (hint) hint.textContent = "";
        pushMemoUpdate(q, stageOf(q));
        toast("계약 금액을 저장했습니다");
      });
    });

    /* 결제 증빙 선택 — 다시 누르면 미정으로 돌린다 */
    Array.prototype.forEach.call(app.querySelectorAll("[data-pay-id]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-pay-id");
        var p = b.getAttribute("data-pay");
        var q = state.quotes.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!q) return;
        var next = payOf(q) === p ? "" : p;
        setPipe(id, { pay: next });
        Array.prototype.forEach.call(b.parentNode.querySelectorAll(".pay-chip"), function(x){
          x.classList.toggle("on", !!next && x === b);
        });
        pushMemoUpdate(q, stageOf(q));
        toast(next ? "결제 증빙을 ‘" + next + "’(으)로 저장했습니다" : "결제 증빙을 미정으로 비웠습니다");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qcontract]"), function(b){
      b.addEventListener("click", function(){
        var q = state.quotes.filter(function(x){ return String(x.id) === String(b.getAttribute("data-qcontract")); })[0];
        if (!q) return;
        copyText(contractText(q), "계약 안내 복사 완료!");
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-qcontractimg]"), function(b){
      b.addEventListener("click", function(){
        var q = state.quotes.filter(function(x){ return String(x.id) === String(b.getAttribute("data-qcontractimg")); })[0];
        if (!q) return;
        openContractModal(q);
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qcopy]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qcopy");
        var q = state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!q) return;
        copyText(formatCopyText(q), "요청서 요약 복사 완료!");
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-qdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-qdel");
        if (!confirm("이 상담요청서를 삭제할까요? 되돌릴 수 없습니다.")) return;
        b.disabled = true;
        rpc("relocation_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });

    bindLightbox();
  }

  function bindMarketEvents(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-mktab]"), function(b){
      b.addEventListener("click", function(){ state.mkTab = b.getAttribute("data-mktab"); render(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkid"), st = b.getAttribute("data-mkst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "status", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("매물 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mkdel]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-mkdel");
        if (!confirm("이 매물을 완전히 삭제할까요?")) return;
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "delete", p_payload: { id: id } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "삭제 실패");
            toast("삭제했습니다");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-inqst]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-inqid"), st = b.getAttribute("data-inqst");
        b.disabled = true;
        rpc("market_admin", { p_key: state.adminKey, p_action: "inquiry", p_payload: { id: id, status: st } })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || "변경 실패");
            toast("문의 상태 변경 완료");
            loadAll();
          }).catch(function(err){ alert(err.message); b.disabled = false; });
      });
    });
    bindLightbox();
  }

  function bindLightbox(){
    Array.prototype.forEach.call(app.querySelectorAll("[data-lb-id]"), function(b){
      b.addEventListener("click", function(){
        var type = b.getAttribute("data-lb-type");
        var id = b.getAttribute("data-lb-id");
        var idx = Number(b.getAttribute("data-lb-idx") || 0);
        var item = type === "market"
          ? state.market.listings.find(function(x){ return String(x.id) === String(id); })
          : state.quotes.find(function(x){ return String(x.id) === String(id); });
        if (!item || !Array.isArray(item.photos) || !item.photos.length) return;
        openLb(item.photos, idx);
      });
    });
  }

  function copyText(text, msg){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(msg || "복사 완료!"); })
        .catch(function(){ fallbackCopy(text, msg); });
    } else fallbackCopy(text, msg);
  }
  function fallbackCopy(text, msg){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg || "복사 완료!"); } catch (e) { alert("복사 실패"); }
    document.body.removeChild(ta);
  }

  var lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbCount = document.getElementById("lb-count");
  function openLb(photos, idx){
    state.lbPhotos = photos; state.lbIdx = Math.max(0, Math.min(idx, photos.length - 1));
    updateLb(); lb.hidden = false;
  }
  function updateLb(){
    lbImg.src = state.lbPhotos[state.lbIdx];
    lbCount.textContent = (state.lbIdx + 1) + " / " + state.lbPhotos.length;
  }
  document.getElementById("lb-prev").addEventListener("click", function(){ state.lbIdx = (state.lbIdx - 1 + state.lbPhotos.length) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-next").addEventListener("click", function(){ state.lbIdx = (state.lbIdx + 1) % state.lbPhotos.length; updateLb(); });
  document.getElementById("lb-close").addEventListener("click", function(){ lb.hidden = true; });
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.hidden = true; });
  document.getElementById("ct-close").addEventListener("click", function(){ document.getElementById("ct-modal").hidden = true; });
  document.getElementById("ct-modal").addEventListener("click", function(e){
    if (e.target === document.getElementById("ct-modal")) e.currentTarget.hidden = true;
  });

  Array.prototype.forEach.call(bottomNav.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ state.nav = b.getAttribute("data-nav"); state.qStatus = "all"; render(); window.scrollTo(0, 0); });
  });
  document.getElementById("btn-refresh").addEventListener("click", function(){ toast("새로고침 중…"); loadAll(); });
  document.getElementById("btn-logout").addEventListener("click", function(){ clearKey(); state.adminKey = ""; renderLogin(); });

  state.adminKey = loadSavedKey();
  if (!state.adminKey) renderLogin();
  else loadAll();
})();
</script>
