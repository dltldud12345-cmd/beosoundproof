<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베오방음 | 제작 도면 생성기 (CAD · 재단표)</title>
<meta name="description" content="외경 가로·세로·층고를 입력하면 베오방음 120mm 벽체 기준 CAD 스타일 제작 도면과 재단 치수표·자재 산출표를 자동으로 생성합니다. A4 인쇄 및 PNG 저장 지원.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171A'/%3E%3Cg fill='%232E9C86'%3E%3Crect x='15' y='26' width='6' height='12' rx='3'/%3E%3Crect x='29' y='17' width='6' height='30' rx='3'/%3E%3Crect x='43' y='23' width='6' height='18' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --ink:#14171A; --ink2:#2E353B; --body:#4F585F; --muted:#7B8389;
    --line:#E5DFD4; --line2:#EFEAE1; --paper:#FCFAF6; --cream:#F4F0E7;
    --accent:#2E9C86; --accent-d:#1F7A69; --accent-t:#E8F1EE;
    --dim:#2E6FA3; --warn:#B4622A;
    --r:14px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:#E9E5DC;color:var(--ink);overflow-x:hidden;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-width:0;
    padding:10px clamp(12px,2.4vw,26px);background:var(--ink);color:#fff;
    border-bottom:1px solid #000;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;min-width:0;overflow:hidden}
  .brand b{font-size:14px;letter-spacing:.14em}
  .brand span{font-size:11.5px;color:#9AA3A9;font-weight:500;letter-spacing:.02em}
  .logo{width:22px;height:22px;flex:none}
  .topbar .spacer{flex:1}
  .btn{
    appearance:none;border:1px solid #3A434A;background:#232A2F;color:#F2F5F4;
    font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    transition:.16s;
  }
  .btn:hover{background:#2E383E;border-color:#4A555C}
  .btn:active{transform:translateY(1px)}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#08221D}
  .btn.accent:hover{background:#37AF96;border-color:#37AF96}
  .btn.ghost{background:transparent}
  .btn.sm{font-size:11.5px;padding:6px 10px;border-radius:8px}
  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:334px minmax(0,1fr);gap:22px;padding:22px clamp(12px,2.4vw,26px) 60px;align-items:start;max-width:1560px;margin:0 auto}
  @media (max-width:1080px){
    .layout{grid-template-columns:1fr;gap:16px;padding-top:14px}
    .panel{position:static !important;max-height:none !important}
  }
  /* ---------- panel ---------- */
  .panel{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 88px);overflow:auto;padding-right:2px;scrollbar-width:thin}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;box-shadow:0 1px 2px rgba(20,23,26,.04)}
  .card h2{margin:0 0 12px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
  .card h2::after{content:"";flex:1;height:1px;background:var(--line2)}
  .field{margin-bottom:11px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px;letter-spacing:.01em}
  .field .hint{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;
    font:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:.15s;
    font-variant-numeric:tabular-nums;
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-t)}
  .seg{display:grid;grid-auto-flow:column;gap:5px;background:var(--cream);padding:4px;border-radius:10px}
  .seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--body);padding:7px 4px;border-radius:7px;cursor:pointer;transition:.14s}
  .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,23,26,.13)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{appearance:none;border:1px solid var(--line);background:#fff;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink2);padding:6px 9px;border-radius:8px;cursor:pointer;transition:.14s;font-variant-numeric:tabular-nums}
  .chip:hover{border-color:var(--accent);color:var(--accent-d);background:var(--accent-t)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .switch input{appearance:none;width:38px;height:21px;border-radius:99px;background:#D8D2C6;position:relative;cursor:pointer;transition:.18s;flex:none;margin:0}
  .switch input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(17px)}
  details.adv{border-top:1px solid var(--line2);margin-top:13px;padding-top:11px}
  details.adv summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;list-style:none;display:flex;align-items:center;gap:6px}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary::before{content:"＋";font-size:11px;color:var(--accent)}
  details.adv[open] summary::before{content:"−"}
  details.adv .inner{padding-top:11px}
  /* summary stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--cream);border-radius:10px;padding:9px 10px}
  .stat b{display:block;font-size:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
  .stat span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  /* verify */
  .verify{font-size:11.5px;color:var(--body);line-height:1.65}
  .verify .ok{color:#1B7A5F;font-weight:700}
  .verify .no{color:var(--warn);font-weight:700}
  .verify ul{margin:6px 0 0;padding-left:15px}
  .verify li{margin-bottom:3px}
  /* ---------- sheets ---------- */
  .sheets{display:flex;flex-direction:column;gap:20px;min-width:0}
  .sheet-wrap{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(20,23,26,.10),0 0 0 1px rgba(20,23,26,.05);overflow:hidden}
  .sheet-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#F7F4EE;border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .sheet-bar .spacer{flex:1}
  .sheet-bar .hint{display:none;color:#9AA4AC;font-weight:500}
  .sheet-bar .btn{color:#2E353B;border-color:#DED8CC;background:#fff}
  .sheet-bar .btn:hover{background:var(--accent-t);border-color:var(--accent);color:var(--accent-d)}
  .sheet-bar .tagno{font-variant-numeric:tabular-nums;color:var(--ink2);letter-spacing:.08em}
  .sheet svg{display:block;width:100%;height:auto;background:#fff}
  @media (max-width:640px){
    .sheet-bar .lbl{display:none}
  }
  .foot{max-width:1560px;margin:0 auto;padding:0 clamp(12px,2.4vw,26px) 40px;color:#6C6558;font-size:11.5px;line-height:1.7}
  .foot b{color:#3F3A31}

  @media (max-width:600px){
    .sheet{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .sheet svg{min-width:540px}
    .sheet-bar .hint{display:inline}
    .topbar{padding:8px 10px;gap:7px}
    .brand{gap:6px}
    .brand span{display:none}
    .brand b{font-size:11.5px;letter-spacing:.06em}
    .logo{width:19px;height:19px}
    .btn{font-size:11px;padding:7px 9px;border-radius:8px;gap:4px}
    .layout{padding:12px 10px 40px;gap:12px}
    .card{padding:13px 13px 15px}
    .foot{padding:0 12px 30px;font-size:11px}
    .sheet-bar{padding:6px 9px}
  }
  @media (max-width:400px){
    .btn{padding:6px 7px;font-size:10.5px}
  }
  /* ---------- print ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    .topbar,.panel,.foot,.sheet-bar{display:none !important}
    .layout{display:block;padding:0;gap:0;max-width:none}
    .sheets{display:block}
    .sheet-wrap{box-shadow:none;border-radius:0;margin:0;overflow:visible;break-after:page;page-break-after:always}
    .sheet-wrap:last-child{break-after:auto;page-break-after:auto}
    .sheet svg{width:210mm;height:297mm}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="#2E9C86"><rect x="15" y="26" width="6" height="12" rx="3"/><rect x="29" y="17" width="6" height="30" rx="3"/><rect x="43" y="23" width="6" height="18" rx="3"/></g></svg>
    <div><b>BEO SOUNDPROOF</b> <span>제작 도면 생성기</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnPrint" title="A4 인쇄 / PDF 저장">🖨️ PDF · 인쇄</button>
  <button class="btn accent" id="btnPngAll" title="4장 전체를 고해상도 PNG로 저장">📥 PNG 저장</button>
</header>

<div class="layout">
  <aside class="panel">
    <section class="card">
      <h2>도면 정보</h2>
      <div class="field"><label for="site">현장명</label><input type="text" id="site" placeholder="예) 파주 ○○학원 3층" autocomplete="off"></div>
      <div class="row2">
        <div class="field"><label for="date">시공일</label><input type="date" id="date"></div>
        <div class="field"><label for="dwgNo">도면 번호</label><input type="text" id="dwgNo" value="BP-01" autocomplete="off"></div>
      </div>
    </section>

    <section class="card">
      <h2>치수 입력</h2>
      <div class="row2">
        <div class="field"><label for="W">외경 가로 <span class="hint">mm</span></label><input type="number" id="W" value="1500" min="800" max="6000" step="10"></div>
        <div class="field"><label for="D">외경 세로 <span class="hint">mm</span></label><input type="number" id="D" value="1800" min="800" max="6000" step="10"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="H">층고 <span class="hint">mm</span></label><input type="number" id="H" value="2280" min="1900" max="3000" step="10"></div>
        <div class="field"><label for="doorW">문 폭 <span class="hint">mm</span></label><input type="number" id="doorW" value="702" min="600" max="1000" step="1"></div>
      </div>
      <div class="field"><label>프리셋</label>
        <div class="chips" id="presets">
          <button class="chip" data-w="1500" data-d="1800">1500×1800</button>
          <button class="chip" data-w="2000" data-d="2000">2000×2000</button>
          <button class="chip" data-w="1400" data-d="1800">1400×1800</button>
          <button class="chip" data-w="2000" data-d="2400">2000×2400</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>문 위치</h2>
      <div class="field"><label>설치 면</label>
        <div class="seg" id="doorSide">
          <button data-v="front" aria-pressed="true">앞면</button>
          <button data-v="back" aria-pressed="false">뒷면</button>
          <button data-v="left" aria-pressed="false">좌측</button>
          <button data-v="right" aria-pressed="false">우측</button>
        </div>
      </div>
      <div class="field"><label>수평 정렬</label>
        <div class="seg" id="doorAlign">
          <button data-v="left" aria-pressed="false">좌</button>
          <button data-v="center" aria-pressed="true">중앙</button>
          <button data-v="right" aria-pressed="false">우</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>시창</h2>
      <div class="switch" style="margin-bottom:11px"><span>시창 넣기</span><input type="checkbox" id="winOn"></div>
      <div id="winFields" style="display:none">
        <div class="row2">
          <div class="field"><label for="winCount">개수</label><input type="number" id="winCount" value="1" min="1" max="4" step="1"></div>
          <div class="field"><label for="winSide">면</label>
            <select id="winSide"><option value="front">앞면</option><option value="back">뒷면</option><option value="left">좌측</option><option value="right">우측</option></select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="winW">가로 <span class="hint">mm</span></label><input type="number" id="winW" value="400" min="200" max="1200" step="10"></div>
          <div class="field"><label for="winH">높이 <span class="hint">mm</span></label><input type="number" id="winH" value="800" min="200" max="1500" step="10"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>산출 요약</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card">
      <h2>박사장님 도면 대조</h2>
      <div class="verify" id="verify"></div>
    </section>

    <section class="card">
      <h2>고급 설정</h2>
      <details class="adv" open>
        <summary>계산 규칙 · 여유값</summary>
        <div class="inner">
          <div class="row2">
            <div class="field"><label for="mod">모듈 <span class="hint">mm</span></label><input type="number" id="mod" value="600" min="300" max="1200" step="10"></div>
            <div class="field"><label for="joint">조인트 여유 <span class="hint">mm</span></label><input type="number" id="joint" value="15" min="0" max="60" step="1"></div>
          </div>
          <div class="field"><label for="doorH">문 높이 <span class="hint">mm</span></label><input type="number" id="doorH" value="1800" min="1500" max="2100" step="10"></div>
          <div class="field"><label for="ceilDir">천장 결 방향</label>
            <select id="ceilDir"><option value="long">긴 변 방향</option><option value="short">짧은 변 방향</option></select>
          </div>
          <p style="margin:10px 0 0;font-size:10.5px;color:#7B8389;line-height:1.6">기본값은 제작팀 손도면 10장에서 확인한 값입니다. 현장에 따라 조정하세요.</p>
        </div>
      </details>
    </section>
  </aside>

  <main class="sheets" id="sheets"></main>
</div>

<p class="foot">
  <b>베오방음 제작 도면 생성기</b> · 입력값은 이 브라우저에만 저장되며 서버로 전송되지 않습니다. 도면은 제작 참고용으로, 최종 재단 전 현장 실측 확인을 권합니다.
</p>

<script>
(function(){
"use strict";

/* =====================================================================
   0. 기본 상수 · 유틸
   ===================================================================== */
const CFG = {
  PB: 95,          // 벽체 PB 두께
  CORNER: 110,     // 코너 합판 기둥
  FIN: 120,        // 완성 벽체 두께 (9T 아트보드 + 흡음 + 각재 + 95T PB + 알판)
  HEAD: 2000,      // 문 상단 레벨 (벽판 1000 × 2단)
  CEIL: 65,        // 천장재 두께
  MARU: 45,        // 마루
  FILL_W: 702      // 문 상단 채움판 폭 (문폭과 동일)
};
const $ = s => document.querySelector(s);
const n = v => (Math.round(v*10)/10).toString();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = v => (Math.round(v)||0).toLocaleString('ko-KR');
const sum = a => a.reduce((s,v)=>s+v,0);

/* =====================================================================
   1. 계산 엔진  — 손도면에서 확인한 규칙
   ===================================================================== */
function buildModel(inp){
  const W = +inp.W, D = +inp.D, H = +inp.H;
  const MOD = +inp.mod, JOINT = +inp.joint;
  const dw = +inp.doorW, dh = +inp.doorH;
  const doorSide = inp.doorSide, doorAlign = inp.doorAlign;
  const winCount = inp.winOn ? +inp.winCount : 0;
  const winSide = inp.winSide, winW = +inp.winW, winH = +inp.winH;
  const fillH = Math.max(60, CFG.HEAD - dh - 2);   // 문 상단 채움판 높이(198)

  /* --- 4면 정의 ------------------------------------------------------ */
  const sides = [
    {k:'front', name:'앞면', len:W, axis:'x'},
    {k:'right', name:'우측면', len:D, axis:'y'},
    {k:'back',  name:'뒷면', len:W, axis:'x'},
    {k:'left',  name:'좌측면', len:D, axis:'y'}
  ];
  const opp = {front:'back',back:'front',left:'right',right:'left'}[doorSide];
  const sideName = {front:'앞면',back:'뒷면',left:'좌측면',right:'우측면'};

  sides.forEach(s=>{
    /* 문 면은 좌우 벽 사이에 끼워지고(-95×2), 반대면은 코너 기둥 사이(-110×2),
       좌우 벽은 전 길이를 그대로 쓴다. (1500×1800·2000×2000 손도면 일치) */
    if(s.k===doorSide)      s.span = s.len - CFG.PB*2;
    else if(s.k===opp)      s.span = s.len - CFG.CORNER*2;
    else                    s.span = s.len;
    s.span = Math.max(300, s.span);
  });

  /* --- 면별 분할 (600 모듈 + 자투리) --------------------------------- */
  sides.forEach(s=>{
    const isDoor = s.k===doorSide;
    let avail = s.span - (isDoor ? dw : 0) - (isDoor ? 10 : 0); // 10 = 문 옆 현장 여유
    let cnt = Math.max(0, Math.floor(avail/MOD));
    let rest = avail - cnt*MOD;
    if(rest > 0 && rest < 40 && cnt > 0){ cnt -= 1; rest += MOD; }
    const pieces = [];
    for(let i=0;i<cnt;i++) pieces.push({w:MOD, kind:'mod'});
    if(rest >= 40) pieces.push({w:rest, kind:'resid'});
    if(isDoor) pieces.unshift({w:dw, kind:'door'});
    s.pieces = pieces;
    s.mods = cnt;
    s.resid = rest >= 40 ? rest : 0;

    s.winSlots = 0;
  });

  /* --- 시창 배치 : 문이 있는 면에서는 문을 피해, 없으면 반대 면으로 ----- */
  const startOf = sd => (sd.len - sd.span)/2;
  let winSideKey = winSide, winMoved = false;
  const winPositions = [];
  if(winCount > 0){
    const gapsOf = (sd) => {
      const lay = layoutPieces(sd, doorAlign);
      const st = startOf(sd);
      const gaps = [];
      let cur = st;
      lay.forEach(it=>{ if(it.kind==='door'){ if(it.at - cur > 40) gaps.push([cur, it.at]); cur = it.at + it.w; } });
      if(st + sd.span - cur > 40) gaps.push([cur, st + sd.span]);
      return gaps.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
    };
    const place = (sd, n) => {
      const gaps = gapsOf(sd).filter(g=> (g[1]-g[0]) >= winW + 40);
      const out = [];
      if(!gaps.length) return out;
      const st = startOf(sd);
      let i = 0;
      gaps.forEach(g=>{
        const room = g[1]-g[0];
        const slots = Math.max(1, Math.min(n - out.length, Math.floor(room/(winW+40))));
        for(let k=0;k<slots;k++){
          const c = g[0] + (room/slots)*(k+0.5);
          out.push({c: c - st, w: winW, h: winH});
        }
      });
      return out.slice(0, n);
    };
    let ws = sides.find(s=>s.k===winSide);
    let pos = place(ws, winCount);
    if(!pos.length){
      const alt = sides.find(s=>s.k===opp) || sides.find(s=>s.k!==winSide);
      pos = place(alt, winCount);
      ws = alt; winSideKey = alt.k; winMoved = true;
    }
    pos.forEach(p=>winPositions.push(p));
    const take = Math.min(winPositions.length, ws.mods || 0);
    if(take > 0){
      let removed = 0;
      ws.pieces = ws.pieces.filter(pc=>{
        if(pc.kind==='mod' && removed < take){ removed++; return false; }
        return true;
      });
      ws.mods -= removed;
    }
    ws.winSlots = winPositions.length;
  }
  const winSideObj = sides.find(s=>s.k===winSideKey);

  /* --- 바닥 2겹 (교차) ------------------------------------------------ */
  function strips(len){          // 폭 배열
    const a=[]; let r=len, k=0;
    while(r > 0 && k < 40){ const w = Math.min(MOD, r); a.push(w); r -= w; k++; }
    return a;
  }
  const f1 = strips(W).map(w=>({w, l:D}));   // 1층: 세로 결
  const f2 = strips(D).map(w=>({w, l:W}));   // 2층: 가로 결 (교차)

  /* --- 천장 65T ------------------------------------------------------- */
  const ceilAlongLong = inp.ceilDir !== 'short';
  const cLen  = ceilAlongLong ? Math.max(W,D) : Math.min(W,D);   // 재단 길이
  const cSpan = ceilAlongLong ? Math.min(W,D) : Math.max(W,D);   // 폭 합
  let cN = Math.floor(cSpan/MOD), cRest = cSpan - cN*MOD;
  const cWidths = [];
  if(cRest >= 120){ for(let i=0;i<cN;i++) cWidths.push(MOD); cWidths.push(cRest - JOINT*cN); }
  else { for(let i=0;i<Math.max(1,cN-1);i++) cWidths.push(MOD); cWidths.push(MOD - JOINT*Math.max(1,cN-1)); }
  const ceilPieces = cWidths.map(w=>({w, l:cLen}));

  /* --- 코너 · 외벽 알판 ---------------------------------------------- */
  const cornerPosts = 4;
  const extRows = [];
  sides.forEach(s=>{
    const label = sideName[s.k];
    if(s.k===doorSide){
      s.pieces.forEach(p=>{
        if(p.kind==='mod' || p.kind==='resid') extRows.push({w:p.w, l:H, qty:1, note:label+' 알판'});
      });
    } else {
      s.pieces.forEach(p=>{
        if(p.kind==='mod' || p.kind==='resid') extRows.push({w:p.w, l:H, qty:1, note:label+' 알판'});
      });
    }
  });

  /* --- 재단표 --------------------------------------------------------- */
  const cut = [];
  const add = (group,w,l,qty,note)=>cut.push({group,w,l,qty,note});

  /* 바닥 */
  const floorMerged = merge([...f1, ...f2]);
  floorMerged.forEach(p=>add('바닥 PB (2겹 교차)', p.w, p.l, p.qty,
      p.qty>1? '하판·상판 공통' : (p.l===D? '1층(세로 결)' : '2층(가로 결)')));
  /* 천장 */
  const ceilMerged = merge(ceilPieces);
  ceilMerged.forEach(p=>add('천장 65T', p.w, p.l, p.qty, '65T · 결 ' + (ceilAlongLong?'긴 변':'짧은 변')));
  /* 벽판 */
  const wallRows = [];
  sides.forEach(s=>{
    s.pieces.forEach(p=>{
      const note = sideName[s.k] + (p.kind==='mod'?' 모듈':(p.kind==='resid'?' 자투리':' 문 개구부'));
      if(p.kind!=='door') wallRows.push({w:p.w, l:1000, qty:2, note, group:'벽판 95T PB'});
    });
  });
  merge2(wallRows).forEach(p=>add('벽판 95T PB', p.w, p.l, p.qty, p.note));
  if(fillH > 40) add('문·개구부', dw, fillH, 1, '문 상단 채움판');
  if(winCount>0){
    add('문·개구부', winW, winH, winCount, '시창 개구부' + (winMoved? ' · '+sideName[winSideKey]+' 배치':''));
    const side = winW; const upDown = Math.max(20, Math.round((1000-winH)/2));
    add('문·개구부', winW, upDown, winCount*2, '시창 상·하 채움');
    if(MOD-winW > 40) add('문·개구부', MOD-winW, 1000, winCount, '시창 옆 채움');
  }
  /* 코너 110 */
  add('코너 110 합판', 110, 110, 4, '코너 기둥 · 높이 ' + H);
  /* 외벽 알판 */
  merge2(extRows.filter(r=>r.w>40)).forEach(p=>add('외벽 알판', p.w, p.l, p.qty, p.note));
  add('외벽 알판', 110, H, 4, '코너 마감 스트립');

  /* --- 자재 산출 ------------------------------------------------------ */
  const perimSpan = sum(sides.map(s=>s.span));
  const floorArea = (W*D)/1e6;
  const wallArea = (perimSpan*CFG.HEAD)/1e6;
  const extArea  = (sum(sides.map(s=>s.len))*H)/1e6;
  const innerW = Math.max(0, W-CFG.FIN*2), innerD = Math.max(0, D-CFG.FIN*2);
  const innerArea = (innerW*innerD)/1e6;
  const sheetArea = 1.22*2.44;
  const sheets = a => Math.ceil(a*1.12/sheetArea);
  const artArea = ((innerW+innerD)*2*CFG.HEAD + innerW*innerD)/1e6;
  const bom = [
    {mat:'PB 18T — 바닥 (2겹)', spec:'1220×2440', amount: n(floorArea*2), unit:'㎡', sheets: sheets(floorArea*2), note:'1층·2층 교차 재단'},
    {mat:'PB 18T — 벽판 5겹 (95T)', spec:'95T 적층', amount: n(wallArea), unit:'㎡', sheets: Math.ceil(wallArea*5*1.12/sheetArea), note:'18T × 5겹 = 95T'},
    {mat:'천장 65T', spec:'600 모듈', amount: n(sum(ceilPieces.map(p=>p.w*p.l))/1e6), unit:'㎡', sheets: null, note:'조인트 여유 '+JOINT+'㎜'},
    {mat:'합판 18T — 코너 110', spec:'110×110', amount: String(cornerPosts)+' 개', unit:'', sheets: 1, note:'4개 코너 기둥'},
    {mat:'백색 알판 — 외벽 마감', spec:'높이 '+H, amount: n(extArea), unit:'㎡', sheets: sheets(extArea), note:'외부 마감'},
    {mat:'9T 아트보드 — 내부 마감', spec:'3면 + 천장', amount: n(artArea), unit:'㎡', sheets: Math.ceil(artArea*1.12/sheetArea), note:'1면 라인타공'},
    {mat:'고밀도 흡음재', spec:'2겹', amount: n(wallArea*2), unit:'㎡', sheets: null, note:'PB 틀 안쪽 충진'},
    {mat:'강화마루', spec:'BOX(약 2.0㎡)', amount: n(innerArea)+' ㎡', unit:'', sheets: null, note: Math.ceil(innerArea/2.0)+' BOX'},
    {mat:'45T 몰딩', spec:'2.4m', amount: n((innerW+innerD)*2*2/1000), unit:'m', sheets: Math.ceil((innerW+innerD)*2*2/2400), note:'바닥+천장'},
    {mat:'시스템도어', spec: dw+'×'+dh, amount:'1 세트', unit:'', sheets: null, note:'상부 트랜섬 '+(fillH+2)},
    {mat:'시창', spec: winW+'×'+winH, amount: winCount? winCount+' 개':'—', unit:'', sheets: null, note: winCount? '아크릴 3T + 창틀':'미적용'}
  ];

  return {
    inp, W, D, H, MOD, JOINT, dw, dh, fillH, sides, opp, doorSide, doorAlign, sideName,
    winCount, winSide, winSideKey, winMoved, winW, winH, winPositions, winSideObj,
    floor:{l1:f1, l2:f2}, ceil:{pieces:ceilPieces, alongLong:ceilAlongLong, span:cSpan},
    cut, bom, perimSpan, floorArea, wallArea, extArea, innerW, innerD, innerArea,
    cornerPosts, extRows
  };
}

function merge(list){
  const map = new Map();
  list.forEach(p=>{
    const key = p.w+'x'+p.l;
    if(map.has(key)) map.get(key).qty++;
    else map.set(key, {w:p.w,l:p.l,qty:1});
  });
  return [...map.values()].sort((a,b)=> b.w-a.w || b.l-a.l);
}
function merge2(list){
  const map = new Map();
  list.forEach(p=>{
    const key = p.w+'x'+p.l;
    if(map.has(key)){
      const e = map.get(key); e.qty += (p.qty||1);
      if(p.note && !e.note.includes(p.note)) e.note = e.note? e.note+' · '+p.note : p.note;
    } else map.set(key, {w:p.w,l:p.l,qty:(p.qty||1),note:p.note||''});
  });
  return [...map.values()].sort((a,b)=> b.w-a.w || b.l-a.l);
}

/* =====================================================================
   2. SVG 헬퍼
   ===================================================================== */
const INK='#14171A', LINE='#2B3238', SOFT='#9AA4AC', DIMC='#2E6FA3',
      ACC='#2E9C86', WARN='#B4622A', PAPER='#FFFFFF', CREAM='#F4F0E7';

function A(o){
  return Object.entries(o).filter(([k,v])=>v!==undefined&&v!==null&&v!==''&&v!==false)
    .map(([k,v])=>`${k}="${v}"`).join(' ');
}
const R = (x,y,w,h,o={}) => `<rect x="${n(x)}" y="${n(y)}" width="${n(Math.max(0,w))}" height="${n(Math.max(0,h))}" ${A({fill:o.fill||'none',stroke:o.stroke===undefined?LINE:o.stroke,'stroke-width':o.sw===undefined?0.8:o.sw,'stroke-dasharray':o.dash,'stroke-linejoin':o.join,opacity:o.op,rx:o.rx})}/>`;
const L = (x1,y1,x2,y2,o={}) => `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" ${A({stroke:o.stroke||LINE,'stroke-width':o.sw===undefined?0.8:o.sw,'stroke-dasharray':o.dash,'stroke-linecap':o.cap||'butt',opacity:o.op})}/>`;
const P = (d,o={}) => `<path d="${d}" ${A({fill:o.fill||'none',stroke:o.stroke===undefined?LINE:o.stroke,'stroke-width':o.sw===undefined?0.8:o.sw,'stroke-dasharray':o.dash,'stroke-linecap':o.cap,'stroke-linejoin':o.join,opacity:o.op})}/>`;
const C = (cx,cy,r,o={}) => `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" ${A({fill:o.fill||'none',stroke:o.stroke===undefined?LINE:o.stroke,'stroke-width':o.sw===undefined?0.8:o.sw,'stroke-dasharray':o.dash})}/>`;
function T(x,y,s,o={}){
  const anchor = o.anchor||'start';
  const xx = anchor==='middle'? x : (anchor==='end'? x : x);
  return `<text x="${n(xx)}" y="${n(y)}" ${A({fill:o.fill||INK,'font-size':o.size||7,'font-weight':o.weight||400,
    'text-anchor':anchor,'font-family':o.mono?'ui-monospace,SFMono-Regular,Menlo,monospace':undefined,
    'letter-spacing':o.ls,transform:o.rotate?`rotate(${o.rotate} ${n(x)} ${n(y)})`:undefined,opacity:o.op})}>${esc(s)}</text>`;
}
/* 글자 폭 근사 (숫자·한글 혼용) */
function tagWidth(label,size){
  const em = [...String(label)].reduce((a,c)=>{
    if(/[\u3131-\uD7A3]/.test(c)) return a + 1.0;
    if(/[0-9]/.test(c)) return a + 0.62;
    return a + 0.40;
  },0);
  return em*size + size*0.72;
}
/* 라벨 필(pill) — 해치·경계선 위에서도 숫자가 또렷하게 */
function tag(cx,cy,label,o={}){
  const size = o.size||8, w = o.w || tagWidth(label,size), h = size*1.44;
  const rot = o.rot||0, bg = o.bg||PAPER, bgop = o.bgop!==undefined? o.bgop : 0.97;
  const st = o.stroke===undefined? 'none' : o.stroke, sw = o.sw!==undefined? o.sw : (o.stroke? 0.5 : 0);
  return `<g transform="rotate(${rot} ${n(cx)} ${n(cy)})">`
    + `<rect x="${n(cx-w/2)}" y="${n(cy-h/2)}" width="${n(w)}" height="${n(h)}" rx="${n(h/2)}" fill="${bg}" fill-opacity="${bgop}" stroke="${st}" stroke-width="${n(sw)}"/>`
    + T(cx, cy + size*0.35, label, {size, anchor:'middle', weight:o.weight||800, fill:o.fill||INK, mono:o.mono===undefined? true : o.mono})
    + `</g>`;
}
/* 치수선 (건축식 사선 틱) */
function dimH(x1,x2,y,label,o={}){
  const c = o.color||DIMC, sw = o.sw||0.7, t = o.size||7.2, ty = o.labelY!==undefined? o.labelY : y-3.4;
  let s = L(x1,y,x2,y,{stroke:c,sw});
  s += L(x1-2.2,y-2.2,x1+2.2,y+2.2,{stroke:c,sw}) + L(x2-2.2,y-2.2,x2+2.2,y+2.2,{stroke:c,sw});
  if(o.ext1) s += L(x1,o.ext1,x1,y,{stroke:c,sw,opacity:.55});
  if(o.ext2) s += L(x2,o.ext2,x2,y,{stroke:c,sw,opacity:.55});
  if(label!==undefined && label!=='') s += tag((x1+x2)/2, ty - t*0.36, label, {size:t, fill:c, weight:700, bg:PAPER, bgop:0.94});
  return s;
}
function dimV(y1,y2,x,label,o={}){
  const c = o.color||DIMC, sw=o.sw||0.7, t=o.size||7.2, tx = o.labelX!==undefined? o.labelX : x-3;
  let s = L(x,y1,x,y2,{stroke:c,sw});
  s += L(x-2.2,y1-2.2,x+2.2,y1+2.2,{stroke:c,sw}) + L(x-2.2,y2-2.2,x+2.2,y2+2.2,{stroke:c,sw});
  if(o.ext1) s += L(o.ext1,y1,x,y1,{stroke:c,sw,opacity:.55});
  if(o.ext2) s += L(o.ext2,y2,x,y2,{stroke:c,sw,opacity:.55});
  if(label!==undefined && label!=='') s += tag(tx,(y1+y2)/2, label, {size:t, fill:c, weight:700, bg:PAPER, bgop:0.94, rot:-90});
  return s;
}

/* =====================================================================
   4. A-101 평면도
   ===================================================================== */
function layoutPieces(sd, doorAlign){
  const nonDoor = sd.pieces.filter(p=>p.kind!=='door');
  const doorP = sd.pieces.find(p=>p.kind==='door');
  const off0 = (sd.len - sd.span)/2;
  const items = [];
  if(!doorP){
    let a = off0;
    nonDoor.forEach(p=>{ items.push({kind:p.kind,w:p.w,at:a}); a += p.w; });
    return items;
  }
  let before = 0;
  if(doorAlign==='center') before = Math.ceil(nonDoor.length/2);
  else if(doorAlign==='right') before = nonDoor.length;
  let a = off0;
  nonDoor.slice(0,before).forEach(p=>{ items.push({kind:p.kind,w:p.w,at:a}); a += p.w; });
  items.push({kind:'door', w:doorP.w, at:a});
  a += doorP.w;
  nonDoor.slice(before).forEach(p=>{ items.push({kind:p.kind,w:p.w,at:a}); a += p.w; });
  return items;
}

function sheetPlan(m){
  let s = sheetHead('A-101','벽체 평면도','PLAN · 외경 '+m.W+' × '+m.D+' · 벽체 120㎜ (95T PB 5겹 + 마감) · 코너 110 합판 기둥');
  s += pageNo('A-101',1,4);

  const regionX = M+104, regionW = SW-M-40-regionX;
  const regionY = M+92,  regionH = 700;
  const sc = Math.min(regionW/m.W, regionH/m.D)*0.92;
  const pw = m.W*sc, ph = m.D*sc;
  const ox = regionX + (regionW-pw)/2;
  const oy = regionY + (regionH-ph)/2;
  const t = CFG.FIN*sc, cw = CFG.CORNER*sc;

  /* 벽체 밴드 — 외곽선·내부면을 굵은 실선으로 */
  const EDGE = '#14171A';
  s += R(ox,oy,pw,ph,{fill:'url(#hWall)',stroke:EDGE,sw:2.4});
  s += R(ox+t,oy+t,pw-2*t,ph-2*t,{fill:'#fff',stroke:EDGE,sw:2.0});
  s += R(ox+9*sc,oy+9*sc,pw-18*sc,ph-18*sc,{fill:'none',stroke:'#CBD1D5',sw:0.5,dash:'3 1.8'});

  /* 코너 110 기둥 — 채움 대비 + 굵은 경계 (밴드 위에 올려 분할선을 정리) */
  const drawCorners = () => {
    let out = '';
    [[ox,oy],[ox+pw-cw,oy],[ox,oy+ph-cw],[ox+pw-cw,oy+ph-cw]].forEach(([cx,cy])=>{
      out += R(cx,cy,cw,cw,{fill:'#F7E3D2',stroke:'none'});
      out += R(cx,cy,cw,cw,{fill:'url(#hCorner)',stroke:'#7A3B12',sw:2.2});
      const csz = Math.min(cw*0.30, 8.6);
      out += tag(cx+cw/2, cy+cw/2, '110', {size:csz, fill:'#7A3B12', weight:800, bg:'#FFF9F3', bgop:0.94});
    });
    return out;
  };

  /* 면 분할 계산 */
  const sideGeom = (sd) => layoutPieces(sd, m.doorAlign);

  const drawBand = (kind, sd) => {
    const items = sideGeom(sd);
    const isH = (kind==='top'||kind==='bottom');
    let out = '';
    items.forEach(it=>{
      const a1 = it.at*sc, a2 = (it.at+it.w)*sc;
      let rx,ry,rw,rh;
      if(kind==='bottom'){ rx=ox+a1; ry=oy+ph-t; rw=a2-a1; rh=t; }
      else if(kind==='top'){ rx=ox+a1; ry=oy; rw=a2-a1; rh=t; }
      else if(kind==='left'){ rx=ox; ry=oy+a1; rw=t; rh=a2-a1; }
      else { rx=ox+pw-t; ry=oy+a1; rw=t; rh=a2-a1; }

      if(it.kind==='door'){
        out += R(rx,ry,rw,rh,{fill:'#FFFDF7',stroke:'none'});
        out += L(rx,ry,rx,ry+rh,{stroke:EDGE,sw:2.5});
        out += L(rx+rw,ry,rx+rw,ry+rh,{stroke:EDGE,sw:2.5});
        const lbl = '문 '+Math.round(it.w);
        const size = Math.min(t*0.34, (isH?rw:rh)*0.30, 12.5);
        out += isH ? tag(rx+rw/2, ry+rh/2, lbl, {size, fill:'#8A4210', weight:800, mono:false})
                   : tag(rx+rw/2, ry+rh/2, lbl, {size, fill:'#8A4210', weight:800, mono:false, rot:-90});
        return;
      }
      // 분할 경계선 — 굵은 진한 실선
      if(isH) out += L(rx,ry,rx,ry+rh,{stroke:EDGE,sw:2.1});
      else    out += L(rx,ry,rx+rw,ry,{stroke:EDGE,sw:2.1});
      // 폭 라벨 — 밴드 두께·패널 폭에 맞춰 최대한 크게 (코너 기둥 안은 피해서)
      const span = isH? rw : rh;
      const size = Math.min(t*0.36, span*0.34, 13);
      const lbl = String(Math.round(it.w));
      const half = tagWidth(lbl, size)/2;
      const along = isH? (rx+rw/2) : (ry+rh/2);
      const lo = (isH? ox : oy) + cw + half + 1.2;
      const hi = (isH? ox+pw : oy+ph) - cw - half - 1.2;
      const pos = Math.min(Math.max(along, lo), hi);
      const ok = pos-half >= (isH? ox : oy) + 0.5 && pos+half <= (isH? ox+pw : oy+ph) - 0.5
                 && Math.abs(pos-along) <= span*0.9;
      const cx = isH? pos : rx+rw/2, cy = isH? ry+rh/2 : pos;
      if(ok){
        if(isH) out += tag(cx, cy, lbl, {size, fill:'#101619'});
        else out += tag(cx, cy, lbl, {size, fill:'#101619', rot:-90});
      }
    });
    return out;
  };

  const S = k => m.sides.find(x=>x.k===k);
  s += drawBand('top', S('back')) + drawBand('bottom', S('front')) + drawBand('left', S('left')) + drawBand('right', S('right'));
  s += drawCorners();

  /* 시창 */
  if(m.winCount>0 && m.winSideObj){
    const ws = m.winSideObj;
    const isH = (m.winSideKey==='front'||m.winSideKey==='back');
    const off0 = (ws.len - ws.span)/2;
    m.winPositions.forEach(wp=>{
      const c = (off0 + wp.c)*sc, half = wp.w*sc/2;
      if(isH){
        const y = (m.winSideKey==='front')? oy+ph-t : oy;
        s += R(ox+c-half, y, wp.w*sc, t, {fill:'#fff',stroke:'none'});
        s += R(ox+c-half, y, wp.w*sc, t, {fill:'url(#hGlass)',stroke:DIMC,sw:0.9});
        s += L(ox+c-half, y+t/2, ox+c+half, y+t/2, {stroke:DIMC,sw:1.2});
        s += L(ox+c-half, y, ox+c-half, y+t, {stroke:DIMC,sw:1.1});
        s += L(ox+c+half, y, ox+c+half, y+t, {stroke:DIMC,sw:1.1});
        s += tag(ox+c, y-8, '시창 '+wp.w+'×'+wp.h, {size:7.4, fill:DIMC, weight:700, mono:false});
      } else {
        const x = (m.winSideKey==='left')? ox : ox+pw-t;
        s += R(x, oy+c-half, t, wp.w*sc, {fill:'url(#hGlass)',stroke:DIMC,sw:0.9});
        s += L(x, oy+c-half, x+t, oy+c-half, {stroke:DIMC,sw:1.1});
        s += L(x, oy+c+half, x+t, oy+c+half, {stroke:DIMC,sw:1.1});
        s += `<g transform="rotate(-90 ${n(x+t/2)} ${n(oy+c)})">${T(x+t/2, oy+c+1.8, '시창 '+wp.w+'×'+wp.h,{size:7.2,fill:DIMC,anchor:'middle',mono:true})}</g>`;
      }
    });
  }

  /* 문 여닫이 */
  {
    const sd = S(m.doorSide);
    const items = sideGeom(sd);
    const d = items.find(i=>i.kind==='door');
    if(d){
      const a1 = d.at*sc, a2 = (d.at+d.w)*sc, R0 = d.w*sc;
      if(m.doorSide==='front'){
        const hx = ox+a2, hy = oy+ph-t;
        s += L(hx,hy,hx,hy-R0,{stroke:INK,sw:1.6});
        s += P(`M ${n(hx-R0)} ${n(hy)} A ${n(R0)} ${n(R0)} 0 0 1 ${n(hx)} ${n(hy-R0)}`,{stroke:'#6B7378',sw:0.7,dash:'4 2.5'});
        s += T(hx-R0/2, hy-R0/2, m.dw, {size:9.2,mono:true,anchor:'middle',fill:'#3E474D',weight:700});
      } else if(m.doorSide==='back'){
        const hx = ox+a1, hy = oy+t;
        s += L(hx,hy,hx,hy+R0,{stroke:INK,sw:1.6});
        s += P(`M ${n(hx+R0)} ${n(hy)} A ${n(R0)} ${n(R0)} 0 0 0 ${n(hx)} ${n(hy+R0)}`,{stroke:'#6B7378',sw:0.7,dash:'4 2.5'});
        s += T(hx+R0/2, hy+R0/2, m.dw, {size:9.2,mono:true,anchor:'middle',fill:'#3E474D',weight:700});
      } else if(m.doorSide==='left'){
        const hx = ox+t, hy = oy+a1;
        s += L(hx,hy,hx+R0,hy,{stroke:INK,sw:1.6});
        s += P(`M ${n(hx)} ${n(hy+R0)} A ${n(R0)} ${n(R0)} 0 0 0 ${n(hx+R0)} ${n(hy)}`,{stroke:'#6B7378',sw:0.7,dash:'4 2.5'});
        s += `<g transform="rotate(-90 ${n(hx+R0/2)} ${n(hy+R0/2)})">${T(hx+R0/2, hy+R0/2+2, m.dw,{size:9.2,mono:true,anchor:'middle',fill:'#3E474D',weight:700})}</g>`;
      } else {
        const hx = ox+pw-t, hy = oy+a2;
        s += L(hx,hy,hx-R0,hy,{stroke:INK,sw:1.6});
        s += P(`M ${n(hx)} ${n(hy-R0)} A ${n(R0)} ${n(R0)} 0 0 1 ${n(hx-R0)} ${n(hy)}`,{stroke:'#6B7378',sw:0.7,dash:'4 2.5'});
        s += `<g transform="rotate(-90 ${n(hx-R0/2)} ${n(hy-R0/2)})">${T(hx-R0/2, hy-R0/2+2, m.dw,{size:9.2,mono:true,anchor:'middle',fill:'#3E474D',weight:700})}</g>`;
      }
    }
  }

  /* 내부 유효 표기 */
  s += T(ox+pw/2, oy+ph/2-3, m.innerW+' × '+m.innerD, {size:13, weight:800, anchor:'middle', fill:'#DAD4C6', ls:'0.02em'});
  s += T(ox+pw/2, oy+ph/2+11, '내부 유효 (㎜)', {size:6.2, anchor:'middle', fill:'#DAD4C6', ls:'0.12em'});

  /* 치수 */
  s += dimH(ox, ox+pw, oy+ph+26, m.W, {ext1:oy+ph, ext2:oy+ph, size:10.2, labelY:oy+ph+22.4});
  s += dimV(oy, oy+ph, ox-38, m.D, {ext1:ox, ext2:ox, size:10.4, labelX:ox-42});
  s += dimH(ox+t, ox+pw-t, oy+ph+50, (m.W-CFG.FIN*2), {size:8.8});
  s += dimV(oy+t, oy+ph-t, ox-74, (m.D-CFG.FIN*2), {size:9, labelX:ox-78});
  s += dimH(ox, ox+t, oy-21, '120', {size:8.2, labelY:oy-24.5});
  s += dimH(ox, ox+cw, oy+ph+74, '110', {size:8.2});

  /* 범례 */
  const ly = 872, lw = SW-2*M-24;
  s += R(M+12, ly, lw, 78, {fill:'#FBFAF7', stroke:'#DDD6C8', sw:0.8});
  s += T(M+20, ly+14, '범례 · LEGEND', {size:6, weight:800, fill:SOFT, ls:'0.12em'});
  const items = [
    ['hWall','120㎜ 벽체 · 95T PB 5겹 + 마감'],
    ['hCorner','110 코너 합판 기둥 (4개소)'],
    ['hGlass','시창 400×800 아크릴 3T']
  ];
  items.forEach((it,i)=>{
    const yy = ly+26+i*16;
    s += R(M+20, yy, 18, 10, {fill:'url(#'+it[0]+')', stroke: it[0]==='hCorner'?WARN:(it[0]==='hGlass'?DIMC:LINE), sw:0.7});
    s += T(M+44, yy+7.6, it[1], {size:6.6});
  });
  s += T(M+300, ly+14, 'NOTE', {size:6, weight:800, fill:SOFT, ls:'0.12em'});
  const notes = [
    '1. 모든 치수는 ㎜, 외경 기준. 벽체는 120㎜ 완성 두께.',
    '2. 벽판 95T PB는 600 모듈 + 자투리, 1000 2단(총 2000) 시공.',
    '3. 문 면은 좌우 벽 사이(내폭 −190), 반대 면은 코너 기둥 사이(−220).',
    '4. 문 개구부 '+m.dw+' × '+m.dh+' + 상단 채움판 '+m.dw+' × '+m.fillH+' (문 상단 2000).'
  ];
  notes.forEach((tx,i)=> s += T(M+300, ly+28+i*12.6, tx, {size:6.4, fill:'#4F585F'}));

  s += titleBlock(m,{no:'A-101',title:'평면도',scale:'1 : '+Math.round(3.7795/sc)});
  s += scaleBar(M+24, 972, sc);
  return sheetShell(s);
}

function scaleBar(x,y,sc){
  // 1m 기준
  const L0 = 1000*sc;
  let s = '';
  const seg = L0/4;
  for(let i=0;i<4;i++){
    s += R(x+i*seg, y, seg, 3.2, {fill: i%2? '#fff':'#3B4248', stroke:'#3B4248', sw:0.4});
  }
  s += T(x, y-3, '0', {size:5, anchor:'middle', mono:true});
  s += T(x+L0, y-3, '1m', {size:5, anchor:'middle', mono:true});
  return s;
}

/* =====================================================================
   5. A-102 바닥 2겹 · 천장 분할
   ===================================================================== */
function breakdown(W,D,pieces,orient,{x,y,w,h,title,sub,hatch}){
  // orient: 'v' → 폭은 x방향, 길이는 y
  const sc = Math.min(w/(W+60), h/(D+70));
  const pw=W*sc, ph=D*sc;
  const ox=x+(w-pw)/2, oy=y+18;
  let s = T(x+2,y+8,title,{size:8.6,weight:800});
  s += T(x+2,y+17,sub,{size:6,fill:'#7B8389'});
  s += R(ox,oy,pw,ph,{fill:hatch||'#fff',stroke:INK,sw:1.2});
  // 분할선
  let acc=0;
  pieces.forEach((p,i)=>{
    const across = (orient==='v') ? p.w : p.w;      // 폭
    const len = (orient==='v') ? p.l : p.l;
    let a1,a2,rect;
    if(orient==='v'){ a1=ox+acc*sc; a2=ox+(acc+p.w)*sc; acc+=p.w;
      rect=[a1,oy,a2-a1,ph]; }
    else { a1=oy+acc*sc; a2=oy+(acc+p.w)*sc; acc+=p.w;
      rect=[ox,a1,pw,a2-a1]; }
    s += R(rect[0],rect[1],rect[2],rect[3],{fill:'none',stroke:INK,sw:0.55});
    // 라벨
    const cx = rect[0]+rect[2]/2, cy = rect[1]+rect[3]/2;
    const label = p.w+'×'+p.l;
    if(orient==='v'){
      const rot = (rect[2] < 26);
      if(rot) s += `<g transform="rotate(-90 ${n(cx)} ${n(cy)})">${T(cx,cy+1.8,label,{size:5.4,anchor:'middle',mono:true,fill:'#3B4248'})}</g>`;
      else s += T(cx, cy+1.8, label, {size:5.4, anchor:'middle', mono:true, fill:'#3B4248'});
    } else {
      const rot = (rect[3] < 26);
      if(rot) s += `<g transform="rotate(-90 ${n(cx)} ${n(cy)})">${T(cx,cy+1.8,label,{size:5.4,anchor:'middle',mono:true,fill:'#3B4248'})}</g>`;
      else s += T(cx, cy+1.8, label, {size:5.4, anchor:'middle', mono:true, fill:'#3B4248'});
    }
  });
  // 치수
  s += dimH(ox,ox+pw,oy+ph+13,W+'',{size:6.2,ext1:oy+ph});
  s += dimV(oy,oy+ph,ox-13,D+'',{size:6.2,ext1:ox});
  return s;
}

function sheetFloorCeil(m){
  let s = sheetHead('A-102','바닥 2겹 · 천장 65T 분할도','FLOOR 2 LAYERS (CROSS) & CEILING 65T · 600 모듈 기준');
  s += pageNo('A-102',2,4);
  const boxW = (SW-2*M-30)/2;

  s += breakdown(m.W, m.D, m.floor.l1, 'v', {x:M+8, y:M+80, w:boxW, h:210, title:'바닥 1층 (하판)', sub:'세로 결 · 폭 '+m.MOD+' 모듈', hatch:'#fff'});
  s += breakdown(m.W, m.D, m.floor.l2, 'h', {x:M+8+boxW+14, y:M+80, w:boxW, h:210, title:'바닥 2층 (상판)', sub:'가로 결 · 1층과 교차', hatch:'#FBF8F2'});

  // 천장
  s += breakdown(m.W, m.D, m.ceil.pieces, 'v', {x:M+8, y:M+330, w:boxW, h:230, title:'천장 65T 분할', sub:'결 '+(m.ceil.alongLong?'긴 변':'짧은 변')+' · 마지막 판 조인트 여유 −'+m.JOINT+'/개소', hatch:'url(#hCeil)'});

  // 요약 표 (분할 수량)
  const rows = [];
  rows.push({type:'group', label:'바닥 PB 18T · 2겹 교차'});
  merge([...m.floor.l1, ...m.floor.l2]).forEach(p=>rows.push({cells:['PB 18T', p.w+'×'+p.l, p.qty+' 장','600 모듈 교차']}));
  rows.push({type:'group', label:'천장 65T'});
  merge(m.ceil.pieces).forEach(p=>rows.push({cells:['65T', p.w+'×'+p.l, p.qty+' 장','조인트 여유 '+m.JOINT]}));

  s += svgTable(M+8+boxW+14, M+330, boxW, [
      {label:'부위', w:1.05},{label:'규격 (㎜)', w:1.5},{label:'수량', w:.8},{label:'비고', w:1.2}
    ], rows, {rowH:13, fs:6.6}).svg;

  // 계산 근거 박스
  const ny = M+590;
  s += R(M+8, ny, SW-2*M-16, 88, {fill:'#FBFAF7', stroke:'#DDD6C8', sw:0.8});
  s += T(M+16, ny+14, '산출 근거 (CALCULATION)', {size:6, weight:800, fill:SOFT, ls:'0.1em'});
  s += T(M+16, ny+28, '· 바닥 1층 : 가로 '+m.W+' ÷ 600 → '+m.floor.l1.map(p=>p.w).join(' + ')+'  (세로 길이 '+m.D+' 재단)', {size:6.4});
  s += T(M+16, ny+39, '· 바닥 2층 : 세로 '+m.D+' ÷ 600 → '+m.floor.l2.map(p=>p.w).join(' + ')+'  (가로 길이 '+m.W+' 재단) — 1층과 90° 교차', {size:6.4});
  s += T(M+16, ny+50, '· 천장 65T : 폭 '+m.ceil.span+' ÷ 600 → '+m.ceil.pieces.map(p=>p.w).join(' + ')+'  (길이 '+m.ceil.pieces[0].l+' 재단)', {size:6.4});
  s += T(M+16, ny+61, '· 마지막 판 = 자투리 − 조인트 '+m.JOINT+'㎜ × 개소 (손도면 확인 : 2000→155 · 1400→170 · 1800→570)', {size:6.4});
  s += T(M+16, ny+72, '· 자투리가 40㎜ 미만이면 앞 판에 합쳐 재단 (예: 1600 → 1000 + 600)', {size:6.4});
  s += T(M+16, ny+83, '· 시공 순서 : 바닥 1층 깔기 → 2층 교차 → 벽체 → 천장 65T', {size:6.4, fill:'#7B8389'});

  s += titleBlock(m,{no:'A-102',title:'바닥·천장 분할도',scale:'N.T.S'});
  return sheetShell(s);
}

/* =====================================================================
   6. A-103 벽체 전개도 · 단면
   ===================================================================== */
function sheetElevation(m){
  let s = sheetHead('A-103','벽체 전개도 · 벽체 단면','ELEVATION (UNFOLDED) · 벽판 95T PB 1000 2단 · 문 상단 '+m.fillH+' 채움판');
  s += pageNo('A-103',3,4);
  const EDGE_E = '#14171A';

  /* ---------- 벽면 1개 그리기 ---------- */
  const drawWall = (side, x, y, sc, opts={}) => {
    const H = m.H, hh = H*sc, sw = side.span*sc;
    let o = '';
    o += R(x,y,sw,hh,{fill:'#fff',stroke:INK,sw:2.3});
    // 상단 밴드 / 문 상단 / 1000 2단
    const yHead = y + hh - CFG.HEAD*sc;
    o += L(x, yHead, x+sw, yHead, {stroke:'#6E7A82', sw:1.2, dash:'6 2.6'});
    o += L(x, y+hh-1000*sc, x+sw, y+hh-1000*sc, {stroke:'#8A939A', sw:1.1, dash:'5 2.2'});
    // 천장 65 라인
    o += R(x, y, sw, CFG.CEIL*sc, {fill:'#F1EDE4', stroke:'none'});
    o += L(x, y+CFG.CEIL*sc, x+sw, y+CFG.CEIL*sc, {stroke:'#8A9390', sw:0.9});
    // 모듈 분할선 — 굵은 진한 실선 (실제 패널 배치 순서)
    const off0w = (side.len - side.span)/2;
    const layout = layoutPieces(side, m.doorAlign);
    layout.forEach((it,i)=>{
      const a = (it.at - off0w)*sc;
      if(i>0) o += L(x+a, y, x+a, y+hh, {stroke:EDGE_E, sw:2.0});
    });
    // 코너 기둥
    o += R(x, y, CFG.CORNER*sc, hh, {fill:'#F7E3D2', stroke:'none'});
    o += R(x, y, CFG.CORNER*sc, hh, {fill:'url(#hCorner)', stroke:'#7A3B12', sw:1.8});
    o += R(x+sw-CFG.CORNER*sc, y, CFG.CORNER*sc, hh, {fill:'#F7E3D2', stroke:'none'});
    o += R(x+sw-CFG.CORNER*sc, y, CFG.CORNER*sc, hh, {fill:'url(#hCorner)', stroke:'#7A3B12', sw:1.8});
    // 문
    const doorP = side.pieces.find(p=>p.kind==='door');
    if(doorP){
      const di = layout.find(i=>i.kind==='door');
      const off = di.at - off0w;
      const dx = x+off*sc, dwp = doorP.w*sc, dhp = m.dh*sc, fhp = m.fillH*sc;
      o += R(dx, y+hh-dhp, dwp, dhp, {fill:'#F7F4ED', stroke:'#8A4210', sw:2.0});
      o += R(dx, y+hh-dhp-fhp, dwp, fhp, {fill:'#FBEFE4', stroke:'#8A4210', sw:1.6});
      o += T(dx+dwp/2, y+hh-dhp/2-2, '방음문 '+(m.dw)+'×'+(m.dh), {size: opts.big?7.4:5.6, anchor:'middle', fill:'#8A4210', weight:800});
      o += T(dx+dwp/2, y+hh-dhp/2+7, '시스템도어', {size: opts.big?6:4.6, anchor:'middle', fill:'#B4622A'});
      o += T(dx+dwp/2, y+hh-dhp-fhp/2+2, m.dw+'×'+m.fillH, {size: opts.big?6:4.6, anchor:'middle', fill:'#8A4210', mono:true, weight:700});
      // 손잡이
      o += C(dx+dwp-10*sc*3, y+hh-dhp*0.45, Math.max(1.2, 2*sc*3), {fill:INK, stroke:INK, sw:0.4});
    }
    // 시창
    if(m.winCount>0 && side.k===m.winSideKey){
      m.winPositions.forEach(wp=>{
        const cx = x + wp.c*sc, ww = wp.w*sc, wh = wp.h*sc;
        const wy = y + hh - CFG.HEAD*sc + (1000*sc - wh)/2;
        o += R(cx-ww/2, wy, ww, wh, {fill:'url(#hGlass)', stroke:DIMC, sw:1.2});
        o += T(cx, wy-3.2, wp.w+'×'+wp.h, {size: opts.big?6:4.8, anchor:'middle', fill:DIMC, mono:true, weight:700});
      });
    }
    // 패널 폭 라벨 — 하단 안쪽에 크게
    {
      layout.forEach(it=>{
        const a = (it.at - off0w)*sc, wpx = it.w*sc;
        if(it.kind!=='door' && wpx >= 22 && a >= -0.5 && a+wpx <= sw+0.5){
          const size = Math.min(wpx*0.30, hh*0.045, 9.8);
          o += tag(x+a+wpx/2, y+hh-size*1.75, String(Math.round(it.w)), {size, fill:'#101619'});
        }
      });
    }
    if(opts.labels!==false){
      const modN = side.pieces.filter(p=>p.kind==='mod').length;
      const residN = side.pieces.filter(p=>p.kind==='resid').map(p=>Math.round(p.w));
      const parts = [];
      if(doorP) parts.push(Math.round(doorP.w)+' 문');
      if(modN===1) parts.push('600');
    else if(modN>1) parts.push(modN+'×600');
      residN.forEach(r=>parts.push(String(r)));
      o += dimH(x, x+sw, y+hh+19, side.span, {size:9.4, labelY:y+hh+15});
      o += T(x+sw/2, y+hh+30, m.sideName[side.k], {size:9.6, anchor:'middle', weight:800});
      o += T(x+sw/2, y+hh+41, parts.join(' + '), {size:8.4, anchor:'middle', fill:'#4F585F', mono:true, weight:600});
    }
    return o;
  };

  /* ---------- 4면 전개 ---------- */
  const totalSpan = sum(m.sides.map(x=>x.span));
  const availW = SW-2*M-40, availH = 286;
  const sc = Math.min(availW/(totalSpan+54), availH/(m.H+70));
  const gap = 12;
  let x = M+20, y = M+96;
  const order = ['front','right','back','left'];
  order.forEach(k=>{
    const side = m.sides.find(v=>v.k==k);
    s += drawWall(side, x, y, sc);
    x += side.span*sc + gap;
  });
  s += dimV(y, y+m.H*sc, M+10, m.H, {size:9.2});
  s += T(M+20, y-8, '전개도 — 외부에서 본 4면 (좌→우 : 앞 · 우 · 뒤 · 좌)', {size:6.4, fill:'#7B8389'});
  s += T(M+20, y-16, '축척 약 1 : '+Math.round(3.7795/sc), {size:5.8, fill:SOFT});

  /* ---------- 벽체 단면 (수평) ---------- */
  const sy = y + m.H*sc + 62;
  s += T(M+20, sy, '벽체 단면 · 완성 120㎜ (외부 → 내부)', {size:8.4, weight:800});
  s += T(M+20, sy+10, 'PB 95T 5겹(18T×5) + 9T 알판(외부) + 9T 아트보드(내부)', {size:6, fill:'#7B8389'});

  const layers = [
    {t:9,  name:'9T 알판',        fill:'#FBF6EC', hatch:''},
    {t:95, name:'95T PB 5겹',     fill:'url(#hWall)', hatch:''},
    {t:9,  name:'9T 아트보드',    fill:'#EDE7DC'},
    {t:7,  name:'여유',           fill:'#F3E3D6'}
  ];
  const sx0 = M+54, sy0 = sy+30, pxPerMm = 3.15, sech = 148;
  let ax = sx0;
  layers.forEach(l=>{
    const wpx = l.t*pxPerMm;
    s += R(ax, sy0, wpx, sech, {fill:l.fill, stroke:INK, sw:0.7});
    if(wpx > 62){
      s += T(ax+wpx/2, sy0+sech/2+2.4, l.name, {size:6.2, anchor:'middle', fill:'#3B4248'});
    } else {
      s += `<g transform="rotate(-90 ${n(ax+wpx/2)} ${n(sy0+sech/2)})">${T(ax+wpx/2, sy0+sech/2+2, l.name, {size:5.2, anchor:'middle', fill:'#3B4248'})}</g>`;
    }
    s += T(ax+wpx/2, sy0+sech+11, l.t, {size:5.6, anchor:'middle', mono:true, fill:DIMC});
    ax += wpx;
  });
  s += dimH(sx0, sx0+120*pxPerMm, sy0+sech+24, '120', {size:8.4});
  s += T(sx0-6, sy0+sech/2, '외부', {size:6, anchor:'end', fill:SOFT});
  s += T(sx0+120*pxPerMm+8, sy0+sech/2, '내부', {size:6, fill:SOFT});
  s += T(sx0, sy0-6, '고밀도 흡음재 2겹은 PB 틀 안쪽에 충진', {size:5.6, fill:'#7B8389'});

  /* ---------- 문 면 상세 입면 ---------- */
  const dside = m.sides.find(v=>v.k===m.doorSide);
  const dsc = Math.min(268/(dside.span), 404/(m.H));
  const ddx = 508, ddy = sy+26;
  s += T(ddx, sy, '문 면 상세 입면 (1 : '+Math.round(3.7795/dsc)+')', {size:8.4, weight:800});
  s += drawWall(dside, ddx, ddy, dsc, {big:true, labels:false});
  s += dimH(ddx, ddx+dside.span*dsc, ddy+m.H*dsc+15, dside.span, {size:8.8});
  s += dimV(ddy, ddy+m.H*dsc, ddx-13, m.H, {size:8.8, labelX:ddx-16});
  // 주요 레벨
  s += dimV(ddy+m.H*dsc-m.dh*dsc, ddy+m.H*dsc, ddx+dside.span*dsc+18, m.dh, {size:7.8});
  s += dimV(ddy+m.H*dsc-m.dh*dsc-m.fillH*dsc, ddy+m.H*dsc-m.dh*dsc, ddx+dside.span*dsc+36, m.fillH, {size:7.4});

  /* ---------- 시공 메모 ---------- */
  const ny = 1000;
  s += R(M+16, ny, SW-2*M-32, 82, {fill:'#FBFAF7', stroke:'#DDD6C8', sw:0.8});
  s += T(M+24, ny+14, '시공 메모', {size:6, weight:800, fill:SOFT, ls:'0.1em'});
  s += T(M+24, ny+27, '· 벽판 95T PB는 1000×600 2단(1000+1000=2000)으로 세우고, 상단 '+(m.H-CFG.HEAD)+'은 상부 밴드로 마감.', {size:6.4});
  s += T(M+24, ny+38, '· 코너는 110 합판 기둥으로 세로를 잡고, 문 면은 좌우 벽 사이(내폭 −190)에 끼워 시공.', {size:6.4});
  s += T(M+24, ny+49, '· 문 개구부 '+m.dw+'×'+m.dh+' + 상단 채움 '+m.dw+'×'+m.fillH+' — 문 상단 2000 레벨.', {size:6.4});
  s += T(M+24, ny+60, '· 벽체·바닥·천장 접합부는 실링 처리로 기밀 유지. 내부 1면 라인타공 아트보드.', {size:6.4});
  s += T(M+24, ny+71, '· 마루 '+CFG.MARU+'㎜ · 천장 65T · 몰딩 45T 마감. 문턱·개폐 방향은 현장 확인.', {size:6.4});

  s += titleBlock(m,{no:'A-103',title:'전개도·단면',scale:'1 : '+Math.round(3.7795/sc)});
  return sheetShell(s);
}

/* =====================================================================
   7. A-104 재단표 · 자재 산출표
   ===================================================================== */
function svgTable(x,y,w,cols,rows,opt={}){
  const fs = opt.fs||6.8, rowH = opt.rowH||13, headH = 15, grpH = 13.4;
  const totalW = sum(cols.map(c=>c.w));
  const xs=[x]; let cx=x;
  for(let i=0;i<cols.length;i++){ cx += w*cols[i].w/totalW; xs.push(cx); }
  let s=''; let cy=y;
  // header
  s += R(x,y,w,headH,{fill:INK,stroke:INK,sw:0.6});
  cols.forEach((c,i)=>{
    const right = c.align==='right', mid=c.align==='center';
    const tx = right? xs[i+1]-5 : (mid? (xs[i]+xs[i+1])/2 : xs[i]+5);
    s += T(tx, y+headH-4.8, c.label, {size:fs-0.2, fill:'#fff', weight:700, anchor: right?'end':(mid?'middle':'start'), ls:'0.03em'});
  });
  cy = y+headH;
  rows.forEach((r,ri)=>{
    if(r.type==='group'){
      s += R(x,cy,w,grpH,{fill:'#EFEAE1',stroke:'#DDD6C8',sw:0.5});
      s += T(x+4, cy+grpH-4.2, r.label, {size:fs-0.3, weight:800, fill:'#4A4237', ls:'0.04em'});
      cy += grpH;
      return;
    }
    const hh = r.h || rowH;
    s += R(x,cy,w,hh,{fill: ri%2? '#FCFBF8':'#fff', stroke:'none'});
    s += L(x,cy+hh,x+w,cy+hh,{stroke:'#E7E2D8',sw:0.45});
    r.cells.forEach((cell,i)=>{
      const c=cols[i];
      const right = c.align==='right', mid=c.align==='center';
      const tx = right? xs[i+1]-5 : (mid? (xs[i]+xs[i+1])/2 : xs[i]+5);
      s += T(tx, cy+hh-4.4, cell, {size:fs, anchor: right?'end':(mid?'middle':'start'), fill: i===0? '#2E353B':'#14171A', weight: i===2? 700:400, mono: c.mono!==false});
    });
    cy += hh;
  });
  s += R(x,y,w,cy-y,{fill:'none',stroke:'#C9C2B4',sw:0.6});
  return {svg:s, height:cy-y};
}

function sheetTables(m){
  let s = sheetHead('A-104','재단 치수표 · 자재 산출표','CUT LIST & BILL OF MATERIALS · 600 모듈 기준 자동 산출');
  s += pageNo('A-104',4,4);

  const groups = ['바닥 PB (2겹 교차)','천장 65T','벽판 95T PB','문·개구부','코너 110 합판','외벽 알판'];
  const rows = [];
  groups.forEach(g=>{
    const items = m.cut.filter(c=>c.group===g);
    if(!items.length) return;
    rows.push({type:'group', label:g});
    items.forEach(it=>{
      rows.push({cells:[
        (it.w)+' × '+(it.l),
        String(it.qty),
        Math.round(it.w*it.l*it.qty/1e4)/100 + ' ㎡',
        it.note||''
      ]});
    });
  });

  const t1 = svgTable(M+10, M+84, SW-2*M-20, [
    {label:'재단 규격 (가로 × 세로, ㎜)', w:1.85},
    {label:'수량', w:.5, align:'center'},
    {label:'면적', w:.95, align:'right'},
    {label:'부위 · 근거', w:2.5}
  ], rows, {rowH:12.4, fs:6.6});

  s += t1.svg;

  /* BOM */
  const by0 = M+84 + t1.height + 26;
  s += T(M+10, by0-8, '자재 산출표 (BOM)', {size:8.6, weight:800});
  s += T(M+10, by0+2, '단위면적 3.0㎡(1220×2440) 기준 · 할증 12% 포함', {size:6, fill:'#7B8389'});

  const bomRows = m.bom.map(b=>({cells:[
    b.mat, b.spec, b.amount+' '+b.unit, b.sheets!=null? b.sheets+' 장':(b.unit==='장'?'':'-'), b.note||''
  ]}));
  const t2 = svgTable(M+10, by0+8, SW-2*M-20, [
    {label:'자재', w:2.3},
    {label:'규격', w:1.2},
    {label:'소요량', w:.9, align:'right'},
    {label:'판재 환산', w:.9, align:'right'},
    {label:'비고', w:1.9}
  ], bomRows, {rowH:13, fs:6.6});
  s += t2.svg;

  /* 총괄 */
  const ty = by0 + 8 + t2.height + 22;
  s += R(M+10, ty, SW-2*M-20, 66, {fill:INK, stroke:INK, sw:1});
  const cells = [
    ['외경', m.W+' × '+m.D+' × '+m.H],
    ['바닥 면적', m.floorArea.toFixed(2)+' ㎡'],
    ['벽체 면적', m.wallArea.toFixed(2)+' ㎡'],
    ['내부 유효', m.innerW+' × '+m.innerD]
  ];
  cells.forEach((c,i)=>{
    const cxx = M+22 + i*(SW-2*M-40)/4;
    s += T(cxx, ty+22, c[0], {size:6, fill:'#9AA3A9', ls:'0.08em'});
    s += T(cxx, ty+40, c[1], {size:11, fill:'#fff', weight:700, mono:true});
  });

  /* 주의 */
  const wy = ty+80;
  s += T(M+10, wy+6, '※ 확인 사항', {size:6.6, weight:800, fill:WARN});
  s += T(M+10, wy+18, '· 재단 치수는 제작팀 손도면(1500×1800 · 2000×2000 등)에서 확인한 600 모듈·자투리·조인트 여유 규칙으로 산출했습니다.', {size:6.2, fill:'#4F585F'});
  s += T(M+10, wy+29, '· 문 면 자투리·현장 여유는 실측에 따라 ±10㎜ 보정하세요. 시공 전 바닥 수평·문 개폐 방향을 확인합니다.', {size:6.2, fill:'#4F585F'});
  s += T(M+10, wy+40, '· 65T 천장 마지막 판과 벽판 자투리는 손도면 값을 우선하며, 조인트 여유는 고급 설정에서 조정할 수 있습니다.', {size:6.2, fill:'#4F585F'});

  /* 발주 체크리스트 */
  const cy0 = wy + 62;
  s += R(M+10, cy0, SW-2*M-20, 96, {fill:'#FBFAF7', stroke:'#DDD6C8', sw:0.8});
  s += T(M+18, cy0+14, '발주 · 준비 체크리스트', {size:6, weight:800, fill:SOFT, ls:'0.1em'});
  const chk = [
    ['PB 18T (바닥 2겹)', m.bom[0].sheets+'장'],
    ['PB 18T (벽판 5겹)', m.bom[1].sheets+'장'],
    ['천장 65T', m.bom[2].amount+'㎡'],
    ['합판 18T (코너)', '1장'],
    ['백색 알판', m.bom[4].sheets+'장'],
    ['9T 아트보드', m.bom[5].sheets+'장'],
    ['고밀도 흡음재', m.bom[6].amount+'㎡'],
    ['강화마루', m.bom[7].note],
    ['45T 몰딩', m.bom[8].sheets+'개'],
    ['시스템도어', '1세트'],
    ['시창 아크릴', m.winCount? m.winCount+'개':'—'],
    ['실리콘·피스·압착', '현장 준비']
  ];
  chk.forEach((c,i)=>{
    const col = i%3, row = Math.floor(i/3);
    const cx = M+22 + col*((SW-2*M-60)/3), cyy = cy0+30+row*16;
    s += R(cx, cyy-7, 7, 7, {fill:'#fff', stroke:'#8A939A', sw:0.7});
    s += T(cx+12, cyy, c[0], {size:6.2, fill:'#4F585F'});
    s += T(cx+12+96, cyy, c[1], {size:6.2, weight:700, mono:true});
  });

  s += titleBlock(m,{no:'A-104',title:'재단표·자재표',scale:'N.T.S'});
  return sheetShell(s);
}

function verifyHTML(m){
  const refs = [
    {w:1500,d:1800,door:'front',name:'1500×1800',src:'손도면 IMG_0104·0105',
     floor:['600×1800×2','300×1800×1','600×1500×3'],
     ceil:['600×1500×2','570×1500×1'],
     wall:16, resid:['598','80'], note:'벽체 600×1000 = 16장'},
    {w:2000,d:2000,door:'front',name:'2000×2000',src:'손도면 IMG_0106·0111',
     floor:['600×2000×6','200×2000×2'],
     ceil:['600×2000×3','155×2000×1'],
     wall:18, resid:['580','418','200'], note:'벽체 600×1000 = 18장'},
    {w:1400,d:1800,door:'front',name:'1400×1800',src:'손도면 IMG_0109',
     floor:['600×1800×2','200×1800×1','600×1400×3'],
     ceil:['600×1800×2','170×1800×1'],
     wall:14, resid:['380','278'], note:'벽체 600×1000 = 14장'}
  ];
  const hit = refs.find(r=> r.w===m.W && r.d===m.D);
  if(!hit) return `<p style="margin:0 0 6px">현재 <b>${m.W}×${m.D}</b>는 손도면에 없는 규격입니다. 600 모듈·자투리·조인트 여유 규칙을 그대로 적용해 산출했습니다.</p>
    <p style="margin:0;color:#7B8389">프리셋을 누르면 제작팀 도면과 장수·치수를 나란히 대조해 볼 수 있습니다.</p>`;
  const mineWall = m.cut.filter(c=>c.group==='벽판 95T PB' && c.w===m.MOD && c.l===1000).reduce((a,c)=>a+c.qty,0);
  const ok = mineWall === hit.wall;
  const ceilTxt = m.ceil.pieces.map(p=>p.w+'×'+p.l).join(' · ');
  return `<p style="margin:0 0 8px">기준 <b>${hit.name}</b> <span style="color:#9AA4AC">(${hit.src})</span></p>
    <ul>
      <li>벽판 600×1000 — 도면 <b>${hit.wall}</b>장 / 산출 <b class="${ok?'ok':'no'}">${mineWall}</b>장 ${ok?'✓':'△'}</li>
      <li>바닥 — 도면 ${hit.floor.join(', ')}</li>
      <li class="ok">산출 ${merge([...m.floor.l1,...m.floor.l2]).map(p=>p.w+'×'+p.l+'×'+p.qty).join(', ')}</li>
      <li>천장 — 도면 ${hit.ceil.join(', ')}</li>
      <li class="ok">산출 ${ceilTxt}</li>
    </ul>`;
}

function syncURL(inp){
  const q = new URLSearchParams({w:inp.W,d:inp.D,h:inp.H,ds:inp.doorSide,da:inp.doorAlign});
  if(inp.winOn) q.set('win', inp.winSide+inp.winCount);
  try{ history.replaceState(null,'','?'+q.toString()); }catch(e){}
}

/* ---------- export ---------- */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000);
}
async function sheetPngBlob(id, scale){
  const wrap = document.querySelector('[data-sheet="'+id+'"]');
  if(!wrap) return null;
  const svg = wrap.querySelector('svg');
  const S = scale || 3;
  const clone = svg.cloneNode(true);
  clone.setAttribute('width', SW*S);
  clone.setAttribute('height', SH*S);
  if(!clone.getAttribute('xmlns')) clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const str = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([str], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  await new Promise((res, rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const cv = document.createElement('canvas');
  cv.width = SW*S; cv.height = SH*S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(img,0,0,cv.width,cv.height);
  URL.revokeObjectURL(url);
  return await new Promise(res=>cv.toBlob(res,'image/png'));
}
function fileBase(){
  const mm = state.model || {W:0,D:0,inp:{}};
  const site = (mm.inp.site||'현장').replace(/[^\w가-힣]+/g,'');
  return `BEO_${mm.W}x${mm.D}_${site}`;
}
async function exportSheet(id){
  const blob = await sheetPngBlob(id, 3);
  if(blob) download(blob, `${fileBase()}_${id.toUpperCase()}.png`);
}
/* --- ZIP (무압축) : 4장 한 번에 저장 --- */
function crc32(u8){
  let c, crc = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++){
    c = (crc ^ u8[i]) & 0xFF;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    crc = (crc>>>8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true); cd.setUint16(10,0,true); cd.setUint16(12,0,true); cd.setUint16(14,0,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,size,true); cd.setUint32(24,size,true);
    cd.setUint16(28,name.length,true); cd.setUint16(30,0,true); cd.setUint16(32,0,true);
    cd.setUint16(34,0,true); cd.setUint16(36,0,true); cd.setUint32(38,0,true); cd.setUint32(42,offset,true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true); eocd.setUint16(20,0,true);
  return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:'application/zip'});
}
async function exportAll(){
  const btn = $('#btnPngAll');
  const old = btn.textContent;
  btn.disabled = true;
  const files = [];
  for(let i=0;i<SHEETS.length;i++){
    btn.textContent = `저장 중 ${i+1}/${SHEETS.length}`;
    const blob = await sheetPngBlob(SHEETS[i].id, 3);
    if(blob) files.push({name: `${fileBase()}_${SHEETS[i].id.toUpperCase()}.png`, data: new Uint8Array(await blob.arrayBuffer())});
  }
  if(files.length) download(zipStore(files), `${fileBase()}_도면4장.zip`);
  btn.textContent = old;
  btn.disabled = false;
}
function m0(){ return state.model; }

/* =====================================================================
   9. 이벤트 · 초기화
   ===================================================================== */
function segInit(sel, key, def){
  const el = $(sel);
  state[key] = def;
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      state[key] = b.dataset.v;
      el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
      render();
    });
  });
}

function init(){
  // date
  const d = new Date();
  $('#date').value = d.toISOString().slice(0,10);

  segInit('#doorSide','doorSide','front');
  segInit('#doorAlign','doorAlign','center');

  $('#presets').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    $('#W').value = b.dataset.w; $('#D').value = b.dataset.d;
    render();
  });

  ['#site','#date','#dwgNo','#W','#D','#H','#doorW','#doorH','#winCount','#winSide','#winW','#winH','#mod','#joint','#ceilDir']
    .forEach(s=>{ const el=$(s); el.addEventListener('input', render); el.addEventListener('change', render); });

  $('#winOn').addEventListener('change', ()=>{
    $('#winFields').style.display = $('#winOn').checked ? '' : 'none';
    render();
  });

  $('#btnPrint').addEventListener('click', ()=>window.print());
  $('#btnPngAll').addEventListener('click', exportAll);

  // URL / 저장값 복원
  const q = new URLSearchParams(location.search);
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('beo-blueprint')||'null'); }catch(e){}
  const src = q.get('w') ? {W:q.get('w'),D:q.get('d'),H:q.get('h')||2280,doorSide:q.get('ds')||'front',doorAlign:q.get('da')||'center'} : (saved||{});
  if(src.W) $('#W').value = src.W;
  if(src.D) $('#D').value = src.D;
  if(src.H) $('#H').value = src.H;
  if(src.doorSide){
    state.doorSide = src.doorSide;
    $('#doorSide').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===src.doorSide)));
  }
  if(src.doorAlign){
    state.doorAlign = src.doorAlign;
    $('#doorAlign').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===src.doorAlign)));
  }
  if(src.winOn){ $('#winOn').checked = true; $('#winFields').style.display=''; if(src.winSide) $('#winSide').value=src.winSide; if(src.winCount) $('#winCount').value=src.winCount; }

  render();
}

init();
})();
